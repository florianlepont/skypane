# SkyPane -- repo-root lint/coverage configuration.
#
# Deliberately no [project] table: this repository is a deployed
# application (device firmware + server + stub server), not an installable
# Python distribution. Adding [project] metadata would misrepresent it to
# packaging tooling that scans for it.

[tool.ruff]
# Applies repo-wide: server/, stub-server/, adsb-test/.
# Production is Ubuntu 26.04's distro python3, which is 3.14.
target-version = "py314"

[tool.ruff.lint]
# Correctness families only (E4/E7/E9 pycodestyle+syntax, F pyflakes).
# UP and E501 excluded: unconfigured, this tree reports 397 findings,
# 328 UP031 alone (printf-style formatting used throughout server/) --
# a stylistic rewrite risk with no correctness benefit, not an oversight.
select = ["E4", "E7", "E9", "F"]

# E402 (import not at top) suppressed, not fixed: all 8 findings are the
# documented sys.path bootstrap in server/poll_loop.py (4), render.py (3)
# and enrich.py (1), needed so `server/.venv/bin/python3 server/poll_loop.py`
# (server/README.md's own invocation) resolves its `server.*` imports.
ignore = ["E402"]

[tool.pytest.ini_options]
minversion = "9.0"

# server/ has no __init__.py (test files run both as package members and
# direct scripts), so the default "prepend" import mode would pollute
# sys.path with server/'s own directory on the first same-named test
# module collision elsewhere in the tree.
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-p", "no:legacypath",
    # pytest-socket's allow-hosts mode patches only socket.connect, not
    # getaddrinfo/gethostbyname; conftest.py's autouse DNS-blocking
    # fixture closes that gap. --allow-unix-socket keeps AF_UNIX open;
    # loopback servers stay reachable via --allow-hosts.
    "--disable-socket",
    "--allow-unix-socket",
    "--allow-hosts=127.0.0.1,::1,localhost",
]
testpaths = ["server", "stub-server", "companion", "test-support", "deploy"]
# test-support/ holds shared contracts imported as `skypane_test_support`;
# both repo root and test-support/ must be on sys.path before collection.
pythonpath = [".", "test-support"]
markers = [
    "slow: takes more than a few seconds",
    "browser: drives a real Chromium through pytest-playwright (needs playwright install --only-shell chromium)",
]
# An xfail that unexpectedly passes is worth knowing about immediately,
# not silently tolerated.
xfail_strict = true

[tool.coverage.run]
# Each pytest-xdist worker, plus every subprocess a test launches
# (byos_server.py, companion/app.py), needs its own data file before
# pytest-cov's end-of-session `coverage combine` merges them. Do NOT set
# `append` too -- coverage.py rejects combining the two outright.
parallel = true

# coverage.py's subprocess-measurement mechanism (pytest-cov 7+ dropped
# its .pth-file auto-injection). Without it every subprocess-launched
# child (byos_server.py, companion/app.py) measures at a permanent 0%.
# Implies parallel=true above (kept explicit for its own documentation).
patch = ["subprocess"]

# coverage.py only saves a data file at normal interpreter exit unless
# this is set; every long-lived child above is stopped with SIGTERM
# (proc.terminate()). Without it, byos_server.py measured 50% instead
# of 91% on stub-server/test_poll_cycle.py alone.
sigterm = true

# Scoped to this project's own code so library internals (Pillow,
# requests, stdlib) never count toward the measurement. deploy/tests/
# itself and deploy/render_caddyfile.sh (a shell script) are
# deliberately not listed here.
source = ["server", "stub-server", "companion", "deploy/backup"]

omit = [
    # The measuring instrument, not the thing being measured. Leading `*/`
    # on purpose: coverage.py resolves a relative pattern against the
    # current directory of whichever process saves data, so a measured
    # subprocess started outside the repository root would otherwise record
    # every test file as an unexecuted 0% source file.
    "*/server/test_*.py",
    "*/stub-server/test_*.py",
    "*/companion/test_*.py",
]

[tool.coverage.report]
# Floor derivation: measured 93.38% total on 2026-09-25 (CPython 3.14.0rc2, ./scripts/run-all-tests.sh as non-root); ratchets upward only, never down.
fail_under = 93
