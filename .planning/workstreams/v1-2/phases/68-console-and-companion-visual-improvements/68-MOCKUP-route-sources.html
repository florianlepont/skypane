<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkyPane mockup: Route sources (Phase 68, plan 12)</title>
<style>
/* Standalone mockup, no external asset. Tokens follow companion/static/style.css (light and dark only).
   Each mock sits in a [data-viewport] box, 390 px (phone) or 1440 px (desktop); every translated block is a
   [data-lang] wrapper and the toggle at the top shows one language at a time. All names and addresses are invented. */
:root{
  --sky:linear-gradient(#E7EEF7,#F1F3F6 45%,#EDF1F6); --canvas:#F1F3F6; --stage:#E4E9F0;
  --text:#17191F; --muted:#5B6372; --border:#DAE1EB; --chip:#E9EEF5; --card:#fff;
  --accent:#1F2430; --on-accent:#fff; --glass:rgba(255,255,255,.78); --tab:#fff; --shadow:0 6px 20px rgba(20,30,50,.08);
  --ok:#16A34A; --okbg:#DDF3E4; --warn:#D97706; --err:#BE123C;
}
@media (prefers-color-scheme:dark){:root:not([data-ui-theme="light"]){
  --sky:linear-gradient(#12151D,#161A24 45%,#1A1F2B); --canvas:#161A24; --stage:#0E1117;
  --text:#F1F3F6; --muted:#A3ABBB; --border:#2A3040; --chip:#232A38; --card:#1C222D;
  --accent:#F2EFE9; --on-accent:#14171F; --glass:rgba(34,40,54,.82); --tab:#1C222D; --shadow:0 6px 20px rgba(0,0,0,.35);
  --ok:#4ADE80; --okbg:#173225; --warn:#FBBF24; --err:#FB7185; color-scheme:dark}}
:root[data-ui-theme="dark"]{
  --sky:linear-gradient(#12151D,#161A24 45%,#1A1F2B); --canvas:#161A24; --stage:#0E1117;
  --text:#F1F3F6; --muted:#A3ABBB; --border:#2A3040; --chip:#232A38; --card:#1C222D;
  --accent:#F2EFE9; --on-accent:#14171F; --glass:rgba(34,40,54,.82); --tab:#1C222D; --shadow:0 6px 20px rgba(0,0,0,.35);
  --ok:#4ADE80; --okbg:#173225; --warn:#FBBF24; --err:#FB7185; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--stage);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:32px 16px 96px}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.top{max-width:1500px;margin:0 auto 24px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end}
.top h1{margin:0 0 8px;font-size:34px;letter-spacing:-.03em}
.top p{margin:0;color:var(--muted);max-width:75ch}
.toggles{display:flex;gap:16px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--chip);border-radius:32px;padding:4px;gap:4px}
.seg button{border:0;background:none;min-height:44px;padding:0 16px;border-radius:32px;cursor:pointer;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.sec{max-width:1500px;margin:56px auto 0}
.sec>h2{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}
.sec>p.lead{margin:0 0 24px;color:var(--muted);max-width:85ch}
.row2{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.mock{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.mock>figcaption{font-size:15px;font-weight:600}
.mock>figcaption small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.scroller{max-width:100%;overflow-x:auto;padding-bottom:8px}
[data-ui-lang="en"] [data-lang="fr"],[data-ui-lang="fr"] [data-lang="en"]{display:none}
.note{margin:12px 0 0;padding:12px 16px;border:1px dashed var(--border);border-radius:14px;color:var(--muted);font-size:14px;max-width:85ch}
.note b{color:var(--text)}

[data-viewport]{position:relative;overflow:hidden;border:1px solid var(--border);background:var(--sky) var(--canvas);box-shadow:0 12px 40px rgba(20,30,50,.12)}
[data-viewport="phone"]{width:390px;height:780px;border-radius:36px}
[data-viewport="desktop"]{width:1440px;height:900px;border-radius:16px}
[data-viewport] [data-lang]{height:100%;position:relative}

/* shared pieces */
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;display:inline-block}
.dot.idle{background:var(--muted)}.dot.err{background:var(--err)}.dot.pend{background:var(--warn)}
.label{margin:0 0 6px 16px;font-size:13px;font-weight:600;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--border);border-radius:14px;background:var(--card);font-size:15px;font-weight:600;cursor:pointer}
.btn.dark{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.sq{width:44px;padding:0}
.field{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--border);border-radius:14px;background:var(--card)}
.field input{flex:1;min-width:0;border:0;background:none;min-height:42px;outline:0}
.title{margin:0;font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-.03em}
.sub{color:var(--muted);font-size:15px}
.state{margin:6px 0 0;display:flex;align-items:center;gap:8px;font-weight:600}

/* rows */
.item{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 16px;border-top:1px solid var(--border)}
.item:first-child{border-top:0}
.item .who{flex:1;min-width:0}
.item .who small{display:block;color:var(--muted);font-size:13px}
.item .who b{display:block;font-weight:600}
.item .val{color:var(--muted);font-size:14px;white-space:nowrap}
.ico{width:36px;height:36px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none}
.ico.ok{background:var(--okbg);color:var(--ok)}
.sw{flex:none;width:51px;height:31px;border-radius:31px;background:#7C8696;position:relative;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--accent)}.sw.on::after{left:22px}
.badge{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:32px;border:1px solid var(--border);font-size:12px;color:var(--muted)}
.range{height:6px;border-radius:6px;background:var(--border);position:relative;margin:14px 0 4px}
.range i{position:absolute;left:0;top:0;bottom:0;width:26%;border-radius:6px;background:var(--accent)}
.range b{position:absolute;left:26%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--accent)}
.section{display:flex;flex-direction:column}
.danger b{color:var(--err)}

/* frame list rows */
.frow{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 14px;border-top:1px solid var(--border);cursor:pointer}
.frow:first-child{border-top:0}
.frow .who{flex:1;min-width:0}
.frow .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .who small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .seen{font-size:13px;color:var(--muted);white-space:nowrap}
.frow.retired{opacity:.8}
.frow.sel{background:var(--chip)}
.chev{color:var(--muted)}

/* phone shell */
.ptop{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:700;letter-spacing:-.02em}
.screen{position:absolute;inset:64px 0 0 0;overflow-y:auto;padding:8px 16px 120px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen>*{flex-shrink:0}
.tabs{position:absolute;left:12px;right:12px;bottom:14px;display:flex;justify-content:space-around;padding:8px 6px;background:var(--tab);border:1px solid var(--border);border-radius:34px;box-shadow:0 8px 24px rgba(20,30,50,.14);z-index:6}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:60px;min-height:52px;border-radius:26px;font-size:11px;color:var(--text)}
.tab.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:32px;background:var(--card);border:1px solid var(--border);font-size:14px;white-space:nowrap}
.chip[aria-current="page"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.all{background:var(--chip)}
.anchors{position:sticky;top:-8px;z-index:3;margin:0 -16px;padding:8px 16px;display:flex;gap:8px;background:var(--canvas)}
.anchors button{flex:1;min-height:44px;border:1px solid var(--border);border-radius:32px;background:var(--card);font-size:14px;cursor:pointer}
.anchors button[aria-current="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.blk{scroll-margin-top:72px}

/* desktop shell */
.side{position:absolute;left:0;top:0;bottom:0;width:240px;padding:24px 16px;background:var(--glass);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.side .brand{padding:0 8px;margin-bottom:8px}
.space{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--chip);margin-bottom:8px}
.space span{flex:1;text-align:center;min-height:36px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:14px;font-weight:600;color:var(--muted)}
.space span.on{background:var(--accent);color:var(--on-accent)}
.nlabel{margin:12px 8px 0;font-size:13px;font-weight:600;color:var(--muted)}
.nav{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:14px;font-size:15px}
.nav.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.sep{height:1px;background:var(--border);margin:8px 0}
.signout{margin-top:auto}
.listp{position:absolute;left:240px;top:0;bottom:0;width:350px;background:var(--glass);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.listp .lhead{flex:none;padding:20px 16px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--border)}
.listp .lbody{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 20px;display:flex;flex-direction:column;gap:14px}
.main{position:absolute;left:590px;right:0;top:0;bottom:0;overflow-y:auto;padding:32px 44px 64px}
.dcol{display:flex;flex-direction:column;gap:24px;max-width:760px;margin-top:20px}
.titlerow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.iconbtns{display:flex;gap:8px;flex:none}
.sparkline{display:block;width:100%;height:44px}
.sub2{display:flex;flex-direction:column;gap:6px;width:100%;padding-left:48px;font-size:13px;color:var(--muted)}
.item.wrap{flex-wrap:wrap}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile2{display:flex;flex-direction:column;gap:6px;min-height:132px;padding:14px;border-radius:22px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);min-width:0}
.tile2 .th{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.tile2 .tv{font-size:19px;font-weight:700;letter-spacing:-.01em}
.tile2 .tm{font-size:13px;color:var(--muted)}
.tile2 .more{margin-top:auto;display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600}
.bigspark{display:block;width:100%;height:120px;color:var(--accent)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:12px 16px;border-top:1px solid var(--border);font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right}
.rtable{width:100%;border-collapse:collapse;font-size:14px}
.rtable th{text-align:left;color:var(--muted);font-weight:600;font-size:13px;padding:8px 16px}
.rtable td{padding:8px 16px;border-top:1px solid var(--border)}
.rtable td:last-child,.rtable th:last-child{text-align:right}
.banner{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-radius:18px;border:1px solid var(--warn);background:var(--card)}
.banner b{font-weight:700}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:32px;background:var(--chip);font-size:13px}
.pill.warn{background:var(--card);border:1px solid var(--warn)}
.unit{display:inline-flex;gap:4px;padding:3px;border-radius:12px;background:var(--chip)}
.unit span{min-height:32px;padding:0 12px;display:flex;align-items:center;border-radius:9px;font-size:13px}
.unit span.on{background:var(--accent);color:var(--on-accent);font-weight:600}
details.rd{border-top:1px solid var(--border)}
details.rd summary{min-height:48px;display:flex;align-items:center;padding:0 16px;font-size:14px;font-weight:600;cursor:pointer}
.outcomes{list-style:none;margin:0;padding:0}
.outcomes li{padding:10px 16px;border-top:1px solid var(--border)}
.outcomes p{margin:0;display:flex;align-items:center;gap:8px;font-weight:600}
.outcomes p span.n{margin-left:auto}
.outcomes small{display:block;color:var(--muted);font-size:13px;margin:2px 0 0 16px}
.rtable.l td:last-child,.rtable.l th:last-child{text-align:left}
.pagehead{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.backl{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:15px;font-weight:600}
.ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--ok) 0 47%,var(--border) 0);display:flex;align-items:center;justify-content:center;flex:none}
.ring b{width:48px;height:48px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:14px}
.vrow{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 16px;border-top:1px solid var(--border)}
.vrow .who{flex:1}
.btn.quiet{min-height:40px;font-weight:500;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

    var bk='<div class="card">'+row('check',true,t.backup,t.backupv,'')+facts([[t.lastbk,t.bkago]])+'</div>';
    var RO=window.__ro||'none';
    function dirRow(n,name,sub,ok,lastv,fl,fp){return '<div class="item wrap">'+lead(ok?'check':'info',ok?'ok':'')+'<span class="who"><small>'+sub+'</small><b>'+name+'</b></span><span class="val">'+(ok?t.reach:t.unr)+'</span></div>'+facts([[t.last,lastv],[t.l24,t.lk+' '+fl],[t.foundp,fp[0]],[t.failp,fp[1]]]);}
    var dirs='<div class="card">'+dirRow(1,t.rdA,t.rdAs,true,t.ago4,'63','94 %|2 %'.split('|'))+dirRow(2,t.rdB,t.rdBs,false,t.ago3h,'11','45 %|36 %'.split('|'))+'</div>';
    function ansbar(){return '<div class="card"><div class="item">'+lead('info')+'<span class="who"><small>'+t.ans+' · '+t.window+'</small><b>'+t.vrs+' 118 · '+t.adb+' 30</b></span></div><div style="padding:0 16px 14px"><div style="display:flex;height:12px;border-radius:12px;overflow:hidden"><span style="flex:118;background:var(--accent)"></span><span style="flex:30;background:var(--border)"></span></div></div></div>';}
    function cmpcard(){
      function o2(l,n,x,ok){return '<li><p><span class="dot'+(ok?'':' idle')+'"></span>'+l+'<span class="n num">'+n+'</span></p><small>'+x+'</small></li>';}
      function cr(c,a,b,v,warn){return '<tr><td>'+c+'</td><td class="num">'+a+'</td><td class="num">'+b+'</td><td><span class="pill'+(warn?' warn':'')+'">'+v+'</span></td></tr>';}
      return '<div class="card">'+row('check',true,t.rsT,t.rsV,'','<span class="val">86 %</span>')+'<ul class="outcomes">'+o2(t.same,128,t.samex,true)+o2(t.only,11,t.onlyx,false)+o2(t.diff,9,t.diffx,false)+'</ul>'+
        '<table class="rtable l"><thead><tr><th>'+t.cs+'</th><th>'+t.vrs+'</th><th>'+t.adb+'</th><th>'+t.verdict+'</th></tr></thead><tbody>'+cr('AFR1000','LFMN-LFPO','LFMN-LFPO',t.ok)+cr('EZY4411','LFBO-LFPO','LFBO-LFPO',t.ok)+cr('TVF3302','LFPO-DAAG','&mdash;',t.one,true)+cr('VLG8821','LFPO-LEBL','LEBL-LFPO',t.df,true)+'</tbody></table></div>';
    }
    var extra='';
    if(RO==='A'||RO==='B'||RO==='C')extra+=dirs;
    if(RO==='B')extra+=ansbar();
    if(RO==='C')extra+=cmpcard();
    return unreach+banner+'<div><p class="label">'+t.frameg+'</p><div style="display:flex;flex-direction:column;gap:12px">'+conn+batt+'</div></div>'+
      '<div><p class="label">'+t.serverdata+' · '+t.adminonly+'</p><div style="display:flex;flex-direction:column;gap:12px">'+fd+src+ident+extra+bk+'</div></div>';
  }
  function versionsContent(t){
    function v(n,date,note){return '<div class="item"><span class="who"><b class="num">'+n+'</b><small>'+date+' · '+note+'</small></span><a class="btn quiet" href="#">'+t.revert+'</a></div>';}
    var cur='<div class="card"><div class="item"><span class="who"><small>'+t.cur+'</small><b style="font-family:ui-monospace,Menlo,monospace;font-size:20px">v1.4.2</b><small>'+t.model+'</small></span><span class="badge">'+t.uptodate+'</span></div><div class="kv"><span>'+t.avail+'</span><span></span></div></div>';
    var list='<div class="card">'+v('v1.4.1','12 Oct','Battery reading fix')+v('v1.4.0','28 Sep','Quieter retired screen')+v('v1.3.9','3 Sep','Wake interval up to 1 h')+v('v1.3.8','17 Aug','Initial landscape support')+'</div>';
    return '<div><p class="label">'+t.device+'</p>'+cur+'</div><div><p class="label">'+t.prev+'</p>'+list+'</div>';
  }
  function detailPage(kind){
    return function(vp,t){
      var body=kind==='health'?healthContent(t):versionsContent(t);
      var head='<div class="pagehead"><a class="backl" href="#">'+ic('chev').replace('<svg','<svg style="transform:rotate(180deg)"')+t.backto+'Salon</a><h3 class="title"'+(vp==='phone'?' style="font-size:34px"':'')+'>'+(kind==='health'?t.health:t.versions)+'</h3></div>';
      if(vp==='phone')return phoneShell(t,head+body,0);
      return sidebar(t)+'<div class="main" style="left:240px"><div style="max-width:760px">'+head+'<div style="display:flex;flex-direction:column;gap:24px">'+body+'</div></div></div>';
    };
  }

  function iconBtns(t){return '<div class="iconbtns"><a class="btn sq" href="#" title="'+t.openpers+'" aria-label="'+t.openpers+'">'+ic('frame')+'</a><a class="btn sq" href="#" title="'+t.rename+'" aria-label="'+t.rename+'">'+ic('edit')+'</a></div>';}
  /* ---------- phone frame page ---------- */
  function phoneFrame(_v,t){
    var chipNames=['Salon','Cuisine','Chambre','Atelier','Terrasse','Mezzanine'];
    var chips='<div class="chips" role="navigation"><a class="chip all" href="#">'+ic('grid')+t.allframes+'</a>'+chipNames.map(function(n,i){return '<a class="chip" href="#"'+(i===0?' aria-current="page"':'')+'><span class="dot"></span>'+n+'</a>';}).join('')+'</div>';
    var head='<div class="titlerow"><div><h3 class="title" style="font-size:34px">Salon</h3><p class="state"><span class="dot"></span>'+t.online+'</p></div>'+iconBtns(t)+'</div>';
    var acts='';
    var anchors='<div class="anchors">'+['state','settings','access'].map(function(k,i){return '<button type="button" data-go="'+k+'"'+(i===0?' aria-current="true"':'')+'>'+t[k]+'</button>';}).join('')+'</div>';
    return phoneShell(t,chips+head+acts+anchors+tilesBlock(t)+settingsBlock(t)+accessBlock(t),0);
  }

  /* ---------- desktop ---------- */
  function desktopLive(_v,t){
    var f=LIVE[0];
    var head='<div class="titlerow" style="max-width:760px"><div><h3 class="title">'+f.n+'</h3><p class="state"><span class="dot err"></span>'+t.offline+' <span class="sub" style="font-weight:400">· '+t.seen(f.m)+'</span></p></div>'+iconBtns(t)+'</div>';
    return sidebar(t)+listPanel(t,true,false)+'<div class="main">'+head+'<div class="dcol">'+tilesBlock(t)+settingsBlock(t)+accessBlock(t)+'</div></div>';
  }
  function desktopRetired(_v,t){
    var head='<h3 class="title">Le Petit Cadre</h3><p class="state"><span class="dot idle"></span>'+t.retired+' <span class="sub" style="font-weight:400">· '+t.retiredOn+'</span></p>';
    var card='<div class="dcol"><div><p class="label">'+t.react+'</p><div class="card"><div class="item"><span class="who"><b>'+t.react+'</b><small>'+t.wake+'</small></span><a class="btn dark" href="#">'+t.react+'</a></div></div></div></div>';
    return sidebar(t)+listPanel(t,false,true)+'<div class="main">'+head+card+'</div>';
  }

  /* ---------- assemble ---------- */
  function mock(vp,caption,sub,builder){
    var langs=['en','fr'].map(function(l){return '<div data-lang="'+l+'">'+builder(vp,S[l])+'</div>';}).join('');
    var box='<div data-viewport="'+vp+'">'+langs+'</div>';
    return '<figure class="mock"><figcaption>'+caption+(sub?'<small>'+sub+'</small>':'')+'</figcaption>'+(vp==='desktop'?'<div class="scroller">'+box+'</div>':box)+'</figure>';
  }
  function section(h,lead,body,extra){return '<section class="sec"><h2>'+h+'</h2><p class="lead">'+lead+'</p>'+body+(extra||'')+'</section>';}
  var html='';
  html+=section('Sizing: three levels, you choose',
    'Both items sit on the Health page of a frame (admin only) and need the server to record more. <b>A. Status only (D-27):</b> a card per directory: reachable or not, last answer, lookups in the last 24 h, share that found a route, share that failed. New table in the history database written when a lookup really goes to the network (not on a cache hit), no extra request. About one plan. <b>B. A + who answered:</b> adds one value to say which directory answered each flight, and a bar on the Health page. Still no extra request. About one more small plan. <b>C. B + comparison per aircraft (D-26):</b> asks the other directory too for each new callsign, so both answers can be compared (same, only one, different). Doubles route requests for new callsigns (they are cached a day when empty and a month when found), touches the code that chooses the route drawn on the frame, which must not change (the display keeps using the directory order of today). About two to three plans and the most tests. Recommendation: A and B; C only if you want to see the 9-in-148 disagreements aircraft by aircraft.',
    '');
  html+=section('Level A: route directories status',
    'A card of the Health page, in the Server &amp; data group, after Identification. The second directory is shown unreachable to illustrate a problem.',
    '<div class="row2">'+mock('desktop','Health page, level A','',function(v,t){window.__ro='A';var r=detailPage('health')(v,t);window.__ro='none';return r;})+mock('phone','Health page, level A (phone)','Scroll inside the phone',function(v,t){window.__ro='A';var r=detailPage('health')(v,t);window.__ro='none';return r;})+'</div>');
  html+=section('Level B: A plus "answered by"',
    'One more bar: how many flights of the last 7 days were answered by each directory (the first one asked, or the fallback).',
    '<div class="row2">'+mock('desktop','Health page, level B','',function(v,t){window.__ro='B';var r=detailPage('health')(v,t);window.__ro='none';return r;})+'</div>');
  html+=section('Level C: B plus the comparison per aircraft',
    'A card like "Data sources: the sources agree", for the route directories: share of agreement, the three outcomes with their counts, and the last aircraft with both answers.',
    '<div class="row2">'+mock('desktop','Health page, level C','',function(v,t){window.__ro='C';var r=detailPage('health')(v,t);window.__ro='none';return r;})+mock('phone','Health page, level C (phone)','Scroll inside the phone',function(v,t){window.__ro='C';var r=detailPage('health')(v,t);window.__ro='none';return r;})+'</div>');
  document.getElementById('app').innerHTML=html;

  /* ---------- behaviour ---------- */
  document.querySelectorAll('[data-lang]').forEach(function(root){
    var screen=root.querySelector('.screen')||root.querySelector('.main');
    if(!screen)return;
    var gos=root.querySelectorAll('[data-go]');
    function mark(k){gos.forEach(function(b){if(b.dataset.go===k)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current');});}
    gos.forEach(function(b){b.addEventListener('click',function(){
      var target=root.querySelector('[data-sec="'+b.dataset.go+'"]');
      if(target){screen.scrollTo({top:target.offsetTop-64,behavior:'smooth'});mark(b.dataset.go);}
    });});
    if(gos.length){screen.addEventListener('scroll',function(){
      var best='state';
      root.querySelectorAll('[data-sec]').forEach(function(s){if(s.offsetTop-screen.scrollTop<140)best=(s.dataset.sec==='device'?'state':s.dataset.sec);});
      mark(best);
    });}
    root.querySelectorAll('.sw').forEach(function(s){s.addEventListener('click',function(){var on=s.classList.toggle('on');s.setAttribute('aria-checked',String(on));});});
  });
  var r=document.documentElement;
  r.setAttribute('data-ui-lang','en');
  document.querySelectorAll('#theme button').forEach(function(b){b.addEventListener('click',function(){
    if(b.dataset.t==='auto')r.removeAttribute('data-ui-theme');else r.setAttribute('data-ui-theme',b.dataset.t);
    document.querySelectorAll('#theme button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});
  });});
  document.querySelectorAll('#lang button').forEach(function(b){b.addEventListener('click',function(){
    r.setAttribute('data-ui-lang',b.dataset.l);r.lang=b.dataset.l;
    document.querySelectorAll('#lang button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});
  });});
})();
</script>
</html>
