  --ok:#16A34A; --okbg:#DDF3E4; --warn:#D97706; --err:#BE123C;
}
@media (prefers-color-scheme:dark){:root:not([data-ui-theme="light"]){
  --sky:linear-gradient(#12151D,#161A24 45%,#1A1F2B); --canvas:#161A24; --stage:#0E1117;
  --text:#F1F3F6; --muted:#A3ABBB; --border:#2A3040; --chip:#232A38; --card:#1C222D;
  --accent:#F2EFE9; --on-accent:#14171F; --glass:rgba(34,40,54,.82); --tab:#1C222D; --shadow:0 6px 20px rgba(0,0,0,.35);
  --ok:#4ADE80; --okbg:#173225; --warn:#FBBF24; --err:#FB7185; color-scheme:dark}}
:root[data-ui-theme="dark"]{
  --sky:linear-gradient(#12151D,#161A24 45%,#1A1F2B); --canvas:#161A24; --stage:#0E1117;
  --text:#F1F3F6; --muted:#A3ABBB; --border:#2A3040; --chip:#232A38; --card:#1C222D;
  --accent:#F2EFE9; --on-accent:#14171F; --glass:rgba(34,40,54,.82); --tab:#1C222D; --shadow:0 6px 20px rgba(0,0,0,.35);
  --ok:#4ADE80; --okbg:#173225; --warn:#FBBF24; --err:#FB7185; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--stage);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:32px 16px 96px}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.top{max-width:1500px;margin:0 auto 24px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end}

[data-viewport]{position:relative;overflow:hidden;border:1px solid var(--border);background:var(--sky) var(--canvas);box-shadow:0 12px 40px rgba(20,30,50,.12)}

/* shared pieces */
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.label{margin:0 0 6px 16px;font-size:13px;font-weight:600;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--border);border-radius:14px;background:var(--card);font-size:15px;font-weight:600;cursor:pointer}

.section{display:flex;flex-direction:column}

.frow .rt b{color:var(--text);font-size:15px}
.dir{display:inline-flex;vertical-align:-4px;margin-right:4px}.dir .ic{width:18px;height:18px}
.route{display:flex;align-items:center;gap:6px;font-size:15px}
.route .ic{width:16px;height:16px;color:var(--muted)}
.dtab{display:grid;grid-template-columns:72px 1.3fr 1.4fr .9fr .9fr;gap:16px;align-items:center;padding:14px 20px;border-top:1px solid var(--border)}
.dtab:first-child{border-top:0}
.dtab .pic{width:72px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--chip),var(--border))}
.dtab small{color:var(--muted);font-size:13px;display:block}
.dtab b{font-size:16px}
.hdr{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px;border:1px dashed var(--border);border-radius:16px;min-width:0}
.hdr h3{margin:0;font-size:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .iconbtn{flex:none}
.wlabel{font-size:12px;color:var(--muted);margin:10px 0 4px}
.acard{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:6px;position:relative;min-height:150px}
.acard .art{height:44px;border-radius:10px;background:linear-gradient(135deg,var(--chip),var(--border))}
.acard b{font-size:16px}
.acard small{color:var(--muted);font-size:13px}
.rar{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:32px;font-size:13px;font-weight:700;align-self:flex-start}
.rar .rd{width:8px;height:8px;border-radius:50%;background:currentColor}
.rar.r0{background:var(--chip);color:var(--text)}
.rar.r1{background:#d9f0ea;color:#0b5e4f}
.rar.r2{background:#eadcff;color:#5b21b6}
.rar.r3{background:#fde7c2;color:#8a4b00}
[data-ui-theme="dark"] .rar.r1{background:#12453b;color:#9ee6d3}[data-ui-theme="dark"] .rar.r2{background:#3b2766;color:#d9c2ff}[data-ui-theme="dark"] .rar.r3{background:#5a3a0a;color:#ffd99a}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chipn{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:32px;background:var(--accent);color:var(--on-accent)}
.hero{display:flex;flex-direction:column;gap:8px;padding:8px 4px 16px}
.nm{display:flex;align-items:center;gap:2px}.nm h3{margin:0;font-size:32px;line-height:1.05}
.ghostic{flex:none;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;color:var(--muted)}
.cad{display:flex;align-items:center;gap:0;color:var(--muted);font-size:15px}
.page2 .grid2{max-width:100%}
.widths{display:flex;flex-direction:column;gap:2px}
</style>

<div class="top">
  <div><h1>Flights, Airlines and Home title</h1><p>Mockup for the owner, on the real shell (CON-01: R01, R03, R04, R05, D-05, D-12). Sample data is invented. Use the toggles.</p></div>
  <div class="toggles">
    <div class="seg" id="theme" role="group" aria-label="Theme"><button type="button" data-t="auto" aria-pressed="true">Auto</button><button type="button" data-t="light" aria-pressed="false">Light</button><button type="button" data-t="dark" aria-pressed="false">Dark</button></div>
    <div class="seg" id="lang" role="group" aria-label="Language"><button type="button" data-l="en" aria-pressed="true">English</button><button type="button" data-l="fr" aria-pressed="false">Fran&ccedil;ais</button></div>
  </div>
</div>
<div id="app"></div>
<script>
(function(){
  function nb(s){return s.replace(/ ([:;?!»])/g,' $1').replace(/« /g,'« ');}
  var S={
    en:{tabs:['Home','Flights','Airlines','Style','Location','Account'],side:['Home','Flights','Airlines','Style','Location'],space:['Console','My frames'],acct:'Account',
      fl:'Flight history',today:'Today',dep:'Departing',arr:'Arriving',ago:['1 h ago','6 h ago','12 h ago'],
      depT:'Departure',arrT:'Arrival',filter:'Filter',close:'Close',
      al:'Airlines',spotted:'Spotted',seenN:function(n){return 'Seen '+n+' times';},seen1:'Seen once',rar:['Regular','Occasional','Rare'],newb:'New',
      type:'Aircraft',seenLast:'Last seen',total:'Seen',
      home:'Orly window',next:'Next refresh in 14 min',edit:'Rename frame',info:'About the refresh rhythm',quiet:'Quiet hours',quietV:'23:00 to 07:00',off:'Off',
      first:'First seen',route:'Route'},
    fr:{tabs:['Accueil','Vols','Airlines','Style','Lieu','Compte'],side:['Accueil','Vols','Airlines','Style','Lieu'],space:['Console','Mes cadres'],acct:'Compte',
      fl:'Historique des vols',today:'Aujourd’hui',dep:'Au départ',arr:'À l’arrivée',ago:['il y a 1 h','il y a 6 h','il y a 12 h'],
      depT:'Départ',arrT:'Arrivée',filter:'Filtrer',close:'Fermer',
      al:'Airlines',spotted:'Repérées',seenN:function(n){return 'Vue '+n+' fois';},seen1:'Vue une fois',rar:['Habituelle','Occasionnelle','Rare'],newb:'Nouveau',
      type:'Avion',seenLast:'Dernière fois',total:'Vue',
      home:'Orly window',next:'Prochain rafraîchissement dans 14 min',edit:'Renommer le cadre',info:'À propos du rythme de rafraîchissement',quiet:'Heures calmes',quietV:'23:00 à 07:00',off:'Éteint',
      first:'Première fois',route:'Trajet'}
  };
  Object.keys(S.fr).forEach(function(k){var v=S.fr[k];if(typeof v==='string')S.fr[k]=nb(v);else if(Array.isArray(v))S.fr[k]=v.map(nb);});
  function ic(n){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-'+n+'"/></svg>';}
  var TI=['frame','clock','tag','grid','fleet','user'];
  function userSide(t,on){
    return '<div class="side"><span class="brand">'+ic('logo')+'SkyPane</span><div class="space"><span class="on">'+ic('check')+t.space[1]+'</span><span>'+t.space[0]+'</span></div><div class="sep"></div>'+
      t.side.map(function(x,i){return '<div class="nav'+(on===i?' on':'')+'">'+ic(TI[i])+x+'</div>';}).join('')+'<div class="sep"></div><div class="nav">'+ic('user')+t.acct+'</div></div>';
  }
  function userPhone(t,inner,on){
    return '<div class="ptop"><span class="brand">'+ic('logo')+'SkyPane</span></div><div class="screen">'+inner+'</div><div class="tabs">'+t.tabs.map(function(x,i){return '<div class="tab'+(on===i?' on':'')+'">'+ic(TI[i])+x+'</div>';}).join('')+'</div>';
  }
  function wrap(vp,t,inner,on){
    if(vp==='phone')return userPhone(t,inner,on);
    return userSide(t,on)+'<div class="main" style="left:240px"><div class="page2">'+inner+'</div></div>';
  }
  function dirIc(kind,t){return '<span class="dir" role="img" aria-label="'+(kind==='dep'?t.depT:t.arrT)+'">'+ic(kind==='dep'?'plane':'down')+'</span>';}
  var ROWS=[['Air France','AFR1000','LFMN','LFPO','A320','arr',0,'21:56'],['Air France','AFR2210','LFPO','LFML','A321neo','dep',1,'16:38'],['easyJet','EZY4411','LFBO','LFPO','A320','arr',2,'11:20'],['Transavia France','TVF3302','LFPO','DAAG','737-800','dep',2,'06:02']];
  function rowToday(t,r){return '<div class="frow"><span class="pic"></span><span class="mid"><b>'+r[0]+'</b><span class="route">'+(r[5]==='arr'?'<b>'+r[2]+'</b> → '+r[3]:r[2]+' → <b>'+r[3]+'</b>')+'</span><small>'+(r[5]==='arr'?t.arr:t.dep)+' · '+r[4]+'</small></span><span class="rt"><span>'+t.ago[r[6]]+'</span><b>'+r[7]+'</b></span></div>';}
  function rowProp(t,r){return '<div class="frow"><span class="pic"></span><span class="mid"><b>'+r[0]+'</b><span class="route">'+dirIc(r[5],t)+r[2]+ic('chev')+r[3]+'</span></span><span class="rt"><b>'+r[7]+'</b><span>'+t.ago[r[6]]+'</span></span></div>';}
  function flightsPage(t,mode){
    var head='<div class="pagehead"><h3 class="title" style="font-size:34px;margin:0">'+t.fl+'</h3></div>';
    var seg='<div class="seg" style="align-self:flex-start"><button type="button" aria-pressed="true">All</button><button type="button" aria-pressed="false">'+t.dep+'</button><button type="button" aria-pressed="false">'+t.arr+'</button></div>';
    var rows=ROWS.map(function(r){return mode==='today'?rowToday(t,r):rowProp(t,r);}).join('');
    return head+seg+'<p class="label">'+t.today+'</p><div class="card vlist">'+rows+'</div>';
  }
  function flightsDesktop(t){
    var head='<div class="hdr" style="border:0;padding:0"><h3 class="title" style="font-size:40px">'+t.fl+'</h3><a class="iconbtn" href="#" aria-label="'+t.filter+'">'+ic('search')+'</a></div>';
    var rows=ROWS.map(function(r){return '<div class="dtab"><span class="pic"></span><span><b>'+r[0]+'</b><small>'+r[1]+'</small></span><span class="route">'+dirIc(r[5],t)+'<b>'+r[2]+'</b>'+ic('chev')+'<b>'+r[3]+'</b></span><span><b>'+r[4]+'</b></span><span style="text-align:right"><b>'+r[7]+'</b><small>'+t.ago[r[6]]+'</small></span></div>';}).join('');
    return head+'<p class="label">'+t.today+'</p><div class="card vlist">'+rows+'</div>';
  }
  function hdrAt(t,w){
    return '<div class="widths"><p class="wlabel">'+w+' px</p><div class="hdr" style="width:'+w+'px;max-width:100%"><h3>'+t.fl+'</h3><a class="iconbtn" href="#" aria-label="Search">'+ic('search')+'</a></div></div>';
  }
  function widths(t){return [320,360,480,768].map(function(w){return hdrAt(t,w);}).join('');}
  function rarCard(t,n,i,name,isNew){
    var r=t.rar[i];
    return '<div class="acard">'+(isNew?'<span class="chipn">'+t.newb+'</span>':'')+'<span class="art"></span><b>'+name+'</b><small>'+(n===1?t.seen1:t.seenN(n))+'</small><span class="rar r'+i+'"><span class="rd"></span>'+r+'</span></div>';
  }
  function airlinesPage(t){
    return '<div class="pagehead"><h3 class="title" style="font-size:34px;margin:0">'+t.al+'</h3></div><div class="grid2">'+
      rarCard(t,15,0,'Air France')+rarCard(t,10,0,'easyJet')+rarCard(t,9,1,'Transavia France')+rarCard(t,1,2,'Air Algérie',true)+'</div>';
  }
  function detailBody(t){
    return '<div style="display:flex;gap:14px;align-items:center"><span class="art" style="width:110px;height:56px;border-radius:12px;background:linear-gradient(135deg,var(--chip),var(--border));flex:none"></span><span><b style="font-size:20px">Air Algérie</b><br><span class="rar r2" style="margin-top:6px"><span class="rd"></span>'+t.rar[2]+'</span></span></div>'+
      '<div class="card vlist" style="margin:0"><div class="arow kv"><span>'+t.total+'</span><b>'+t.seen1.toLowerCase()+'</b></div><div class="arow kv"><span>'+t.seenLast+'</span><b>17 Nov</b></div><div class="arow kv"><span>'+t.type+'</span><b>737-800</b></div></div>';
  }
  function sheet(t,vp,closeKind){
    var close=closeKind==='text'?'<a class="btn" href="#" style="align-self:stretch;justify-content:center">'+t.close+'</a>':'';
    var x=closeKind==='icon'?'<a class="iconbtn" href="#" aria-label="'+t.close+'" style="position:absolute;top:10px;right:10px">'+ic('x')+'</a>':'';
    var cls=vp==='phone'?'sheet':'dlg';
    return '<div class="scrim"></div><div class="'+cls+'" role="dialog" style="'+(vp==='phone'?'':'')+'">'+(vp==='phone'?'<span class="grab"></span>':'')+x+detailBody(t)+close+'</div>';
  }
  function homeTitle(t,mode){
    var cad=mode==='today'?'<div class="cad"><span>'+t.next+'</span><span style="margin-left:auto;display:inline-flex;width:20px">'+ic('info')+'</span></div>':
      '<div class="cad"><span>'+t.next+'</span><a class="ghostic" href="#" aria-label="'+t.info+'" style="margin-left:-2px">'+ic('info')+'</a></div>';
    var nm=mode==='today'?'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><h3 style="margin:0;font-size:32px;line-height:1.05;max-width:150px">'+t.home+'</h3><span style="color:var(--muted);padding-top:6px">'+ic('edit')+'</span></div>':
      '<div class="nm"><h3>'+t.home+'</h3><a class="ghostic" href="#" aria-label="'+t.edit+'">'+ic('edit')+'</a></div>';
    var quiet='<div class="card vlist"><div class="arow link"><span class="who"><b>'+t.quiet+'</b><small class="ln">'+t.off+' · <a href="#" style="'+(mode==='today'?'text-decoration:underline':'display:inline-flex;align-items:center;min-height:44px;text-decoration:underline')+'">'+t.quietV+'</a></small></span>'+ic('chev')+'</div></div>';
    return '<div class="hero">'+nm+'<span class="chipv new" style="margin:0;align-self:flex-start">Online</span>'+cad+'</div>'+quiet;
  }
  function mock(vp,caption,sub,builder){
    var langs=['en','fr'].map(function(l){return '<div data-lang="'+l+'">'+builder(vp,S[l])+'</div>';}).join('');
    return '<figure class="mock"><figcaption>'+caption+(sub?'<small>'+sub+'</small>':'')+'</figcaption>'+(vp==='desktop'?'<div class="scroller"><div data-viewport="desktop">'+langs+'</div></div>':'<div data-viewport="phone">'+langs+'</div>')+'</figure>';
  }
  function section(h,lead,body){return '<section class="sec"><h2>'+h+'</h2><p class="lead">'+lead+'</p>'+body+'</section>';}
  var html='';
  html+=section('1. Flights rows (R03)',
    'Today a row says three things twice: the airline, the route in bold, then "Arriving / Departing" and the aircraft. Proposed: airline, one route line with a small direction icon (a plane going up for a departure, down for an arrival; the word stays as spoken text) and the time with its age. The aircraft type is in the flight detail, not the row. On desktop the rows become a table with a larger thumbnail and columns: airline and callsign, route, aircraft, time.',
    '<div class="row2">'+mock('phone','Today','',function(v,t){return wrap(v,t,flightsPage(t,'today'),1);})+mock('phone','Proposed','',function(v,t){return wrap(v,t,flightsPage(t,'prop'),1);})+'</div><div style="height:32px"></div><div class="row2">'+mock('desktop','Proposed, desktop','',function(v,t){return wrap(v,t,flightsDesktop(t),1);})+'</div>');
  html+=section('2. Flights header at narrow widths (D-05)',
    'The title and the search button share one row at every width from 320 px; the title is cut with an ellipsis before the button is ever pushed under it.',
    '<div class="row2">'+mock('phone','Header at 320, 360, 480 and 768 px','',function(v,t){return '<div class="screen" style="padding-top:20px">'+widths(t)+'</div>';})+'</div>');
  html+=section('3. Airlines: rarity and the detail sheet (R04, R05)',
    'Today the rarity is a word in bold colour at the end of a line. Proposed: a filled pill with a dot on every card, three tones that keep the current names (Regular neutral, Occasional green, Rare violet), always with the word so colour is never the only signal. The detail sheet shows everything at once with no inner scroll; Close becomes a light button.',
    '<div class="row2">'+mock('phone','Cards','',function(v,t){return wrap(v,t,airlinesPage(t),2);})+mock('phone','Detail, text Close','',function(v,t){return wrap(v,t,airlinesPage(t),2).replace('</div><div class="tabs">','</div>'+sheet(t,'phone','text')+'<div class="tabs">');})+mock('phone','Detail, icon Close','',function(v,t){return wrap(v,t,airlinesPage(t),2).replace('</div><div class="tabs">','</div>'+sheet(t,'phone','icon')+'<div class="tabs">');})+'</div>');
  html+=section('4. Home title row (R01) and the quiet-hours link (D-12)',
    'The pencil sits right after the name, as a 44 px quiet button, instead of floating at the far corner. The cadence "i" sits at the end of the refresh sentence with its own 44 px target. The quiet-hours time range is a 44 px link.',
    '<div class="row2">'+mock('phone','Today','',function(v,t){return wrap(v,t,homeTitle(t,'today'),0);})+mock('phone','Proposed','',function(v,t){return wrap(v,t,homeTitle(t,'prop'),0);})+'</div>');
  document.getElementById('app').innerHTML=html;
  var r=document.documentElement;r.setAttribute('data-ui-lang','en');
  document.querySelectorAll('#theme button').forEach(function(b){b.addEventListener('click',function(){
    if(b.dataset.t==='auto')r.removeAttribute('data-ui-theme');else r.setAttribute('data-ui-theme',b.dataset.t);
    document.querySelectorAll('#theme button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});});});
  document.querySelectorAll('#lang button').forEach(function(b){b.addEventListener('click',function(){
    r.setAttribute('data-ui-lang',b.dataset.l);r.lang=b.dataset.l;
    document.querySelectorAll('#lang button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});});});
})();
</script>
</html>
