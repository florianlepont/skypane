  --text:#F1F3F6; --muted:#A3ABBB; --border:#2A3040; --chip:#232A38; --card:#1C222D;

  <symbol id="i-frame" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><rect x="7" y="8" width="10" height="8" rx="1"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8z"/></symbol>
</svg>
<div class="top">
  <div><h1>Users and invitation</h1><p>Mockup for the owner, on the real shell (CON-01: R25, R26). Sample data is invented. Use the toggles.</p></div>
  <div class="toggles">
    <div class="seg" id="theme" role="group" aria-label="Theme"><button type="button" data-t="auto" aria-pressed="true">Auto</button><button type="button" data-t="light" aria-pressed="false">Light</button><button type="button" data-t="dark" aria-pressed="false">Dark</button></div>
    <div class="seg" id="lang" role="group" aria-label="Language"><button type="button" data-l="en" aria-pressed="true">English</button><button type="button" data-l="fr" aria-pressed="false">Fran&ccedil;ais</button></div>
  </div>
</div>
<div id="app"></div>
<script>
(function(){
  function nb(s){return s.replace(/ ([:;?!»])/g,' $1').replace(/« /g,'« ');}
  var S={
    en:{title:'Users',count:'4 users',invite:'+ Invite a user',colU:'User',colR:'Role',colF:'Frames',colL:'Last sign-in',colA:'Active',
      admin:'Administrator',user:'User',you:'You',active:'Active',waiting:'Invited, not signed in yet',now:'just now',never:'Never signed in',frames:function(n){return n+(n===1?' frame':' frames');},
      mReset:'Reset sign-in',mNew:'Send a new invitation',mDel:'Delete user',
      invT:'Invite a user',email:'Email address',role:'Role',invGo:'Invite',cancel:'Cancel',
      resT:'Invitation ready',resL:'Send this link to ',resH:'It is shown only once. They choose their password and sign in.',copy:'Copy',copied:'Copied',done:'Done',
      proT:'Make this person an administrator?',proW:'user-a@example.test will be able to manage every frame, every user and every setting.',proGo:'Make administrator',proKeep:'Keep as user',
      delT:'Delete this user?',delW:'user-b@example.test is removed from SkyPane and loses access to their frames. This cannot be undone.',delGo:'Delete user',delKeep:'Keep this user',
      tabs:['Fleet','Team','Editor','Journal','More'],nav:['Fleet','Users','Editor','Audit log'],account:'Account',space:['Console','My frames'],adminl:'Administration',signout:'Sign out',more:'More actions'},
    fr:{title:'Utilisateurs',count:'4 utilisateurs',invite:'+ Inviter un utilisateur',colU:'Utilisateur',colR:'Rôle',colF:'Cadres',colL:'Dernière connexion',colA:'Actif',
      admin:'Administrateur',user:'Utilisateur',you:'Vous',active:'Actif',waiting:'Invité, pas encore connecté',now:'à l’instant',never:'Jamais connecté',frames:function(n){return n+(n===1?' cadre':' cadres');},
      mReset:'Réinitialiser la connexion',mNew:'Envoyer une nouvelle invitation',mDel:'Supprimer l’utilisateur',
      invT:'Inviter un utilisateur',email:'Adresse e-mail',role:'Rôle',invGo:'Inviter',cancel:'Annuler',
      resT:'Invitation prête',resL:'Envoyez ce lien à ',resH:'Il n’est affiché qu’une fois. La personne choisit son mot de passe et se connecte.',copy:'Copier',copied:'Copié',done:'Terminé',
      proT:'Nommer cette personne administrateur ?',proW:'user-a@example.test pourra gérer tous les cadres, tous les utilisateurs et tous les réglages.',proGo:'Nommer administrateur',proKeep:'Garder utilisateur',
      delT:'Supprimer cet utilisateur ?',delW:'user-b@example.test est retiré de SkyPane et perd l’accès à ses cadres. Cette action est définitive.',delGo:'Supprimer l’utilisateur',delKeep:'Garder cet utilisateur',
      tabs:['Flotte','Équipe','Éditeur','Journal','Plus'],nav:['Flotte','Utilisateurs','Éditeur','Journal d’audit'],account:'Compte',space:['Console','Mes cadres'],adminl:'Administration',signout:'Se déconnecter',more:'Plus d’actions'}
  };
  Object.keys(S.fr).forEach(function(k){var v=S.fr[k];if(typeof v==='string')S.fr[k]=nb(v);else if(Array.isArray(v))S.fr[k]=v.map(nb);});
  function ic(n){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-'+n+'"/></svg>';}
  function sw(on,dis){return '<span class="sw'+(on?' on':'')+'" style="'+(dis?'opacity:.4':'')+'" role="switch" aria-checked="'+on+'" tabindex="0"></span>';}
  var USERS=[['admin@example.test','A','admin','act',2,'now',true],['user-a@example.test','U','user','act',2,'now',false],['user-b@example.test','U','user','inv',1,'never',false],['frameless@example.test','F','user','inv',0,'never',false]];
  function sidebar(t){
    var icons=['fleet','team','tag','clock'];
    return '<div class="side"><span class="brand">'+ic('logo')+'SkyPane</span><div class="space"><span>'+t.space[1]+'</span><span class="on">'+ic('check')+t.space[0]+'</span></div><div class="sep"></div><div class="nlabel">'+t.adminl+'</div>'+
      t.nav.map(function(x,i){return (i===2?'<div class="sep"></div>':'')+'<div class="nav'+(i===1?' on':'')+'">'+ic(icons[i])+x+'</div>';}).join('')+
      '<div class="sep"></div><div class="nav">'+ic('user')+t.account+'</div><div class="signout"><a class="btn" href="#">'+t.signout+'</a></div></div>';
  }
  function phoneShell(t,inner,overlay){
    var icons=['fleet','team','tag','clock','more'];
    return '<div class="ptop"><span class="brand">'+ic('logo')+'SkyPane</span></div><div class="screen">'+inner+'</div><div class="tabs">'+t.tabs.map(function(x,i){return '<div class="tab'+(i===1?' on':'')+'">'+ic(icons[i])+x+'</div>';}).join('')+'</div>'+(overlay||'');
  }
  function statusChips(t,u){
    var c=u[6]?'<span class="chip2 ok">'+t.active+'</span> <span class="chip2">'+t.you+'</span>':(u[3]==='act'?'<span class="chip2 ok">'+t.active+'</span>':'<span class="chip2 wait">'+t.waiting+'</span>');
    return c;
  }
  function menu(t){return '<div class="menu" role="menu"><a href="#">'+ic('send')+t.mNew+'</a><a href="#">'+t.mReset+'</a><a href="#" class="dg">'+ic('trash')+t.mDel+'</a></div>';}
  function table(t,withMenu){
    var head='<tr><th>'+t.colU+'</th><th>'+t.colR+'</th><th>'+t.colF+'</th><th>'+t.colL+'</th><th>'+t.colA+'</th><th style="width:56px"></th></tr>';
    var rows=USERS.map(function(u,i){
      var role=u[2]==='admin'?'<span class="rolesel" style="background:transparent;border-color:transparent;color:var(--muted);padding-left:0">'+t.admin+'</span>':'<span class="rolesel">'+t.user+' '+ic('down')+'</span>';
      var last=u[5]==='now'?t.now:t.never;
      return '<tr><td><span class="who2"><span class="ico">'+u[1]+'</span><span style="min-width:0"><span class="em">'+u[0]+'</span>'+statusChips(t,u)+'</span></span></td><td>'+role+'</td><td class="num">'+t.frames(u[4])+'</td><td class="sub">'+last+'</td><td>'+sw(true,u[6])+'</td><td style="position:relative;text-align:right">'+(u[6]?'':'<span class="btn sq" style="border:0;background:none" aria-label="'+t.more+'">'+ic('more')+'</span>')+(withMenu&&i===2?menu(t):'')+'</td></tr>';
    }).join('');
    return '<div class="card" style="overflow:visible"><table class="utable">'+head+rows+'</table></div>';
  }
  function cards(t){
    return '<div class="card">'+USERS.map(function(u){
      var role=u[2]==='admin'?t.admin:t.user;
      return '<div class="ucard"><span class="ico">'+u[1]+'</span><span class="grow"><span class="em" style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+u[0]+'</span><span>'+statusChips(t,u)+'</span><small>'+role+' · '+t.frames(u[4])+'</small></span><span class="acts">'+sw(true,u[6])+(u[6]?'':'<span class="btn sq" style="border:0;background:none" aria-label="'+t.more+'">'+ic('more')+'</span>')+'</span></div>';
    }).join('')+'</div>';
  }
  function page(vp,t,o){
    o=o||{};
    var head=vp==='phone'
      ?'<div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><h3 class="title" style="font-size:34px">'+t.title+'</h3><a class="btn dark" href="#" aria-label="'+t.invite+'">'+ic('plus')+'</a></div><span class="sub">'+t.count+'</span>'
      :'<div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h3 class="title">'+t.title+'</h3><a class="btn dark" href="#">'+t.invite+'</a></div><span class="sub">'+t.count+'</span>';
    var body=vp==='phone'?cards(t):table(t,o.menu);
    if(vp==='phone')return phoneShell(t,head+body,o.overlay);
    return sidebar(t)+'<div class="main" style="left:240px"><div style="max-width:1100px;display:flex;flex-direction:column;gap:14px">'+head+body+'</div></div>'+(o.overlay||'');
  }
  function ov(c,mid){return '<div class="scrim"></div><div class="dlg '+(mid?'mid':'dtop')+' dlgd" role="dialog">'+c+'</div><div class="sheet sheetd" role="dialog"><span class="grab"></span>'+c+'</div>';}
  function invDlg(t){return ov('<h4>'+t.invT+'</h4><label class="mfield"><span>'+t.email+'</span><span class="field" style="min-height:48px"><input type="email" placeholder="name@example.com" aria-label="'+t.email+'" autofocus></span></label><div class="mfield"><span>'+t.role+'</span><div class="segc" role="group" aria-label="'+t.role+'"><span class="on">'+t.user+'</span><span>'+t.admin+'</span></div></div><div class="row"><a class="btn" href="#">'+t.cancel+'</a><a class="btn dark" href="#">'+t.invGo+'</a></div>');}
  function resDlg(t){return ov('<h4>'+t.resT+'</h4><span>'+t.resL+'<b>new.person@example.test</b></span><div class="linkbox"><code>https://skypane.example/invite/Qm9…9xA</code><a class="btn dark" href="#" style="min-height:40px">'+ic('copy')+t.copy+'</a></div><span class="sub">'+t.resH+'</span><div class="row"><a class="btn dark" href="#">'+t.done+'</a></div>');}
  function confirmDlg(kind){return function(t){
    var T=kind==='pro'?t.proT:t.delT,W=kind==='pro'?t.proW:t.delW,G=kind==='pro'?t.proGo:t.delGo,K=kind==='pro'?t.proKeep:t.delKeep;
    return ov('<h4>'+T+'</h4><p>'+W+'</p><div class="row"><a class="btn" href="#">'+K+'</a><a class="btn '+(kind==='pro'?'dark':'')+'" href="#" style="'+(kind==='del'?'background:var(--err);color:#fff;border-color:var(--err)':'')+'">'+G+'</a></div>',true);};}
  function mock(vp,caption,sub,builder){
    var langs=['en','fr'].map(function(l){return '<div data-lang="'+l+'">'+builder(vp,S[l])+'</div>';}).join('');
    return '<figure class="mock"><figcaption>'+caption+(sub?'<small>'+sub+'</small>':'')+'</figcaption>'+(vp==='desktop'?'<div class="scroller"><div data-viewport="desktop">'+langs+'</div></div>':'<div data-viewport="phone">'+langs+'</div>')+'</figure>';
  }
  function section(h,lead,body,extra){return '<section class="sec"><h2>'+h+'</h2><p class="lead">'+lead+'</p>'+body+(extra||'')+'</section>';}
  var html='';
  html+=section('1. Desktop: the Users page',
    'Same real shell. The table keeps its columns. The copy-link icon in the Active column is gone (it copied a message, not a link, and was easy to misread). For a person who has not signed in yet, the row menu offers <b>Send a new invitation</b>, which creates a fresh link, plus Reset sign-in and Delete user.',
    '<div class="row2">'+mock('desktop','Users','',function(v,t){return page(v,t);})+'</div>'+
    '<div style="height:32px"></div><div class="row2">'+mock('desktop','Row menu','Send a new invitation, Reset sign-in, Delete user',function(v,t){return page(v,t,{menu:true});})+'</div>');
  html+=section('2. The invitation (R25, R26)',
    'The invite dialog follows the design system: an opaque card over a dimmed page on desktop, a bottom sheet with a grabber and 28 px top corners on phone. It is short: a title, the labelled email field, the role as two choices (User, Administrator) and two buttons. No explanatory paragraph and no odd margins. The field is the first thing in the sheet, so it stays above the keyboard. After <b>Invite</b>, SkyPane creates the sign-in account and shows the invitation link <b>once</b> with a Copy button: the person opens it, chooses a password and signs in. Nothing is stored or logged; a lost link is replaced with &ldquo;Send a new invitation&rdquo;.',
    '<div class="row2">'+mock('desktop','Invite dialog','',function(v,t){return page(v,t,{overlay:invDlg(t)});})+mock('desktop','Invitation ready','The link is shown once',function(v,t){return page(v,t,{overlay:resDlg(t)});})+'</div>'+
    '<div style="height:32px"></div><div class="row2">'+mock('phone','Users (phone)','',function(v,t){return page(v,t);})+mock('phone','Invite, as a bottom sheet','Field first, above the keyboard',function(v,t){return page(v,t,{overlay:invDlg(t)});})+mock('phone','Invitation ready','',function(v,t){return page(v,t,{overlay:resDlg(t)});})+'</div>');
  html+=section('3. Confirmations (R25)',
    'Role change and deletion: a title, one sentence with the consequence, two buttons. Tight and even margins; the longer explanation that was above and below is gone.',
    '<div class="row2">'+mock('desktop','Make administrator','',function(v,t){return page(v,t,{overlay:confirmDlg('pro')(t)});})+mock('phone','Delete user','',function(v,t){return page(v,t,{overlay:confirmDlg('del')(t)});})+'</div>',
    '<p class="note"><b>For the build plan:</b> the invitation link depends on the sign-in provider: the plan checks what the provider returns before building and keeps the local invitation as the only access gate.</p>');
  document.getElementById('app').innerHTML=html;
  document.querySelectorAll('[data-lang]').forEach(function(root){root.querySelectorAll('.sw').forEach(function(s){s.addEventListener('click',function(){s.classList.toggle('on');});});});
  var r=document.documentElement;r.setAttribute('data-ui-lang','en');
  document.querySelectorAll('#theme button').forEach(function(b){b.addEventListener('click',function(){
    if(b.dataset.t==='auto')r.removeAttribute('data-ui-theme');else r.setAttribute('data-ui-theme',b.dataset.t);
    document.querySelectorAll('#theme button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});});});
  document.querySelectorAll('#lang button').forEach(function(b){b.addEventListener('click',function(){
    r.setAttribute('data-ui-lang',b.dataset.l);r.lang=b.dataset.l;
    document.querySelectorAll('#lang button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});});});
})();
</script>
</html>
