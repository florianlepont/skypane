<!--
OWNER DECISIONS 2026-11-18 (recorded; layout redrawn on the real shell the same day, to be re-approved)
1. List: rows on phone. Desktop: master-detail, the list of frames as a panel next to the console navigation, the selected frame on the rest of the screen.
2. Switching frame: chip row on phone; on desktop the list panel replaces the dropdown (no chip row on desktop).
3. Phone sections: stacked sections with sticky anchors. The segmented control State / Settings / Access is removed.
4. No arrow to click to see more: status information is shown directly.
5. Access: no introduction, no empty-state text, no "the person must already be invited" help, no long Reassign / Retire sentences (kept in the confirmation dialogs). Keep the people, one Add, Reassign and Retire.
6. Desktop information area: one column of cards of equal width and equal look, no tiles of different sizes.
7. A retired or pending frame opens its own page from the list with only the useful action (Re-activate with the message about the wake and the Reset button, or the code). It never appears on another frame's page.
8. Search in the list from 8 frames (recommendation, not asked yet).
9. /fleet without a chosen frame: phone shows the list; desktop shows the list panel and the first frame with a problem.
10. Realism (owner, 2026-11-18): the mockup uses the real shell (floating sidebar with the Console / My frames switch, Administration navigation, sign-out, top bar and floating tab bar on phone) and the real sections of the frame page (State, Device and version, Settings, Access).
-->

    return function(vp,t){
      var body=kind==='health'?healthContent(t):versionsContent(t);
      var head='<div class="pagehead"><a class="backl" href="#">'+ic('chev').replace('<svg','<svg style="transform:rotate(180deg)"')+t.backto+'Salon</a><h3 class="title"'+(vp==='phone'?' style="font-size:34px"':'')+'>'+(kind==='health'?t.health:t.versions)+'</h3></div>';
      if(vp==='phone')return phoneShell(t,head+body,0);
      return sidebar(t)+'<div class="main" style="left:240px"><div style="max-width:760px">'+head+'<div style="display:flex;flex-direction:column;gap:24px">'+body+'</div></div></div>';
    };
  }

  function iconBtns(t){return '<div class="iconbtns"><a class="btn sq" href="#" title="'+t.openpers+'" aria-label="'+t.openpers+'">'+ic('frame')+'</a><a class="btn sq" href="#" title="'+t.rename+'" aria-label="'+t.rename+'">'+ic('edit')+'</a></div>';}
  /* ---------- phone frame page ---------- */
  function phoneFrame(_v,t){
    var chipNames=['Salon','Cuisine','Chambre','Atelier','Terrasse','Mezzanine'];
    var chips='<div class="chips" role="navigation"><a class="chip all" href="#">'+ic('grid')+t.allframes+'</a>'+chipNames.map(function(n,i){return '<a class="chip" href="#"'+(i===0?' aria-current="page"':'')+'><span class="dot"></span>'+n+'</a>';}).join('')+'</div>';
    var head='<div class="titlerow"><div><h3 class="title" style="font-size:34px">Salon</h3><p class="state"><span class="dot"></span>'+t.online+'</p></div>'+iconBtns(t)+'</div>';
    var acts='';
    var anchors='<div class="anchors">'+['state','settings','access'].map(function(k,i){return '<button type="button" data-go="'+k+'"'+(i===0?' aria-current="true"':'')+'>'+t[k]+'</button>';}).join('')+'</div>';
    return phoneShell(t,chips+head+acts+anchors+tilesBlock(t)+settingsBlock(t)+accessBlock(t),0);
  }

  /* ---------- desktop ---------- */
  function desktopLive(_v,t){
    var f=LIVE[0];
    var head='<div class="titlerow" style="max-width:760px"><div><h3 class="title">'+f.n+'</h3><p class="state"><span class="dot err"></span>'+t.offline+' <span class="sub" style="font-weight:400">· '+t.seen(f.m)+'</span></p></div>'+iconBtns(t)+'</div>';
    return sidebar(t)+listPanel(t,true,false)+'<div class="main">'+head+'<div class="dcol">'+tilesBlock(t)+settingsBlock(t)+accessBlock(t)+'</div></div>';
  }
  function desktopRetired(_v,t){
    var head='<h3 class="title">Le Petit Cadre</h3><p class="state"><span class="dot idle"></span>'+t.retired+' <span class="sub" style="font-weight:400">· '+t.retiredOn+'</span></p>';
    var card='<div class="dcol"><div><p class="label">'+t.react+'</p><div class="card"><div class="item"><span class="who"><b>'+t.react+'</b><small>'+t.wake+'</small></span><a class="btn dark" href="#">'+t.react+'</a></div></div></div></div>';
    return sidebar(t)+listPanel(t,false,true)+'<div class="main">'+head+card+'</div>';
  }

  /* ---------- assemble ---------- */
  function mock(vp,caption,sub,builder){
    var langs=['en','fr'].map(function(l){return '<div data-lang="'+l+'">'+builder(vp,S[l])+'</div>';}).join('');
    var box='<div data-viewport="'+vp+'">'+langs+'</div>';
    return '<figure class="mock"><figcaption>'+caption+(sub?'<small>'+sub+'</small>':'')+'</figcaption>'+(vp==='desktop'?'<div class="scroller">'+box+'</div>':box)+'</figure>';
  }
  function section(h,lead,body,extra){return '<section class="sec"><h2>'+h+'</h2><p class="lead">'+lead+'</p>'+body+(extra||'')+'</section>';}
  var html='';
  html+=section('1. Phone: the list of frames and a frame page',
    'Real shell: top bar with the logo and the floating tab bar of the console. Left, the list of frames (<code>/fleet</code>): rows, problems first; pending and retired frames only here. Right, a frame page: the chip row starts with <b>All frames</b> (back to the list in one tap), then the live frames (never a retired one). Then the overview: four tiles of the same size (Connection, Battery, Flight data, Firmware), each marked <b>Details</b>, then Settings and Access stacked, with sticky anchors.',
    '<div class="row2">'+mock('phone','List of frames','The list scrolls inside the phone',listPhone)+mock('phone','A frame page','Scroll inside the phone; try the anchors',phoneFrame)+'</div>',
    '<p class="note"><b>Today:</b> the first frame opens by default, a dropdown in the top bar lists every frame (retired included), and an "Other frames" block repeats pending and retired frames at the bottom of every frame page. <b>Removed from Access:</b> the introduction, the empty-state body, the helper line and the long Reassign / Retire sentences (they stay in the confirmation dialogs).</p>');
  html+=section('2. Desktop: the list as a column next to the navigation, the frame on the rest of the screen',
    'Real columns: the console menu as a full-height flat column with the My frames / Console switch (My frames first), then the frames column with a fixed header (title, Add, search), then the selected frame: the same four equal tiles, Settings and Access in one column of cards of equal width. Without a chosen frame, <code>/fleet</code> selects the first frame with a problem.',
    '<div class="row2">'+mock('desktop','A live frame with a problem selected','Scroll inside the list column and the page',desktopLive)+'</div>'+
    '<div style="height:32px"></div><div class="row2">'+mock('desktop','A retired frame selected','Only the useful action: Re-activate, with the message about the wake and the Reset button',desktopRetired)+'</div>');
  html+=section('3. The details live on two real pages: Health and Versions',
    'The three status tiles open the full Health page, and the Firmware tile opens the Versions page. Nothing is lost: the Health page keeps every block the page has today: the no-signal notice and the warnings banner; the connection row (state, last check-in, next wake, last run); the battery row (status, level and voltage, charging pill, Percentage / Voltage switch, curve, readings table); and, for administrators, flight data (last aircraft, stale warning), data sources (verdict, disagreements, the three outcomes with their sentences), identification (rate, to resolve, link to the unresolved airlines, the table by source) and the off-box backup. The Versions page shows the installed version, whether an update is available, and every previous version with its Revert button.',
    '<div class="row2">'+mock('desktop','Health page (desktop)','',detailPage('health'))+'</div>'+
    '<div style="height:32px"></div><div class="row2">'+mock('desktop','Versions page (desktop)','',detailPage('versions'))+'</div>'+
    '<div style="height:32px"></div><div class="row2">'+mock('phone','Health page (phone)','Scroll inside the phone',detailPage('health'))+mock('phone','Versions page (phone)','',detailPage('versions'))+'</div>',
    '<p class="note"><b>For the build plan:</b> the battery curve period (7 days here) and the exact rows of the Health page are those the application can provide today; the plan checks them against the existing page before building. The explanation sentences and descriptions in this mock are illustrative; the build keeps the existing strings, and the ADS-B source fault block, which only shows during an outage, is kept as it is.</p>');
  document.getElementById('app').innerHTML=html;

  /* ---------- behaviour ---------- */
  document.querySelectorAll('[data-lang]').forEach(function(root){
    var screen=root.querySelector('.screen')||root.querySelector('.main');
    if(!screen)return;
    var gos=root.querySelectorAll('[data-go]');
    function mark(k){gos.forEach(function(b){if(b.dataset.go===k)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current');});}
    gos.forEach(function(b){b.addEventListener('click',function(){
      var target=root.querySelector('[data-sec="'+b.dataset.go+'"]');
      if(target){screen.scrollTo({top:target.offsetTop-64,behavior:'smooth'});mark(b.dataset.go);}
    });});
    if(gos.length){screen.addEventListener('scroll',function(){
      var best='state';
      root.querySelectorAll('[data-sec]').forEach(function(s){if(s.offsetTop-screen.scrollTop<140)best=(s.dataset.sec==='device'?'state':s.dataset.sec);});
      mark(best);
    });}
    root.querySelectorAll('.sw').forEach(function(s){s.addEventListener('click',function(){var on=s.classList.toggle('on');s.setAttribute('aria-checked',String(on));});});
  });
  var r=document.documentElement;
  r.setAttribute('data-ui-lang','en');
  document.querySelectorAll('#theme button').forEach(function(b){b.addEventListener('click',function(){
    if(b.dataset.t==='auto')r.removeAttribute('data-ui-theme');else r.setAttribute('data-ui-theme',b.dataset.t);
    document.querySelectorAll('#theme button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});
  });});
  document.querySelectorAll('#lang button').forEach(function(b){b.addEventListener('click',function(){
    r.setAttribute('data-ui-lang',b.dataset.l);r.lang=b.dataset.l;
    document.querySelectorAll('#lang button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});
  });});
})();
</script>
</html>
