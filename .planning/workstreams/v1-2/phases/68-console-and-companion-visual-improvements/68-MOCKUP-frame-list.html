<!--
OWNER DECISIONS 2026-11-18 (recorded; layout redrawn on the real shell the same day, to be re-approved)
1. List: rows on phone. Desktop: master-detail, the list of frames as a panel next to the console navigation, the selected frame on the rest of the screen.
2. Switching frame: chip row on phone; on desktop the list panel replaces the dropdown (no chip row on desktop).
3. Phone sections: stacked sections with sticky anchors. The segmented control State / Settings / Access is removed.
4. No arrow to click to see more: status information is shown directly.
5. Access: no introduction, no empty-state text, no "the person must already be invited" help, no long Reassign / Retire sentences (kept in the confirmation dialogs). Keep the people, one Add, Reassign and Retire.
6. Desktop information area: one column of cards of equal width and equal look, no tiles of different sizes.
7. A retired or pending frame opens its own page from the list with only the useful action (Re-activate with the message about the wake and the Reset button, or the code). It never appears on another frame's page.
8. Search in the list from 8 frames (recommendation, not asked yet).
9. /fleet without a chosen frame: phone shows the list; desktop shows the list panel and the first frame with a problem.
10. Realism (owner, 2026-11-18): the mockup uses the real shell (floating sidebar with the Console / My frames switch, Administration navigation, sign-out, top bar and floating tab bar on phone) and the real sections of the frame page (State, Device and version, Settings, Access).
-->

  LIVE.sort(function(a,b){var r={err:0,idle:1,ok:2};return r[a.s]-r[b.s];});
  var PEND=[{n:'Cadre 7F:3A'},{n:'Cadre B2:19'}];
  var RET=[{n:'Le Petit Cadre',o:'Hugo'},{n:'Ancien salon',o:'Léa'},{n:'Banc de test',o:'Paul'},{n:'Cadre prêté',o:'Nora'}];

  function ic(n,cls){return '<svg class="ic'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-'+n+'"/></svg>';}
  function sw(on){return '<span class="sw'+(on?' on':'')+'" role="switch" aria-checked="'+on+'" tabindex="0"></span>';}
  function stateWord(t,s){return s==='ok'?t.online:s==='idle'?t.sleeping:t.offline;}
  function lead(n,cls){return '<span class="ico'+(cls?' '+cls:'')+'">'+ic(n)+'</span>';}

  /* ---------- shell ---------- */
  function phoneShell(t,inner,on,top){
    var icons=['fleet','team','tag','clock','more'];
    return '<div class="ptop"><span class="brand">'+ic('logo')+'SkyPane</span>'+(top||'')+'</div><div class="screen">'+inner+'</div>'+
      '<div class="tabs">'+t.tabs.map(function(x,i){return '<div class="tab'+(i===on?' on':'')+'">'+ic(icons[i])+x+'</div>';}).join('')+'</div>';
  }
  function sidebar(t){
    var icons=['fleet','team','tag','clock'];
    return '<div class="side"><span class="brand">'+ic('logo')+'SkyPane</span>'+
      '<div class="space"><span class="on">'+ic('check')+t.space[0]+'</span><span>'+t.space[1]+'</span></div>'+
      '<div class="sep"></div><div class="nlabel">'+t.admin+'</div>'+
      t.nav.map(function(x,i){return (i===2?'<div class="sep"></div>':'')+'<div class="nav'+(i===0?' on':'')+'">'+ic(icons[i])+x+'</div>';}).join('')+
      '<div class="sep"></div><div class="nav">'+ic('user')+t.account+'</div>'+
      '<div class="signout"><a class="btn" href="#">'+t.signout+'</a></div></div>';
  }

  /* ---------- list pieces ---------- */
  function frowLive(t,f,sel){
    return '<a class="frow'+(sel?' sel':'')+'" href="#"><span class="dot '+(f.s==='ok'?'':f.s)+'"></span><span class="who"><b>'+f.n+'</b><small>'+f.o+' · '+stateWord(t,f.s)+'</small></span><span class="seen num">'+t.seen(f.m)+'</span><span class="chev">'+ic('chev')+'</span></a>';
  }
  function frowPend(t,f){return '<a class="frow" href="#"><span class="dot pend"></span><span class="who"><b>'+f.n+'</b><small>'+t.codeShown+'</small></span><span class="chev">'+ic('chev')+'</span></a>';}
  function frowRet(t,f,sel){return '<a class="frow retired'+(sel?' sel':'')+'" href="#"><span class="dot idle"></span><span class="who"><b>'+f.n+'</b><small>'+f.o+' · '+t.retiredOn+'</small></span><span class="chev">'+ic('chev')+'</span></a>';}
  function groups(t,selLive,selRet){
    function g(title,n,body){return '<div><p class="label">'+title+' · '+n+'</p><div class="card">'+body+'</div></div>';}
    return g(t.live,24,LIVE.map(function(f,i){return frowLive(t,f,selLive&&i===0);}).join(''))+
      g(t.pending,2,PEND.map(function(f){return frowPend(t,f);}).join(''))+
      g(t.retired,4,RET.map(function(f,i){return frowRet(t,f,selRet&&i===0);}).join(''));
  }
  function listHeadPhone(t){
    return '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><h3 class="title" style="font-size:34px">'+t.frames+'</h3><a class="btn dark" href="#">'+ic('plus')+t.add+'</a></div>'+
      '<label class="field">'+ic('search')+'<input type="search" placeholder="'+t.search+'" aria-label="'+t.search+'"></label>';
  }
  function listPhone(_v,t){return phoneShell(t,listHeadPhone(t)+groups(t,false,false),0);}
  function listPanel(t,selLive,selRet){
    return '<div class="listp"><div class="lhead"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><h3 style="margin:0;font-size:24px">'+t.frames+'</h3><a class="btn dark" href="#">'+ic('plus')+t.add+'</a></div>'+
      '<label class="field">'+ic('search')+'<input type="search" placeholder="'+t.search+'" aria-label="'+t.search+'"></label></div><div class="lbody">'+groups(t,selLive,selRet)+'</div></div>';
  }

  /* ---------- frame page sections (the real ones) ---------- */
  function spark(){return '<svg class="sparkline" viewBox="0 0 300 44" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" points="0,10 40,14 80,16 120,22 160,24 200,30 240,32 300,36"/></svg>';}
  function statusRow(n,label,val,right,ok,extra){return '<div class="item wrap">'+lead(n,ok?'ok':'')+'<span class="who"><small>'+label+'</small><b>'+val+'</b></span><span class="val num">'+right+'</span>'+(extra?'<div class="sub2">'+extra+'</div>':'')+'</div>';}
  function stateBlock(t){
    return '<div class="blk" data-sec="state"><p class="label">'+t.state+'</p><div class="card">'+
      statusRow('check',t.conn,t.connv,t.connt,true,'<span>'+t.contacts+' : '+t.c3+'</span>')+
      statusRow('check',t.batt,t.battv,t.battt,true,'<span>'+t.days+'</span>'+spark())+
      statusRow('info',t.fdata,t.fdatav,t.fdatat,false,'')+'</div></div>';
  }
  function deviceBlock(t){
    function v(n,note){return '<div class="vrow"><span class="who"><b class="num">'+n+'</b></span><span class="val">'+note+'</span><a class="btn quiet" href="#">'+t.revert+'</a></div>';}
    return '<div class="blk" data-sec="device"><p class="label">'+t.device+'</p><div class="card"><div class="item"><span class="who"><small>'+t.onframe+'</small><b style="font-family:ui-monospace,Menlo,monospace;font-size:18px">v1.4.2</b><small>'+t.model+'</small></span><span class="badge">'+t.uptodate+'</span></div>'+
      '<div class="vrow" style="border-top:1px solid var(--border);min-height:40px"><span class="label" style="margin:0">'+t.prev+'</span></div>'+v('v1.4.1','12 Oct')+v('v1.4.0','28 Sep')+
      '<a class="vrow" href="#"><span class="who"><b>'+t.allv+'</b></span><span class="chev">'+ic('chev')+'</span></a></div></div>';
  }
  function settingsBlock(t){
    return '<div class="blk" data-sec="settings"><p class="label">'+t.settings+'</p><div class="card">'+
      '<div class="item" style="flex-direction:column;align-items:stretch;gap:2px"><div style="display:flex;gap:12px;align-items:center">'+lead('timer')+'<span class="who"><b>'+t.interval+'</b><small>'+t.intervalh+'</small></span><span class="val num">900 '+t.secs+'</span></div><div class="range"><i></i><b></b></div></div>'+
      '<div class="item">'+lead('bulb')+'<span class="who"><b>'+t.led+'</b><small>'+t.ledh+'</small></span>'+sw(false)+'</div></div></div>';
  }
  function accessBlock(t){
    function person(n,role,mine){return '<div class="item"><span class="ico">'+n.charAt(0)+'</span><span class="who"><b>'+n+'</b><small>'+role+'</small></span>'+(mine?'<a class="btn" href="#" style="min-height:40px">'+t.reassign+'</a>':'<a class="btn sq" href="#" aria-label="X">'+ic('x')+'</a>')+'</div>';}
    return '<div class="blk" data-sec="access"><p class="label">'+t.access+'</p><div class="card">'+person('Camille Martin',t.owner,true)+person('Louis Bernard',t.co,false)+
      '<a class="item" href="#"><span class="ico" style="background:var(--accent);color:var(--on-accent)">'+ic('plus')+'</span><span class="who"><b>'+t.addp+'</b></span></a>'+
      '<a class="item danger" href="#"><span class="who"><b>'+t.retire+'</b><small>'+t.retireh+'</small></span><span class="chev">'+ic('chev')+'</span></a></div></div>';
  }

  function iconBtns(t){return '<div class="iconbtns"><a class="btn sq" href="#" title="'+t.openpers+'" aria-label="'+t.openpers+'">'+ic('frame')+'</a><a class="btn sq" href="#" title="'+t.rename+'" aria-label="'+t.rename+'">'+ic('edit')+'</a></div>';}
  /* ---------- phone frame page ---------- */
  function phoneFrame(_v,t){
    var chipNames=['Salon','Cuisine','Chambre','Atelier','Terrasse','Mezzanine'];
    var chips='<div class="chips" role="navigation">'+chipNames.map(function(n,i){return '<a class="chip" href="#"'+(i===0?' aria-current="page"':'')+'><span class="dot"></span>'+n+'</a>';}).join('')+'<a class="chip all" href="#">'+t.allframes+'</a></div>';
    var head='<div class="titlerow"><div><h3 class="title" style="font-size:34px">Salon</h3><p class="state"><span class="dot"></span>'+t.online+'</p></div>'+iconBtns(t)+'</div>';
    var acts='';
    var anchors='<div class="anchors">'+['state','settings','access'].map(function(k,i){return '<button type="button" data-go="'+k+'"'+(i===0?' aria-current="true"':'')+'>'+t[k]+'</button>';}).join('')+'</div>';
    return phoneShell(t,chips+head+acts+anchors+stateBlock(t)+deviceBlock(t)+settingsBlock(t)+accessBlock(t),0);
  }

  /* ---------- desktop ---------- */
  function desktopLive(_v,t){
    var f=LIVE[0];
    var head='<div class="titlerow" style="max-width:760px"><div><h3 class="title">'+f.n+'</h3><p class="state"><span class="dot err"></span>'+t.offline+' <span class="sub" style="font-weight:400">· '+t.seen(f.m)+'</span></p></div>'+iconBtns(t)+'</div>';
    return sidebar(t)+listPanel(t,true,false)+'<div class="main">'+head+'<div class="dcol">'+stateBlock(t)+deviceBlock(t)+settingsBlock(t)+accessBlock(t)+'</div></div>';
  }
  function desktopRetired(_v,t){
    var head='<h3 class="title">Le Petit Cadre</h3><p class="state"><span class="dot idle"></span>'+t.retired+' <span class="sub" style="font-weight:400">· '+t.retiredOn+'</span></p>';
    var card='<div class="dcol"><div><p class="label">'+t.react+'</p><div class="card"><div class="item"><span class="who"><b>'+t.react+'</b><small>'+t.wake+'</small></span><a class="btn dark" href="#">'+t.react+'</a></div></div></div></div>';
    return sidebar(t)+listPanel(t,false,true)+'<div class="main">'+head+card+'</div>';
  }

  /* ---------- assemble ---------- */
  function mock(vp,caption,sub,builder){
    var langs=['en','fr'].map(function(l){return '<div data-lang="'+l+'">'+builder(vp,S[l])+'</div>';}).join('');
    var box='<div data-viewport="'+vp+'">'+langs+'</div>';
    return '<figure class="mock"><figcaption>'+caption+(sub?'<small>'+sub+'</small>':'')+'</figcaption>'+(vp==='desktop'?'<div class="scroller">'+box+'</div>':box)+'</figure>';
  }
  function section(h,lead,body,extra){return '<section class="sec"><h2>'+h+'</h2><p class="lead">'+lead+'</p>'+body+(extra||'')+'</section>';}
  var html='';
  html+=section('1. Phone: the list of frames and a frame page',
    'Real shell: top bar with the logo and the floating tab bar of the console. Left, the list of frames (<code>/fleet</code>): rows, problems first; pending and retired frames only here; tapping a row opens it. Right, a frame page: chip row of live frames (never a retired one), then the real sections (State, Device and version, Settings, Access) stacked, with sticky anchors. Details are shown directly, nothing hides behind an arrow: the battery curve over 7 days, the last contacts, and the previous firmware versions with their Revert buttons are on the page; \u201cAll versions\u201d is the only link, for the long list.',
    '<div class="row2">'+mock('phone','List of frames','The list scrolls inside the phone',listPhone)+mock('phone','A frame page','Scroll inside the phone; try the anchors',phoneFrame)+'</div>',
    '<p class="note"><b>Today:</b> the first frame opens by default, a dropdown in the top bar lists every frame (retired included), and an "Other frames" block repeats pending and retired frames at the bottom of every frame page. <b>Removed from Access:</b> the introduction, the empty-state body, the helper line and the long Reassign / Retire sentences (they stay in the confirmation dialogs).</p>');
  html+=section('2. Desktop: the list as a panel next to the navigation, the frame on the rest of the screen',
    'Real columns: the console menu as a full-height flat column (the first proposal), with the Console / My frames switch, the Administration navigation, Account and Sign out. The frames column has a fixed header (title, Add, search) and a scrolling list. The selected frame fills the rest: one column of cards of equal width. Without a chosen frame, <code>/fleet</code> selects the first frame with a problem.',
    '<div class="row2">'+mock('desktop','A live frame with a problem selected','Scroll inside the list panel and the page',desktopLive)+'</div>'+
    '<div style="height:32px"></div><div class="row2">'+mock('desktop','A retired frame selected','Only the useful action: Re-activate, with the message about the wake and the Reset button',desktopRetired)+'</div>');
  document.getElementById('app').innerHTML=html;

  /* ---------- behaviour ---------- */
  document.querySelectorAll('[data-lang]').forEach(function(root){
    var screen=root.querySelector('.screen')||root.querySelector('.main');
    if(!screen)return;
    var gos=root.querySelectorAll('[data-go]');
    function mark(k){gos.forEach(function(b){if(b.dataset.go===k)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current');});}
    gos.forEach(function(b){b.addEventListener('click',function(){
      var target=root.querySelector('[data-sec="'+b.dataset.go+'"]');
      if(target){screen.scrollTo({top:target.offsetTop-64,behavior:'smooth'});mark(b.dataset.go);}
    });});
    if(gos.length){screen.addEventListener('scroll',function(){
      var best='state';
      root.querySelectorAll('[data-sec]').forEach(function(s){if(s.offsetTop-screen.scrollTop<140)best=(s.dataset.sec==='device'?'state':s.dataset.sec);});
      mark(best);
    });}
    root.querySelectorAll('.sw').forEach(function(s){s.addEventListener('click',function(){var on=s.classList.toggle('on');s.setAttribute('aria-checked',String(on));});});
  });
  var r=document.documentElement;
  r.setAttribute('data-ui-lang','en');
  document.querySelectorAll('#theme button').forEach(function(b){b.addEventListener('click',function(){
    if(b.dataset.t==='auto')r.removeAttribute('data-ui-theme');else r.setAttribute('data-ui-theme',b.dataset.t);
    document.querySelectorAll('#theme button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});
  });});
  document.querySelectorAll('#lang button').forEach(function(b){b.addEventListener('click',function(){
    r.setAttribute('data-ui-lang',b.dataset.l);r.lang=b.dataset.l;
    document.querySelectorAll('#lang button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});
  });});
})();
</script>
</html>
