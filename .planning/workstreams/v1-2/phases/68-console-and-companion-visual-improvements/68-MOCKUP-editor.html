}
@media (prefers-color-scheme:dark){:root:not([data-ui-theme="light"]){
  --sky:linear-gradient(#12151D,#161A24 45%,#1A1F2B); --canvas:#161A24; --stage:#0E1117;
  --text:#F1F3F6; --muted:#A3ABBB; --border:#2A3040; --chip:#232A38; --card:#1C222D;
  --accent:#F2EFE9; --on-accent:#14171F; --glass:rgba(34,40,54,.82); --tab:#1C222D; --shadow:0 6px 20px rgba(0,0,0,.35);
  --ok:#4ADE80; --okbg:#173225; --warn:#FBBF24; --err:#FB7185; color-scheme:dark}}
:root[data-ui-theme="dark"]{
  --sky:linear-gradient(#12151D,#161A24 45%,#1A1F2B); --canvas:#161A24; --stage:#0E1117;
  --text:#F1F3F6; --muted:#A3ABBB; --border:#2A3040; --chip:#232A38; --card:#1C222D;
  --accent:#F2EFE9; --on-accent:#14171F; --glass:rgba(34,40,54,.82); --tab:#1C222D; --shadow:0 6px 20px rgba(0,0,0,.35);
  --ok:#4ADE80; --okbg:#173225; --warn:#FBBF24; --err:#FB7185; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--stage);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:32px 16px 96px}
button,input{font:inherit;color:inherit}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* shared pieces */
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.label{margin:0 0 6px 16px;font-size:13px;font-weight:600;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--border);border-radius:14px;background:var(--card);font-size:15px;font-weight:600;cursor:pointer}

.section{display:flex;flex-direction:column}

.frow{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 14px;border-top:1px solid var(--border);cursor:pointer}

.frow .who small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ptop{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:5}

.blk{scroll-margin-top:72px}

.dcol{display:flex;flex-direction:column;gap:24px;max-width:760px;margin-top:20px}

  <symbol id="i-plane" viewBox="0 0 24 24"><path d="M2 14l8-2 3-8 2 1-1 7 6 2v2l-6-1-2 4-2-.5.5-3.5L2 16z"/></symbol>
  <symbol id="i-chip" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></symbol>
  <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></symbol>
  <symbol id="i-frame" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><rect x="7" y="8" width="10" height="8" rx="1"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/></symbol>
</svg>
<div class="top">
  <div>
    <h1>Airlines editor</h1>
    <p>Mockup for the owner, on the real shell (CON-01: R27 to R31, D-15). Sample data is invented. Use the toggles.</p>
  </div>
  <div class="toggles">
    <div class="seg" id="theme" role="group" aria-label="Theme"><button type="button" data-t="auto" aria-pressed="true">Auto</button><button type="button" data-t="light" aria-pressed="false">Light</button><button type="button" data-t="dark" aria-pressed="false">Dark</button></div>
    <div class="seg" id="lang" role="group" aria-label="Language"><button type="button" data-l="en" aria-pressed="true">English</button><button type="button" data-l="fr" aria-pressed="false">Fran&ccedil;ais</button></div>
  </div>
</div>
<div id="app"></div>
<script>
(function(){
  function nb(s){return s.replace(/ ([:;?!»])/g,' $1').replace(/« /g,'« ');}
  var S={
    en:{title:'Airlines editor',search:'Airline or prefix…',count:'36 of 36 shown',
      f:['All','Unidentified','Known by name only','No artwork','Seen','Not seen yet'],
      unid:'Unidentified',unidh:'Prefixes seen on flights with no airline name yet.',seen:function(n,d){return (n===1?'Seen once':'Seen '+n+'×')+' · '+d;},complete:'Complete',
      nameph:'Airline name',typeph:'Aircraft type',validate:'Validate',cancel:'Cancel',save:'Save',
      byname:'Known by name only',bynameh:'The name is known; there is no artwork yet.',noart:'No artwork',addart:'Add the first artwork',addT:'Add the first artwork for Turkish Airlines',addH:'Choose the aircraft type this artwork is for. It becomes the airline’s default type.',choose:'Choose an image',
      airlines:'Airlines',colA:'Airline',colP:'Prefixes',colI:'Artwork',colV:'Views',colL:'Last seen',views:function(n){return n+' views';},never:'Not seen yet',
      mrename:'Rename',mchange:'Change artwork',mrevert:'Back to the default',mdel:'Delete the illustration',mdef:'Set as default type',mreset:'Reset to the original name',
      types:'Aircraft types seen',usesair:'Uses the airline’s artwork',own:'Own artwork',defpill:'Default type',renameT:'Rename the airline',renameH:'The new name replaces the original on the companion and on the frame.',
      tabs:['Fleet','Team','Editor','Journal','More'],nav:['Fleet','Users','Editor','Audit log'],account:'Account',space:['Console','My frames'],admin:'Administration',signout:'Sign out',
      openmenu:'Actions for Air France',complh:'Name the airline. Its aircraft types come from the flights seen.',madd:'Add an aircraft type',colD:'Default type',detected:'Aircraft seen',editname:'Edit the name',editshort:'Edit',sugglabel:'Suggestion',suggest:'Suggested name',use:'Use',tdef:'Set as default type',trevert:'Use the default type’s artwork',tdel:'Delete the artwork',usesdef:'Uses the default type’s artwork',addtart:'Add artwork',notype:'No aircraft artwork yet',menuT:'Actions for A220-300'},
    fr:{title:'Éditeur de compagnies',search:'Compagnie ou indicatif…',count:'36 sur 36 affichées',
      f:['Toutes','Non identifiées','Connues par leur nom','Sans illustration','Vues','Pas encore vues'],
      unid:'Non identifiées',unidh:'Indicatifs vus sur des vols, sans nom de compagnie pour l’instant.',seen:function(n,d){return (n===1?'Vue une fois':'Vue '+n+'×')+' · '+d;},complete:'Compléter',
      nameph:'Nom de la compagnie',typeph:'Type d’avion',validate:'Valider',cancel:'Annuler',save:'Enregistrer',
      byname:'Connues par leur nom seulement',bynameh:'Le nom est connu ; il n’y a pas encore d’illustration.',noart:'Sans illustration',addart:'Ajouter la première illustration',addT:'Ajouter la première illustration pour Turkish Airlines',addH:'Choisissez le type d’avion concerné. Il devient le type par défaut de la compagnie.',choose:'Choisir une image',
      airlines:'Compagnies',colA:'Compagnie',colP:'Préfixes',colI:'Illustration',colV:'Vues',colL:'Dernière vue',views:function(n){return n+' vues';},never:'Pas encore vue',
      mrename:'Renommer',mchange:'Changer l’illustration',mrevert:'Revenir à celle par défaut',mdel:'Supprimer l’illustration',mdef:'Définir comme type par défaut',mreset:'Rétablir le nom d’origine',
      types:'Types d’avion vus',usesair:'Utilise l’illustration de la compagnie',own:'Illustration propre',defpill:'Type par défaut',renameT:'Renommer la compagnie',renameH:'Le nouveau nom remplace le nom d’origine dans le companion et sur le cadre.',
      tabs:['Flotte','Équipe','Éditeur','Journal','Plus'],nav:['Flotte','Utilisateurs','Éditeur','Journal d’audit'],account:'Compte',space:['Console','Mes cadres'],admin:'Administration',signout:'Se déconnecter',
      openmenu:'Actions pour Air France',complh:'Nommez la compagnie. Ses types d’avion viennent des vols vus.',madd:'Ajouter un type d’avion',colD:'Type par défaut',detected:'Avions vus',editname:'Modifier le nom',editshort:'Modifier',sugglabel:'Suggestion',suggest:'Nom suggéré',use:'Utiliser',tdef:'Définir comme type par défaut',trevert:'Utiliser l’illustration du type par défaut',tdel:'Supprimer l’illustration',usesdef:'Utilise l’illustration du type par défaut',addtart:'Ajouter une illustration',notype:'Pas encore d’illustration d’avion',menuT:'Actions pour A220-300'}
  };
  Object.keys(S.fr).forEach(function(k){var v=S.fr[k];if(typeof v==='string')S.fr[k]=nb(v);else if(Array.isArray(v))S.fr[k]=v.map(nb);});
  function ic(n){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-'+n+'"/></svg>';}
  function lead(n){return '<span class="ico">'+ic(n)+'</span>';}
  function plane(c){return '<svg viewBox="0 0 70 26" aria-hidden="true"><path d="M2 14l30-3 18-9 4 1-8 9 14 2 8-3 2 1-6 4-12 2-14 7-4-1 5-7-24 0z" fill="'+(c||'#9AA3B2')+'"/></svg>';}
  function thumb(c){return c?'<span class="thumb">'+plane(c)+'</span>':'<span class="thumb none">'+'—'+'</span>';}
  var AIR=[['Air France','AFR','#1F3A8A',37,'10:29','A320'],['Iberia Airlines','IBE','#DC2626',0,'','A320'],['TAP Portugal','TAP','#16A34A',0,'','A321'],['Air Algérie','DAH','#DC2626',3,'17 nov.','B737-800'],['Transavia France','TFV TVF','#16A34A',20,'17 nov.','B737-800'],['easyJet','EJU EZY','#F97316',17,'17 nov.','A320'],['Chalair Aviation','CLG',null,0,'',''],['Twin Jet','TJT',null,0,'','']];
  var UNID=[['OCN',4,'17 Nov','Oceanair','A320 · A321'],['ITI',2,'16 Nov','Itavia Express','B737'],['CMA',1,'15 Nov','','A320']];
  var BYNAME=[['Turkish Airlines','THY'],['KLM','KLM'],['FedEx','FDX'],['Finnair','FIN']];

  function sidebar(t){
    var icons=['fleet','team','tag','clock'];
    return '<div class="side"><span class="brand">'+ic('logo')+'SkyPane</span><div class="space"><span>'+t.space[1]+'</span><span class="on">'+ic('check')+t.space[0]+'</span></div><div class="sep"></div><div class="nlabel">'+t.admin+'</div>'+
      t.nav.map(function(x,i){return (i===2?'<div class="sep"></div>':'')+'<div class="nav'+(i===2?' on':'')+'">'+ic(icons[i])+x+'</div>';}).join('')+
      '<div class="sep"></div><div class="nav">'+ic('user')+t.account+'</div><div class="signout"><a class="btn" href="#">'+t.signout+'</a></div></div>';
  }
  function phoneShell(t,inner,overlay){
    var icons=['fleet','team','tag','clock','more'];
    return '<div class="ptop"><span class="brand">'+ic('logo')+'SkyPane</span></div><div class="screen">'+inner+'</div><div class="tabs">'+t.tabs.map(function(x,i){return '<div class="tab'+(i===2?' on':'')+'">'+ic(icons[i])+x+'</div>';}).join('')+'</div>'+(overlay||'');
  }
  function filters(t,vp){
    var n=[36,3,4,6,9,27];
    return '<div class="fchips">'+t.f.map(function(x,i){return '<span class="fchip'+(i===0?' on':'')+'">'+x+' <i>'+n[i]+'</i></span>';}).join('')+'</div>';
  }
  function toolbar(t,vp){
    return '<div class="tbar"><label class="field">'+ic('search')+'<input type="search" placeholder="'+t.search+'" aria-label="'+t.search+'"></label>'+(vp==='desktop'?'<span class="sub">'+t.count+'</span>':'')+'</div>'+filters(t,vp);
  }
  function uformHtml(t,vp){
    return '<div class="uform" style="grid-template-columns:1fr;gap:12px"><div style="display:grid;grid-template-columns:'+(vp==='phone'?'1fr':'1fr auto')+';gap:10px;align-items:center"><label class="field"><input placeholder="'+t.nameph+'" aria-label="'+t.nameph+'"></label><a class="btn dark" href="#">'+t.validate+'</a></div></div>';
  }
  function unidBlock(t,vp,openForm){
    var rows=UNID.map(function(u,i){
      var sug=u[3];
      var who=sug?'<span class="sugg">'+ic('spark')+'<span>'+t.sugglabel+' : <b>'+sug+'</b></span></span><small>'+t.seen(u[1],u[2])+' · '+u[4]+'</small>':'<small>'+t.seen(u[1],u[2])+' · '+u[4]+'</small>';
      var btns=sug?'<a class="tlink" href="#" aria-label="'+t.editname+'">'+t.editshort+'</a><a class="btn dark" href="#" style="min-height:44px">'+t.validate+'</a>'
                  :(openForm&&i===2?'<span class="btn ghost" style="background:var(--chip)">'+t.cancel+'</span>':'<a class="btn dark" href="#" style="min-height:44px">'+t.complete+'</a>');
      var row='<div class="urow"><span class="mono" style="font-weight:700;font-size:15px;min-width:44px">'+u[0]+'</span><span class="who">'+who+'</span>'+btns+'</div>';
      if(openForm&&i===2)row+=uformHtml(t,vp);
      return row;
    }).join('');
    return '<div><p class="label">'+t.unid+' · 3</p><div class="card">'+rows+'</div></div>';
  }
  function bynameBlock(t){
    return '<div><p class="label">'+t.byname+' · 4</p><div class="card">'+BYNAME.map(function(b){return '<div class="urow"><span class="who"><b>'+b[0]+'</b><small class="mono">'+b[1]+'</small></span><a class="btn" href="#" style="min-height:40px">'+ic('plus')+t.addart+'</a></div>';}).join('')+'</div></div>';
  }
  function typesPanel(t,openMenu){
    function tr(n,note,c,pill,btn,withMenu,own){return '<div class="trow" style="position:relative">'+(c?thumb(c):thumb(null))+'<span class="who"><b>'+n+'</b><small>'+note+'</small></span>'+(pill?'<span class="pill">'+t.defpill+'</span>':'')+'<a class="btn quiet" href="#" style="min-height:40px;font-weight:500">'+btn+'</a><span class="btn sq" style="border:0;background:none" aria-label="'+t.menuT+'">'+ic('more')+'</span>'+(withMenu?typeMenu(t):'')+'</div>';}
    return '<div class="types">'+tr('A320',t.own,'#1F3A8A',true,t.mchange,false)+tr('A321',t.usesdef,'#1F3A8A',false,t.addtart,false)+tr('A220-300',t.own,'#1F3A8A',false,t.mchange,openMenu)+tr('B777-300ER',t.usesdef,'#1F3A8A',false,t.addtart,false)+'</div>';
  }
  function menu(t){
    return '<div class="menu" role="menu"><a href="#">'+t.mrename+'</a></div>';
  }
  function typeMenu(t){
    return '<div class="menu" style="top:40px;min-width:280px" role="menu"><a href="#">'+t.tdef+'</a><a href="#" class="dg">'+t.tdel+'</a></div>';
  }
  function tableBlock(t,vp,withMenu,withExp){
    var head='<tr><th style="width:40px"></th><th>'+t.colA+'</th><th>'+t.colP+'</th><th>'+t.colD+'</th><th>'+t.colV+'</th><th>'+t.colL+'</th><th style="width:56px"></th></tr>';
    var rows=AIR.map(function(a,i){
      var seen=a[3]?t.views(a[3]):t.never, last=a[4]?a[4]:'';
      var r='<tr><td>'+(a[3]?'<span class="chev" style="display:inline-block;'+(i===0&&withExp?'transform:rotate(90deg)':'')+'">'+ic('chev')+'</span>':'')+'</td><td class="rname">'+a[0]+'</td><td class="mono">'+a[1]+'</td><td><span style="display:flex;align-items:center;gap:10px">'+thumb(a[2])+'<span class="mono">'+(a[5]||'—')+'</span></span></td><td class="num">'+seen+'</td><td class="sub">'+last+'</td><td class="rmenu" style="text-align:right"><span class="btn sq" style="border:0;background:none">'+ic('more')+'</span>'+(i===0&&withMenu?menu(t):'')+'</td></tr>';
      if(i===0&&withExp)r+='<tr class="exp"><td colspan="7"><p class="label" style="margin:0 0 8px">'+t.types+'</p>'+typesPanel(t,true)+'</td></tr>';
      return r;
    }).join('');
    return '<div><p class="label">'+t.airlines+' · 36</p><div class="card" style="overflow:visible"><table class="etable">'+head+rows+'</table></div></div>';
  }
  function phoneRows(t,withExp){
    return '<div><p class="label">'+t.airlines+' · 36</p><div class="card">'+AIR.map(function(a,i){
      var meta=a[1]+' · '+(a[5]||'—')+' · '+(a[3]?t.views(a[3]):t.never);
      var r='<div class="urow">'+thumb(a[2])+'<span class="who"><b>'+a[0]+'</b><small class="mono">'+meta+'</small></span><span class="btn sq" style="border:0;background:none" aria-label="'+t.openmenu+'">'+ic('more')+'</span></div>';
      if(i===0&&withExp)r+='<div style="padding:8px 12px 12px;background:var(--chip);display:flex;flex-direction:column;gap:8px"><p class="label" style="margin:0 4px">'+t.types+'</p><div style="display:flex;flex-direction:column;gap:8px">'+typesPanel(t).replace('class="types"','class="types" style="grid-template-columns:1fr"')+'</div></div>';
      return r;
    }).join('')+'</div></div>';
  }
  function page(vp,t,opts){
    opts=opts||{};
    var head='<h3 class="title"'+(vp==='phone'?' style="font-size:34px"':'')+'>'+t.title+'</h3>';
    var body=toolbar(t,vp)+unidBlock(t,vp,opts.form)+bynameBlock(t)+(vp==='phone'?phoneRows(t,opts.exp):tableBlock(t,vp,opts.menu,opts.exp));
    if(vp==='phone')return phoneShell(t,head+body,opts.overlay);
    return sidebar(t)+'<div class="main" style="left:240px"><div style="max-width:1100px;display:flex;flex-direction:column;gap:20px">'+head+body+'</div></div>'+(opts.overlay||'');
  }
  function addDlg(t){return '<div class="scrim"></div><div class="dlg" role="dialog" aria-label="'+t.addT+'"><h4>'+t.addT+'</h4><span class="sub">'+t.addH+'</span><select class="sel" aria-label="'+t.typeph+'"><option>A330-300</option><option>B737-800</option><option>A321</option><option>'+t.typeph+'…</option></select><a class="btn" href="#">'+ic('plus')+t.choose+'</a><div class="row"><a class="btn" href="#">'+t.cancel+'</a><a class="btn dark" href="#">'+t.save+'</a></div></div>';}
  function renameDlg(t){return '<div class="scrim"></div><div class="dlg" role="dialog" aria-label="'+t.renameT+'"><h4>'+t.renameT+'</h4><span class="sub">'+t.renameH+'</span><label class="field"><input value="Air France" aria-label="'+t.nameph+'"></label><div class="row"><a class="btn" href="#">'+t.cancel+'</a><a class="btn dark" href="#">'+t.save+'</a></div></div>';}
  function completeSheet(t){return '<div class="scrim"></div><div class="sheet" role="dialog" aria-label="'+t.complete+'"><span class="grab"></span><h4 style="margin:0;font-size:20px"><span class="mono">CMA</span> · '+t.complete+'</h4><span class="sub">'+t.complh+'</span>'+uformHtml(t,'phone').replace('class="uform"','class="uform" style="padding:0;background:none;border:0"')+'<div class="row" style="display:flex;gap:10px"><a class="btn" style="flex:1" href="#">'+t.cancel+'</a></div></div>';}

  function mock(vp,caption,sub,builder,scroll){
    var langs=['en','fr'].map(function(l){return '<div data-lang="'+l+'">'+builder(vp,S[l])+'</div>';}).join('');
    var box='<div data-viewport="'+vp+'"'+(scroll?' data-scroll="'+scroll+'"':'')+'>'+langs+'</div>';
    return '<figure class="mock"><figcaption>'+caption+(sub?'<small>'+sub+'</small>':'')+'</figcaption>'+(vp==='desktop'?'<div class="scroller">'+box+'</div>':box)+'</figure>';
  }
  function section(h,lead,body,extra){return '<section class="sec"><h2>'+h+'</h2><p class="lead">'+lead+'</p>'+body+(extra||'')+'</section>';}
  var html='';
  html+=section('1. Desktop: the Airlines editor',
    'Same real shell. At the top: search and filter chips with their counts (All, Unidentified, Known by name only, No artwork, Seen, Not seen yet). An unidentified prefix is a short row. When a name can be suggested, the suggestion is right in the row with a single <b>Validate</b> button (and a quiet <b>Edit</b> link to correct the name). When there is no suggestion, the row has a <b>Complete</b> button that opens a small form with just the airline name; the aircraft seen are in the main row, never asked, since they are detected from the flights. There is no Ignore. (The suggested names here are invented examples.) Airlines known by name only (no aircraft artwork yet) are rows with <b>Add the first artwork</b>: a dialog asks for which aircraft type, then for the image, and that type becomes the airline&rsquo;s default type. In the airlines table the name is plain text (renaming is an action of the row menu) and the column shows the airline&rsquo;s <b>default type</b>: an airline has no artwork of its own, the artwork belongs to its aircraft types.',
    '<div class="row2">'+mock('desktop','Editor, Complete opened on the prefix without a suggestion','',function(v,t){return page(v,t,{form:true});})+'</div>');
  html+=section('2. Desktop: the row menu and the types panel',
    'The airline menu lists <b>Rename</b>. Two more items appear only when they apply: <b>Reset to the original name</b> (the name that ships in the application&rsquo;s built-in airline list) shows only for an airline that was renamed, and <b>Delete my name</b> shows for an airline named by hand (it sends the prefix back to the unidentified list). Artwork belongs to the aircraft types: opening a row shows its types in a clean panel. Each type shows its own artwork or the default type&rsquo;s artwork, carries a <b>Default type</b> pill when it is the default, and has its own menu: <b>Set as default type</b> and <b>Delete the artwork</b> (the type then shows the default type&rsquo;s artwork again, so there is no separate &ldquo;use the default&rdquo; action). One type is the default and its artwork shows for every type without a dedicated one.',
    '<div class="row2">'+mock('desktop','Airline menu open on the first row','',function(v,t){return page(v,t,{menu:true});},700)+'</div>'+
    '<div style="height:32px"></div><div class="row2">'+mock('desktop','First row opened: its aircraft types, one type menu open','',function(v,t){return page(v,t,{exp:true});},700)+'</div>'+
    '<div style="height:32px"></div><div class="row2">'+mock('desktop','Rename dialog','',function(v,t){return page(v,t,{overlay:renameDlg(t)});})+mock('desktop','Add the first artwork','Choose the aircraft type, then the image',function(v,t){return page(v,t,{overlay:addDlg(t)});})+'</div>');
  html+=section('3. Phone',
    'Compact rows: a prefix and one Complete button for the unidentified ones (the form is a bottom sheet), read-only rows with Add artwork for those known by name only, and one line per airline (thumbnail, name, prefix, views, a menu). Opening an airline shows its aircraft types in one column. Filters scroll as chips.',
    '<div class="row2">'+mock('phone','Editor','Scroll inside the phone',function(v,t){return page(v,t,{});})+mock('phone','Complete sheet','',function(v,t){return page(v,t,{overlay:completeSheet(t)});})+mock('phone','An airline opened','Aircraft types seen',function(v,t){return page(v,t,{exp:true});},640)+'</div>');
  document.getElementById('app').innerHTML=html;
  document.querySelectorAll('[data-scroll]').forEach(function(v){var y=+v.dataset.scroll;v.querySelectorAll('.main,.screen').forEach(function(m){m.scrollTop=y;});});
  document.querySelectorAll('[data-lang]').forEach(function(root){root.querySelectorAll('.sw').forEach(function(s){s.addEventListener('click',function(){s.classList.toggle('on');});});});
  var r=document.documentElement;r.setAttribute('data-ui-lang','en');
  document.querySelectorAll('#theme button').forEach(function(b){b.addEventListener('click',function(){
    if(b.dataset.t==='auto')r.removeAttribute('data-ui-theme');else r.setAttribute('data-ui-theme',b.dataset.t);
    document.querySelectorAll('#theme button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});});});
  document.querySelectorAll('#lang button').forEach(function(b){b.addEventListener('click',function(){
    r.setAttribute('data-ui-lang',b.dataset.l);r.lang=b.dataset.l;
    document.querySelectorAll('#lang button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});});});
})();
</script>
</html>
