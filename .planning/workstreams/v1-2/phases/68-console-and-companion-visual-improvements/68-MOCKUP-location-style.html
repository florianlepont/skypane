:root{

  --text:#17191F; --muted:#5B6372; --border:#DAE1EB; --chip:#E9EEF5; --card:#fff;
  --accent:#1F2430; --on-accent:#fff; --glass:rgba(255,255,255,.78); --tab:#fff; --shadow:0 6px 20px rgba(20,30,50,.08);
  --ok:#16A34A; --okbg:#DDF3E4; --warn:#D97706; --err:#BE123C;
}
@media (prefers-color-scheme:dark){:root:not([data-ui-theme="light"]){
  --sky:linear-gradient(#12151D,#161A24 45%,#1A1F2B); --canvas:#161A24; --stage:#0E1117;
  --text:#F1F3F6; --muted:#A3ABBB; --border:#2A3040; --chip:#232A38; --card:#1C222D;
  --accent:#F2EFE9; --on-accent:#14171F; --glass:rgba(34,40,54,.82); --tab:#1C222D; --shadow:0 6px 20px rgba(0,0,0,.35);
  --ok:#4ADE80; --okbg:#173225; --warn:#FBBF24; --err:#FB7185; color-scheme:dark}}
:root[data-ui-theme="dark"]{
  --sky:linear-gradient(#12151D,#161A24 45%,#1A1F2B); --canvas:#161A24; --stage:#0E1117;
  --text:#F1F3F6; --muted:#A3ABBB; --border:#2A3040; --chip:#232A38; --card:#1C222D;
  --accent:#F2EFE9; --on-accent:#14171F; --glass:rgba(34,40,54,.82); --tab:#1C222D; --shadow:0 6px 20px rgba(0,0,0,.35);
  --ok:#4ADE80; --okbg:#173225; --warn:#FBBF24; --err:#FB7185; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--stage);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:32px 16px 96px}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.top{max-width:1500px;margin:0 auto 24px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end}
.top h1{margin:0 0 8px;font-size:34px;letter-spacing:-.03em}
.top p{margin:0;color:var(--muted);max-width:75ch}
.toggles{display:flex;gap:16px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--chip);border-radius:32px;padding:4px;gap:4px}
.seg button{border:0;background:none;min-height:44px;padding:0 16px;border-radius:32px;cursor:pointer;font-size:15px}

.sec{max-width:1500px;margin:56px auto 0}

.row2{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.mock{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.mock>figcaption{font-size:15px;font-weight:600}
.mock>figcaption small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.scroller{max-width:100%;overflow-x:auto;padding-bottom:8px}
[data-ui-lang="en"] [data-lang="fr"],[data-ui-lang="fr"] [data-lang="en"]{display:none}
.note{margin:12px 0 0;padding:12px 16px;border:1px dashed var(--border);border-radius:14px;color:var(--muted);font-size:14px;max-width:85ch}
.note b{color:var(--text)}

[data-viewport]{position:relative;overflow:hidden;border:1px solid var(--border);background:var(--sky) var(--canvas);box-shadow:0 12px 40px rgba(20,30,50,.12)}
[data-viewport="phone"]{width:390px;height:780px;border-radius:36px}
[data-viewport="desktop"]{width:1440px;height:900px;border-radius:16px}
[data-viewport] [data-lang]{height:100%;position:relative}

/* shared pieces */
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;display:inline-block}
.dot.idle{background:var(--muted)}.dot.err{background:var(--err)}.dot.pend{background:var(--warn)}
.label{margin:0 0 6px 16px;font-size:13px;font-weight:600;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--border);border-radius:14px;background:var(--card);font-size:15px;font-weight:600;cursor:pointer}
.btn.dark{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.sq{width:44px;padding:0}
.field{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--border);border-radius:14px;background:var(--card)}
.field input{flex:1;min-width:0;border:0;background:none;min-height:42px;outline:0}
.title{margin:0;font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-.03em}
.sub{color:var(--muted);font-size:15px}
.state{margin:6px 0 0;display:flex;align-items:center;gap:8px;font-weight:600}

/* rows */
.item{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 16px;border-top:1px solid var(--border)}
.item:first-child{border-top:0}
.item .who{flex:1;min-width:0}
.item .who small{display:block;color:var(--muted);font-size:13px}

.ico{width:36px;height:36px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none}
.ico.ok{background:var(--okbg);color:var(--ok)}
.sw{flex:none;width:51px;height:31px;border-radius:31px;background:#7C8696;position:relative;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--accent)}.sw.on::after{left:22px}
.badge{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:32px;border:1px solid var(--border);font-size:12px;color:var(--muted)}
.range{height:6px;border-radius:6px;background:var(--border);position:relative;margin:14px 0 4px}
.range i{position:absolute;left:0;top:0;bottom:0;width:26%;border-radius:6px;background:var(--accent)}
.range b{position:absolute;left:26%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--accent)}
.section{display:flex;flex-direction:column}
.danger b{color:var(--err)}

/* frame list rows */
.frow{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 14px;border-top:1px solid var(--border);cursor:pointer}
.frow:first-child{border-top:0}
.frow .who{flex:1;min-width:0}
.frow .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .who small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .seen{font-size:13px;color:var(--muted);white-space:nowrap}
.frow.retired{opacity:.8}
.frow.sel{background:var(--chip)}
.chev{color:var(--muted)}

/* phone shell */
.ptop{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:5}

.tabs{position:absolute;left:12px;right:12px;bottom:14px;display:flex;justify-content:space-around;padding:8px 6px;background:var(--tab);border:1px solid var(--border);border-radius:34px;box-shadow:0 8px 24px rgba(20,30,50,.14);z-index:6}

<div class="top">
  <div><h1>Location and Style</h1><p>Mockup for the owner, on the real shell (CON-01: R06 to R09, D-10). Sample data is invented. Use the toggles.</p></div>

<script>
(function(){

      nT:'Leave without saving?',nB:'Your changes to Departures colours are not saved yet.',nSave:'Save and leave',nDis:'Leave without saving',nStay:'Stay here',
      bar:'Unsaved changes',barSave:'Save',barCancel:'Cancel',
      yel:'Light yellow',blue:'Light blue',full:'Full',soft:'Soft stripe'},
    fr:{tabs:['Accueil','Vols','Airlines','Style','Lieu','Compte'],side:['Accueil','Vols','Airlines','Style','Lieu'],space:['Console','Mes cadres'],acct:'Compte',
      ph:'Aéroport (ORY) ou adresse',mypos:'Ma position',airport:'Aéroport',info:'À propos de cette carte',france:'Voir toute la France',recenter:'Utiliser ma position',
      found:'Position trouvée (environ 12 m). Vérifiez le repère, puis enregistrez.',
      ap:'Paris-Orly Airport',apc:'LFPO · ORY',r:['Piste 2','Piste 4','Piste 3'],
      style:'Style',dep:'Départs',
      lT:'Modifications non enregistrées',lB:'Vous avez des modifications non enregistrées. Que voulez-vous faire ?',lSave:'Enregistrer et continuer',lDis:'Abandonner',lStay:'Rester ici',
      nT:'Quitter sans enregistrer ?',nB:'Vos changements aux couleurs des départs ne sont pas encore enregistrés.',nSave:'Enregistrer et quitter',nDis:'Quitter sans enregistrer',nStay:'Rester ici',
      bar:'Modifications non enregistrées',barSave:'Enregistrer',barCancel:'Annuler',
      yel:'Jaune clair',blue:'Bleu clair',full:'Plein',soft:'Bande claire'}
  };
  Object.keys(S.fr).forEach(function(k){var v=S.fr[k];if(typeof v==='string')S.fr[k]=nb(v);else if(Array.isArray(v))S.fr[k]=v.map(nb);});
  function ic(n){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-'+n+'"/></svg>';}
  var TI=['frame','clock','tag','grid','fleet','user'];
  function userSide(t,on){
    return '<div class="side"><span class="brand">'+ic('logo')+'SkyPane</span><div class="space"><span class="on">'+ic('check')+t.space[1]+'</span><span>'+t.space[0]+'</span></div><div class="sep"></div>'+
      t.side.map(function(x,i){return '<div class="nav'+(on===i?' on':'')+'">'+ic(TI[i])+x+'</div>';}).join('')+'<div class="sep"></div><div class="nav">'+ic('user')+t.acct+'</div></div>';
  }
  function userPhone(t,inner,on){
    return '<div class="ptop"><span class="brand">'+ic('logo')+'SkyPane</span></div><div class="screen" style="padding:0">'+inner+'</div><div class="tabs">'+t.tabs.map(function(x,i){return '<div class="tab'+(on===i?' on':'')+'">'+ic(TI[i])+x+'</div>';}).join('')+'</div>';
  }
  function wrap(vp,t,inner,on){
    if(vp==='phone')return userPhone(t,inner,on);

  }
  function mapSvg(){return '<svg viewBox="0 0 360 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path class="land" d="M0 60C80 40 150 90 230 70S330 40 360 80V300H0z"/><path class="road" d="M0 220C90 190 160 240 360 170M120 0C140 90 110 160 150 300"/><line class="rwy" x1="150" y1="150" x2="238" y2="116"/><line class="rwyc" x1="150" y1="150" x2="238" y2="116"/><circle class="pin" cx="188" cy="134" r="0"/></svg>';}
  function mapCtl(t,controls){
    return '<div class="mrow" style="position:absolute;right:12px;bottom:12px;gap:10px">'+(controls==='today'?'<span class="pillb" style="min-height:44px">'+t.france+'</span>':'<a class="iconbtn" href="#" aria-label="'+t.france+'">'+ic('france')+'</a>')+'<a class="iconbtn" href="#" aria-label="'+t.recenter+'">'+ic('locate')+'</a></div>';
  }
  function locPage(t,mode){
    var box='<div class="sbox"><span>'+t.ph+'</span><a class="iconbtn" href="#" aria-label="Search" style="width:40px;height:40px;border-radius:50%">'+ic('search')+'</a></div>';

      '<div class="mrow"><span class="pillb">'+ic('locate')+t.mypos+'</span><span class="pillb on">'+ic('plane')+t.airport+'</span><a class="iconbtn" href="#" style="border-radius:50%" aria-label="'+t.info+'">'+ic('info')+'</a></div>':
      '<div class="mrow"><div class="igrp" role="group"><a class="ib" href="#" aria-label="'+t.mypos+'" title="'+t.mypos+'">'+ic('locate')+'</a><a class="ib on" href="#" aria-label="'+t.airport+'" title="'+t.airport+'" aria-pressed="true">'+ic('plane')+'</a></div><a class="iconbtn" href="#" style="border-radius:50%" aria-label="'+t.info+'">'+ic('info')+'</a></div>';
    var found=mode==='today'?'<div class="note2">'+t.found+'</div>':'';
    var card='<div class="mcard"><div><b style="font-size:20px">'+t.ap+'</b><div class="sub">'+t.apc+'</div></div><div class="runways"><span class="rw"><b>02/20</b><small>'+t.r[0]+'</small></span><span class="rw on"><b>06/24</b><small>'+t.r[1]+'</small></span><span class="rw"><b>07/25</b><small>'+t.r[2]+'</small></span></div>'+found+'</div>';
    return '<div class="mtop" style="padding-top:8px">'+box+row+'</div><div class="map" style="height:'+(mode==='today'?'250':'310')+'px">'+mapSvg()+mapCtl(t,mode)+'</div>'+card;

  function barHtml(t){return '<div class="mrow" style="justify-content:space-between;padding:12px 16px;background:var(--card);border-top:1px solid var(--border)"><b>'+t.bar+'</b><span class="mrow"><a class="btn" href="#">'+t.barCancel+'</a><a class="btn dark" href="#">'+t.barSave+'</a></span></div>';}

    return '<div style="padding:16px"><h3 class="title" style="font-size:34px;margin:0 0 12px">'+t.style+'</h3><div class="seg" style="margin-bottom:12px"><button type="button" aria-pressed="true">'+t.dep+'</button></div><div class="swr"><span class="sw2"><span class="prev" style="background:#808080"></span><b>Gris</b></span><span class="sw2"><span class="prev" style="background:#bcd0ee"></span><b>'+t.blue+'</b></span></div></div>';
  }
  function dlgOld(t){return '<div class="scrim"></div><div class="sheet" role="dialog"><span class="grab"></span><h4>'+t.lT+'</h4><p>'+t.lB+'</p><div class="dlg2"><a class="btn dark" href="#">'+t.lSave+'</a><a class="btn" href="#">'+t.lDis+'</a><a class="btn" href="#">'+t.lStay+'</a></div></div>';}
  function dlgNew(t){return '<div class="scrim"></div><div class="sheet" role="alertdialog"><span class="grab"></span><h4>'+t.nT+'</h4><p>'+t.nB+'</p><div class="dlg2"><a class="btn dark" href="#">'+t.nSave+'</a><a class="btn" href="#">'+t.nDis+'</a><a class="btn ghost2" href="#">'+t.nStay+'</a></div></div>';}
  function dlgCard(t,kind){var o=kind==='old';return '<div class="scrim"></div><div class="dlg" role="dialog" style="width:min(420px,88%)"><h4>'+(o?t.lT:t.nT)+'</h4><p>'+(o?t.lB:t.nB)+'</p><div class="dlg2"><a class="btn dark" href="#">'+(o?t.lSave:t.nSave)+'</a><a class="btn" href="#">'+(o?t.lDis:t.nDis)+'</a><a class="btn'+(o?'':' ghost2')+'" href="#">'+(o?t.lStay:t.nStay)+'</a></div></div>';}
  function styleScreen(t,over){return styleBase(t)+barHtml(t)+over;}
  function yellowCard(t,mode){
    var ring=mode==='prop'?'box-shadow:inset 0 0 0 2px #8a6d00;':'';

    return '<div style="padding:16px;display:flex;gap:12px;flex-wrap:wrap">'+sw(t.yel,'#f4f1e6','#fbe96a',ring,'#8a6d00')+sw(t.blue,'#e7eefb','#bcd0ee','','#5f7fb8')+'</div>';

  var html='';

    '<div class="row2">'+mock('phone','Map and runway line','Switch the theme to Dark above',function(v,t){return wrap(v,t,locPage(t,'prop'),4);})+'</div>');
  html+=section('3. Style: the unsaved-changes question (R06)',
    'Today the question has a title that repeats the bar behind it, two buttons whose effect is unclear (Save and continue / Discard), and a Stay here button of another size on desktop. Proposed: a title that is a question, one sentence naming what is lost, then three equal 48 px buttons stacked: Save and leave (primary), Leave without saving, Stay here (quiet). The bar behind is dimmed, so only one status shows.',
    '<div class="row2">'+mock('phone','Today','',function(v,t){return wrap(v,t,styleScreen(t,dlgOld(t)),3);})+mock('phone','Proposed','',function(v,t){return wrap(v,t,styleScreen(t,dlgNew(t)),3);})+'</div><div style="height:32px"></div><div class="row2">'+mock('desktop','Today, desktop','',function(v,t){return wrap(v,t,styleScreen(t,dlgCard(t,'old')),3);})+mock('desktop','Proposed, desktop','',function(v,t){return wrap(v,t,styleScreen(t,dlgCard(t,'new')),3);})+'</div>');
  html+=section('4. Style: the yellow stripe (D-10)',
    'The light-yellow Soft stripe has a contrast of 1.12 against the panel, so it nearly vanishes. Proposed: a thin darker-yellow edge (2 px) on the stripe and on the yellow tile, so the shape reads on the screen. This only changes the preview on screen; whether the real panel needs a different yellow is checked on the physical frame later.',
    '<div class="row2">'+mock('phone','Today','',function(v,t){return wrap(v,t,yellowCard(t,'today'),3);})+mock('phone','Proposed','',function(v,t){return wrap(v,t,yellowCard(t,'prop'),3);})+'</div>');
  document.getElementById('app').innerHTML=html;
  var r=document.documentElement;r.setAttribute('data-ui-lang','en');
  document.querySelectorAll('#theme button').forEach(function(b){b.addEventListener('click',function(){
    if(b.dataset.t==='auto')r.removeAttribute('data-ui-theme');else r.setAttribute('data-ui-theme',b.dataset.t);
    document.querySelectorAll('#theme button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});});});
  document.querySelectorAll('#lang button').forEach(function(b){b.addEventListener('click',function(){
    r.setAttribute('data-ui-lang',b.dataset.l);r.lang=b.dataset.l;
    document.querySelectorAll('#lang button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});});});
})();
</script>
