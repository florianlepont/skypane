<div class="top">
  <div><h1>Account, sign-in and 404</h1><p>Mockup for the owner, on the real shell (CON-01: R19 to R24). Sample data is invented. Use the toggles.</p></div>
  <div class="toggles">
    <div class="seg" id="theme" role="group" aria-label="Theme"><button type="button" data-t="auto" aria-pressed="true">Auto</button><button type="button" data-t="light" aria-pressed="false">Light</button><button type="button" data-t="dark" aria-pressed="false">Dark</button></div>
    <div class="seg" id="lang" role="group" aria-label="Language"><button type="button" data-l="en" aria-pressed="true">English</button><button type="button" data-l="fr" aria-pressed="false">Fran&ccedil;ais</button></div>
  </div>
</div>
<div id="app"></div>
<script>
(function(){
  function nb(s){return s.replace(/ ([:;?!»])/g,' $1').replace(/« /g,'« ');}
  var S={
    en:{tabs:['Home','Flights','Airlines','Style','Location','Account'],side:['Home','Flights','Airlines','Style','Location'],space:['Console','My frames'],
      acct:'Account',acctsub:'Your SkyPane sign-in and preferences.',frames:'My frames',owner:'Owner',co:'Co-manager',seen:'Seen just now',seen2:'Seen 3 h ago',
      manage:'Manage access',leave:'Leave frame',add:'Add a frame',ident:'Identity',email:'Email',role:'Role',user:'User',adm:'Administrator',about:'About',credits:'Credits',creditsSub:'Data sources and licences',
      lang:'Language',prefs:'Preferences',langHint:'The language of the companion pages.',theme:'Theme',themeHint:'Light, dark, or follow the system.',themes:['Auto','Light','Dark'],signout:'Sign out',hw:'XIAO ePaper EE02 13.3in',by:'Shared by marie@example.test',
      today:'Today',prop:'Proposed',
      cT:'Credits',cI:'SkyPane shows live flights thanks to these open data sources.',back:'Back to Account',
      lg1:'Sign in to manage your SkyPane frames.',lgBtn:'Sign in',first:'First visit? Use the email address you were invited with.',lgCred:'Credits',
      nfT:'Page not found.',nfB:'This page does not exist, or it is reserved for administrators.',nfBtn:'Back to Home',nfA:'Looks like this one missed the runway.',nfB2:'Nothing hangs on this wall.'},
    fr:{tabs:['Accueil','Vols','Airlines','Style','Lieu','Compte'],side:['Accueil','Vols','Airlines','Style','Lieu'],space:['Console','Mes cadres'],
      acct:'Compte',acctsub:'Votre connexion SkyPane et vos préférences.',frames:'Mes cadres',owner:'Propriétaire',co:'Cogestionnaire',seen:'Vu à l’instant',seen2:'Vu il y a 3 h',
      manage:'Gérer l’accès',leave:'Quitter le cadre',add:'Ajouter un cadre',ident:'Identité',email:'E-mail',role:'Rôle',user:'Utilisateur',adm:'Administrateur',about:'À propos',credits:'Crédits',creditsSub:'Sources de données et licences',
      lang:'Langue',prefs:'Préférences',langHint:'La langue des pages du compagnon.',theme:'Thème',themeHint:'Clair, sombre, ou suivre le système.',themes:['Auto','Clair','Sombre'],signout:'Se déconnecter',hw:'XIAO ePaper EE02 13.3in',by:'Partagé par marie@example.test',
      today:'Aujourd’hui',prop:'Proposé',
      cT:'Crédits',cI:'SkyPane affiche les vols en direct grâce à ces sources de données ouvertes.',back:'Retour au compte',
      lg1:'Connectez-vous pour gérer vos cadres SkyPane.',lgBtn:'Se connecter',first:'Première visite ? Utilisez l’adresse e-mail avec laquelle on vous a invité.',lgCred:'Crédits',
      nfT:'Page introuvable.',nfB:'Cette page n’existe pas, ou elle est réservée aux administrateurs.',nfBtn:'Retour à l’accueil',nfA:'On dirait que celui-ci a raté la piste.',nfB2:'Rien n’est accroché à ce mur.'}
  };
  Object.keys(S.fr).forEach(function(k){var v=S.fr[k];if(typeof v==='string')S.fr[k]=nb(v);else if(Array.isArray(v))S.fr[k]=v.map(nb);});
  function ic(n){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-'+n+'"/></svg>';}
  var TI=['frame','clock','tag','grid','fleet','user'];
  function userSide(t,on){
    return '<div class="side"><span class="brand">'+ic('logo')+'SkyPane</span><div class="space"><span class="on">'+ic('check')+t.space[1]+'</span><span>'+t.space[0]+'</span></div><div class="sep"></div>'+
      t.side.map(function(x,i){return '<div class="nav">'+ic(TI[i])+x+'</div>';}).join('')+'<div class="sep"></div><div class="nav'+(on==='acct'?' on':'')+'">'+ic('user')+t.acct+'</div></div>';
  }
  function userPhone(t,inner,on){
    return '<div class="ptop"><span class="brand">'+ic('logo')+'SkyPane</span></div><div class="screen">'+inner+'</div><div class="tabs">'+t.tabs.map(function(x,i){return '<div class="tab'+(on===i?' on':'')+'">'+ic(TI[i])+x+'</div>';}).join('')+'</div>';
  }
  function wrap(vp,t,inner,on,side){
    if(vp==='phone')return userPhone(t,inner,on);
    return userSide(t,side)+'<div class="main" style="left:240px"><div class="page2">'+inner+'</div></div>';
  }
  function dot(c,txt){return '<span class="dot'+(c?' '+c:'')+'" role="img" aria-label="'+txt+'"></span>';}
  function frameRow(t,o){
    var pill='<span class="chipv" style="margin-left:6px">'+(o.shared?t.co:t.owner)+'</span>';
    var line=o.hw?'<small class="ln">'+t.hw+'</small>':(o.shared?'<small class="ln">'+t.by+'</small>':'');
    var seen='<small class="ln st">'+dot(o.dot||'',o.seen)+o.seen+'</small>';
    var act=o.today?'':'<a class="iconbtn" href="#" aria-label="'+(o.shared?t.leave:t.manage)+'">'+ic(o.shared?'out':'key')+'</a>';
    var todayAct=o.today?'<a class="lnk" href="#">'+(o.shared?t.leave:t.manage)+'</a>':'';
    return '<div class="arow'+(o.today?' tall':'')+'"><span class="thumb"></span><span class="who"><b>'+o.name+'</b>'+pill+line+seen+todayAct+'</span>'+act+'</div>';
  }
  function framesCard(t,today,admin){
    var r=frameRow(t,{name:'Kitchen shelf',seen:t.seen,today:today,dot:'',hw:today&&admin||false})+frameRow(t,{name:'Orly window',seen:t.seen2,today:today,dot:'idle',hw:today&&admin||false})+frameRow(t,{name:'Studio',shared:true,seen:t.seen,today:today});
    return '<div><p class="label">'+t.frames+'</p><div class="card vlist">'+r+'<div class="arow add">'+ic('plus')+'<b>'+t.add+'</b></div></div></div>';
  }
  function group(rows){return '<div class="card vlist">'+rows+'</div>';}
  function kv(k,v){return '<div class="arow kv"><span>'+k+'</span><span class="sub">'+v+'</span></div>';}
  function accountPage(t,o){
    var h='<div class="pagehead"><h3 class="title">'+t.acct+'</h3><span class="sub">'+t.acctsub+'</span></div>';
    var id='<div><p class="label">'+t.ident+'</p>'+group(kv(t.email,o.admin?'admin@example.test':'user-a@example.test')+kv(t.role,o.admin?t.adm:t.user))+'</div>';
    var about=o.today?'':'<div><p class="label">'+t.about+'</p>'+group('<div class="arow link"><span class="who"><b>'+t.credits+'</b><small class="ln">'+t.creditsSub+'</small></span>'+ic('chev')+'</div>')+'</div>';
    function seg(a,on){return '<div class="seg">'+a.map(function(x,i){return '<button type="button" aria-pressed="'+(i===on)+'">'+x+'</button>';}).join('')+'</div>';}
    function prow(l,hint,c){return '<div class="arow pref"><span class="who"><b>'+l+'</b><small class="ln">'+hint+'</small></span>'+c+'</div>';}
    var pref='<div><p class="label">'+t.prefs+'</p>'+group(prow(t.lang,t.langHint,seg(['English','Français'],t===S.fr?1:0))+prow(t.theme,t.themeHint,seg(t.themes,0)))+'</div>';
    var out='<div>'+group('<div class="arow link"><b style="color:var(--bad,#b42318)">'+t.signout+'</b></div>')+'</div>';
    return h+framesCard(t,o.today,o.admin)+id+pref+about+out;
  }
  function creditsPage(t){
    return '<div class="pagehead"><a class="backl" href="#">'+ic('chev').replace('<svg','<svg style="transform:rotate(180deg)"')+t.back+'</a><h3 class="title">'+t.cT+'</h3><span class="sub">'+t.cI+'</span></div>'+
      group('<div class="arow link"><span class="who"><b>adsb.fi</b><small class="ln">ADS-B positions · ODbL</small></span></div><div class="arow link"><span class="who"><b>adsb.lol</b><small class="ln">ADS-B positions · ODbL</small></span></div><div class="arow link"><span class="who"><b>adsbdb</b><small class="ln">Callsign to airline and route</small></span></div>');
  }
  function loginCard(t,v){
    var first='<p class="first">'+t.first+'</p>';
    var old='<p class="sub" style="margin:0">'+t.first+'</p>';
    var card=v==='today'?
      '<div class="lcard"><span class="lg">'+ic('logo')+'</span><h3 class="title" style="font-size:30px">SkyPane</h3><p class="lead0">'+t.lg1+'</p>'+old+'<a class="btn dark wide" href="#">'+t.lgBtn+'</a><a class="lnk center" href="#">'+t.lgCred+'</a></div>':
      '<div class="lcard"><span class="lg">'+ic('logo')+'</span><h3 class="title" style="font-size:30px">SkyPane</h3><p class="lead0">'+t.lg1+'</p><a class="btn dark wide" href="#">'+t.lgBtn+'</a>'+first+'<a class="lnk center" href="#">'+t.lgCred+'</a></div>';
    return '<div class="lwrap">'+card+'</div>';
  }
  function plane(){return '<svg viewBox="0 0 220 120" class="ill" aria-hidden="true"><rect x="10" y="92" width="200" height="10" rx="5" fill="var(--border)"/><path d="M30 97h40M90 97h40M150 97h40" stroke="var(--card)" stroke-width="3" stroke-dasharray="14 12"/><g transform="translate(120 36) rotate(18)"><path d="M0 14c0-4 4-6 12-6h34l22-12h8l-10 12h14c6 0 6 8 0 8H44l-12 12h-8l6-12H12c-8 0-12-2-12-6z" fill="var(--text)"/></g><path d="M60 24c14-10 30-8 40 2" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="3 5"/></svg>';}
  function emptyFrame(){return '<svg viewBox="0 0 220 120" class="ill" aria-hidden="true"><rect x="70" y="14" width="80" height="100" rx="10" fill="none" stroke="var(--text)" stroke-width="6"/><rect x="82" y="26" width="56" height="76" rx="4" fill="var(--border)"/><path d="M96 80l12-14 10 10 8-8 12 12" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="118" cy="48" r="6" fill="var(--muted)"/></svg>';}
  function nf(t,v,vp){
    var art=v==='a'?plane():v==='b'?emptyFrame():'';
    var cap=v==='a'?t.nfA:v==='b'?t.nfB2:'';
    return '<div class="pagehead"><h3 class="title">'+t.nfT+'</h3><span class="sub">'+t.nfB+'</span></div>'+(art?'<div class="card nfcard">'+art+'<p class="nfc">'+cap+'</p></div>':'')+'<a class="btn dark wide" href="#">'+t.nfBtn+'</a>';
  }
  function mock(vp,caption,sub,builder){
    var langs=['en','fr'].map(function(l){return '<div data-lang="'+l+'">'+builder(vp,S[l])+'</div>';}).join('');
    return '<figure class="mock"><figcaption>'+caption+(sub?'<small>'+sub+'</small>':'')+'</figcaption>'+(vp==='desktop'?'<div class="scroller"><div data-viewport="desktop">'+langs+'</div></div>':'<div data-viewport="phone">'+langs+'</div>')+'</figure>';
  }
  function section(h,lead,body,extra){return '<section class="sec"><h2>'+h+'</h2><p class="lead">'+lead+'</p>'+body+(extra||'')+'</section>';}
  var html='';
  html+=section('1. Account: frame rows (R19, R20, R21)',
    'Today each owned frame carries a "Manage access" link on its own line, which makes the row taller and leaves an odd margin (R19). Proposed: the action becomes a 44 px icon button at the right of the row (people icon for Manage access, cross for Leave frame, each with its full name read aloud), so the row keeps the height of a plain row. The status is the dot alone with the last-seen word, never a percentage (R20), the dot also named for screen readers. The hardware model is shown to nobody on this page: it is useless for an administrator and for a person (R21).',
    '<div class="row2">'+mock('phone','Today','',function(v,t){return wrap(v,t,accountPage(t,{today:true,admin:true}),5);})+mock('phone','Proposed','Same page, user view',function(v,t){return wrap(v,t,accountPage(t,{}),5);})+'</div>'+
    '<div style="height:32px"></div><div class="row2">'+mock('desktop','Proposed, administrator view','No hardware line',function(v,t){return wrap(v,t,accountPage(t,{admin:true}),5,'acct');})+'</div>');
  html+=section('2. Credits reachable once signed in (R23)',
    'A single "Credits" row in a new About group at the bottom of Account, for users and administrators, opening the existing Credits page. That page gets a "Back to Account" link when opened from there.',
    '<div class="row2">'+mock('phone','Account, About group','',function(v,t){return wrap(v,t,accountPage(t,{}),5);})+mock('phone','Credits page','',function(v,t){return wrap(v,t,creditsPage(t),5);})+'</div>');
  html+=section('3. Sign-in: First visit (R22)',
    'Today the hint is a second grey paragraph before the button, so the card reads as two instructions. Proposed: one calm centred line under the button, small and muted, no box, so the card reads heading, one sentence, button, then the hint and Credits.',
    '<div class="row2">'+mock('phone','Today','',function(v,t){return '<div class="screen" style="padding-top:60px">'+loginCard(t,'today')+'</div>';})+mock('phone','Proposed','',function(v,t){return '<div class="screen" style="padding-top:60px">'+loginCard(t,'prop')+'</div>';})+'</div>');
  html+=section('4. The 404 page (R24)',
    'Two ways to make it friendlier with one inline drawing on a design-system card (no new asset, no new font), same two sentences and the same 44 px button. Option A: a plane that missed the runway. Option B: an empty frame on the wall.',
    '<div class="row2">'+mock('phone','Today','',function(v,t){return wrap(v,t,nf(t,'',v),0);})+mock('phone','Option A: plane','',function(v,t){return wrap(v,t,nf(t,'a',v),0);})+mock('phone','Option B: empty frame','',function(v,t){return wrap(v,t,nf(t,'b',v),0);})+'</div>');
  document.getElementById('app').innerHTML=html;
  var r=document.documentElement;r.setAttribute('data-ui-lang','en');
  document.querySelectorAll('#theme button').forEach(function(b){b.addEventListener('click',function(){
    if(b.dataset.t==='auto')r.removeAttribute('data-ui-theme');else r.setAttribute('data-ui-theme',b.dataset.t);
    document.querySelectorAll('#theme button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});});});
  document.querySelectorAll('#lang button').forEach(function(b){b.addEventListener('click',function(){
    r.setAttribute('data-ui-lang',b.dataset.l);r.lang=b.dataset.l;
    document.querySelectorAll('#lang button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});});});
})();
</script>
