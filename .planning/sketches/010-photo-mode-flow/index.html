<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 010: Photo-mode flow (clickable)</title>
<style>
/* SkyPane companion — sketch theme for the v1.3 photo screens (sketches
   007-009). Tokens copied from the LIVE companion/static/style.css
   (read 2026-11-11): graphite accent (ivory in dark), glass cards, sky
   background, system sans only (no serif), radii 14/22/32. default.css
   (the warm serif / orange accent snapshot) is left untouched for
   sketches 001-006; the photo sketches link this file instead because
   the shipped stylesheet has moved on from that snapshot.
   Variables only. Shared component styles live in photo-shell.css. */

:root {
  --space-xs: 4px; --space-sm: 8px; --space-md: 16px; --space-lg: 24px;
  --space-xl: 32px; --space-2xl: 48px; --space-3xl: 64px;

  --font-caption-size: 13px;
  --font-label-size: 15px;
  --font-body-size: 16px;
  --font-heading-size: 22px;
  --font-card-title-size: 17px;
  --font-page-title-size: clamp(1.875rem, 1.55rem + 1.4vw, 2.125rem);
  --weight-regular: 400;
  --weight-semibold: 600;
  --weight-title: 700;
  --tracking-title: -0.03em;

  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --radius-control: 14px;
  --radius-card: 22px;
  --radius-pill: 32px;
  --radius-sheet: 28px;
  --radius-chip: 9px;

  --motion-fast: 180ms;
  --tab-bar-h: 68px;

  --sky-top: #E7EEF7; --sky-mid: #F1F3F6; --sky-bottom: #EDF1F6;
  --glass-solid: #FFFFFF;
  --glass-highlight: rgba(255, 255, 255, 0.9);
  --shadow-glass: inset 0 1px 0 var(--glass-highlight), 0 1px 2px rgba(18, 21, 27, 0.06), 0 14px 32px -16px rgba(18, 21, 27, 0.22);
  --bar-bg: rgba(255, 255, 255, 0.86);
  --bar-border: #AEB8C8;
  --bar-shadow: 0 1px 2px rgba(18, 21, 27, 0.2), 0 -4px 8px -4px rgba(18, 21, 27, 0.22);
  --color-canvas: #F1F3F6;
  --color-dominant: #FFFFFF;
  --color-secondary: #E9EEF5;
  --color-border: #DAE1EB;
  --color-accent: #1F2430;
  --color-accent-hover: #343B4D;
  --color-on-accent: #FFFFFF;
  --shadow-card: 0 1px 3px rgba(18, 21, 27, 0.06), 0 1px 2px rgba(18, 21, 27, 0.04);
  --shadow-control: inset 0 1px 0 rgba(255, 255, 255, .14), 0 1px 2px rgba(18, 21, 27, .14);
  --shadow-pop: 0 18px 48px rgba(18, 21, 27, 0.18), 0 4px 12px rgba(18, 21, 27, 0.08);
  --color-text: #17191F;
  --color-status-ok: #16A34A;
  --color-status-warn: #D97706;
  --color-status-error: #BE123C;
  --color-switch-off: #7C8799;
  --color-scrim: rgba(0, 0, 0, 0.5);
  --seg-edge: color-mix(in srgb, var(--color-text) 20%, transparent);
  --seg-selected-bg: var(--color-accent);
  --seg-selected-fg: var(--color-on-accent);
  --seg-idle-fg: color-mix(in srgb, var(--color-text) 70%, transparent);

  --color-toast-bg: #1D2028; --color-toast-fg: #F4F1EC;
  --color-toast-success: #4ADE80; --color-toast-info: #C3C9D4;
  --color-toast-warning: #FBBF24; --color-toast-error: #FB7185; --color-toast-pending: #FF9A70;

  /* Real Spectra 6 ink colours (server/panel_format.py PALETTE_RGB). */
  --ink-black: #000000; --ink-white: #FFFFFF; --ink-yellow: #F0E050;
  --ink-red: #A02020; --ink-blue: #2D5F9B; --ink-green: #326941;

  --color-text-muted: color-mix(in srgb, var(--color-text) 70%, transparent);
  color-scheme: light;
}

[data-theme="dark"] {
  --sky-top: #12151D; --sky-mid: #161A24; --sky-bottom: #1A1F2B;
  --glass-solid: #1C222D;
  --glass-highlight: rgba(255, 255, 255, 0.18);
  --shadow-glass: inset 0 1px 0 var(--glass-highlight), 0 1px 2px rgba(0, 0, 0, 0.3), 0 14px 32px -16px rgba(0, 0, 0, 0.55);
  --bar-bg: rgba(20, 24, 34, 0.9);
  --bar-border: #46506A;
  --bar-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 -4px 8px -4px rgba(0, 0, 0, 0.6);
  --color-canvas: #161A24;
  --color-dominant: #151922;
  --color-secondary: #1C222D;
  --color-border: #2A3040;
  --color-accent: #F2EFE9;
  --color-accent-hover: #E2DED5;
  --color-on-accent: #14171F;
  --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.3), 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-pop: 0 18px 48px rgba(0, 0, 0, 0.55), 0 4px 12px rgba(0, 0, 0, 0.35);
  --color-text: #F1F3F6;
  --color-status-ok: #4ADE80;
  --color-status-warn: #FBBF24;
  --color-status-error: #FB7185;
  --color-switch-off: #6B7589;
  color-scheme: dark;
}

/* Shared mock shell + components for the v1.3 photo sketches (007-009).
   Mirrors the live companion: sidebar from 960px, floating bottom tab bar
   below it, glass cards, solid-accent segmented controls, docked toasts,
   44px touch targets. Component styles only; tokens are in
   companion-current.css. Throwaway: nothing here is production code. */

* { box-sizing: border-box; }
html { min-height: 100%; background: linear-gradient(180deg, var(--sky-top), var(--sky-mid) 40%, var(--sky-bottom)) fixed; }
body { margin: 0; background: transparent; color: var(--color-text); font-family: var(--font-ui); font-size: var(--font-body-size); line-height: 1.45; -webkit-text-size-adjust: 100%; }
h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------- sketch chrome (not part of the design) ---------- */
.sk-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 9998; background: #14171F; color: #F1F3F6; font: 12px/1.3 system-ui, sans-serif; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.sk-bar b { font-weight: 600; margin-right: 4px; }
.sk-bar .sk-group { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: rgba(255,255,255,.12); }
.sk-bar button, .sk-bar select { font: 12px system-ui, sans-serif; border: 0; border-radius: 6px; padding: 6px 10px; background: transparent; color: #F1F3F6; }
.sk-bar select { background: rgba(255,255,255,.12); }
.sk-bar select option { color: #000; }
.sk-bar button[aria-pressed="true"], .sk-bar button.on { background: #F2EFE9; color: #14171F; font-weight: 600; }
.sk-bar button:hover:not([aria-pressed="true"]) { background: rgba(255,255,255,.2); }
.sk-bar .sk-sep { opacity: .45; }
body.nochrome .sk-bar, body.nochrome .sk-only { display: none !important; }
.sk-note { margin: var(--space-xl) 0 0; padding: var(--space-md); border: 1px dashed var(--seg-edge); border-radius: var(--radius-control); font-size: var(--font-caption-size); color: var(--color-text-muted); }
.sk-note b { color: var(--color-text); }
.sk-note ul { margin: 6px 0 0; padding-left: 18px; }

/* ---------- app shell ---------- */
.app { display: block; min-height: 100vh; }
.sidebar { display: none; }
.mobile-header { display: flex; align-items: center; justify-content: space-between; padding: var(--space-md) var(--space-lg) 0; }
.site-title { font-weight: var(--weight-title); font-size: 20px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.logo { width: 22px; height: 22px; border-radius: 7px; background: var(--color-accent); position: relative; flex: none; }
.logo::after { content: ""; position: absolute; left: 5px; top: 10px; width: 12px; height: 2px; background: var(--color-on-accent); transform: rotate(-24deg); border-radius: 2px; }
.page-content { padding: var(--space-xl) var(--space-lg) calc(var(--tab-bar-h) + 112px); max-width: 960px; }
body.chrome .page-content { padding-top: calc(var(--space-xl) + 0px); }
.tab-bar { position: fixed; left: 8px; right: 8px; bottom: 6px; z-index: 50; height: var(--tab-bar-h); display: flex; padding: 2px; border-radius: var(--radius-pill); background: var(--bar-bg); border: 1px solid var(--bar-border); box-shadow: var(--bar-shadow); }
.tab-bar a { flex: 1 1 0; min-width: 0; display: flex; color: var(--color-text); text-decoration: none; }
.tab-bar .pill { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; margin: 4px 0; border-radius: var(--radius-pill); }
.tab-bar svg { width: 22px; height: 22px; }
.tab-bar .lbl { font-size: 11px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tab-bar a[aria-current="page"] { color: var(--color-on-accent); font-weight: var(--weight-semibold); }
.tab-bar a[aria-current="page"] .pill { background: var(--color-accent); }

@media (min-width: 960px) {
  .app { display: grid; grid-template-columns: 248px 1fr; }
  .mobile-header, .tab-bar { display: none; }
  .sidebar { display: flex; flex-direction: column; gap: var(--space-xs); position: sticky; top: var(--sk-h, 0px); height: calc(100vh - var(--sk-h, 0px)); padding: var(--space-lg) var(--space-md); background: var(--bar-bg); border-right: 1px solid var(--color-border); }
  .sidebar .site-title { padding: 0 var(--space-sm) var(--space-md); font-size: 22px; }
  .sidebar-link { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 var(--space-sm); border-radius: var(--radius-control); color: var(--color-text); text-decoration: none; font-size: var(--font-label-size); }
  .sidebar-link svg { width: 20px; height: 20px; flex: none; }
  .sidebar-link:not([aria-current="page"]):hover { background: color-mix(in srgb, var(--color-text) 4.5%, transparent); }
  .sidebar-link[aria-current="page"] { background: var(--color-accent); color: var(--color-on-accent); font-weight: var(--weight-semibold); }
  .sidebar-foot { margin-top: auto; font-size: var(--font-caption-size); color: var(--color-text-muted); padding: 0 var(--space-sm); }
  .page-content { padding: var(--space-2xl) var(--space-3xl) 120px; }
}

/* ---------- type ---------- */
.page-title { font-size: var(--font-page-title-size); font-weight: var(--weight-title); letter-spacing: var(--tracking-title); line-height: 1.15; }
.page-purpose { margin-top: 6px; color: var(--color-text-muted); max-width: 62ch; }
.card-title { font-size: var(--font-card-title-size); font-weight: var(--weight-semibold); }
.section-caption { font-size: var(--font-label-size); color: var(--color-text-muted); }
.label-voice { font-size: 12px; font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-muted); }
.muted { color: var(--color-text-muted); }
.small { font-size: var(--font-caption-size); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- frame strip (one quiet line, not a card) ---------- */
.frame-chip { display: inline-flex; align-items: center; gap: 8px; margin-top: var(--space-md); padding: 6px 12px; border-radius: var(--radius-pill); border: 1px solid var(--color-border); background: var(--glass-solid); font-size: var(--font-caption-size); max-width: 100%; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-status-ok); flex: none; }

/* ---------- cards ---------- */
.page-section { padding: var(--space-md); margin-bottom: var(--space-lg); background: var(--glass-solid); border: 1px solid var(--color-border); border-radius: var(--radius-card); box-shadow: var(--shadow-glass); }
@media (min-width: 960px) { .page-section { padding: var(--space-lg); } }
.page-section > .card-title { margin-bottom: 4px; }
.page-section > .section-caption { margin-bottom: var(--space-md); }
.stack { display: flex; flex-direction: column; gap: var(--space-md); }
.row { display: flex; align-items: center; gap: var(--space-sm); flex-wrap: wrap; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 var(--space-md); border-radius: var(--radius-control); border: 1px solid var(--seg-edge); background: color-mix(in srgb, var(--color-text) 4.5%, transparent); color: var(--color-text); font-size: var(--font-label-size); font-weight: var(--weight-semibold); transition: background-color var(--motion-fast) ease, border-color var(--motion-fast) ease, opacity var(--motion-fast) ease; text-decoration: none; }
.btn:hover:not(:disabled) { background: color-mix(in srgb, var(--color-text) 9%, transparent); }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn--primary { background: var(--color-accent); color: var(--color-on-accent); border-color: transparent; box-shadow: var(--shadow-control); }
.btn--primary:hover:not(:disabled) { background: var(--color-accent-hover); }
.btn--danger { color: var(--color-status-error); border-color: color-mix(in srgb, var(--color-status-error) 45%, transparent); background: transparent; }
.btn--danger:hover:not(:disabled) { background: color-mix(in srgb, var(--color-status-error) 10%, transparent); }
.btn--danger-solid { background: var(--color-status-error); color: #fff; border-color: transparent; }
.btn--danger-solid:hover:not(:disabled) { background: color-mix(in srgb, var(--color-status-error) 85%, #000); }
.btn--quiet { border-color: transparent; background: transparent; padding: 0 var(--space-sm); }
.btn--sm { min-height: 44px; font-size: var(--font-caption-size); } /* targets stay 44px; text is smaller */
.btn svg { width: 18px; height: 18px; flex: none; }
.icon-btn { width: 44px; height: 44px; padding: 0; }

/* ---------- segmented control (the one contract: solid accent pill) ---------- */
.seg { display: flex; align-items: center; gap: 2px; padding: 2px; border: 1px solid var(--seg-edge); border-radius: var(--radius-control); background: var(--color-secondary); min-width: 0; }
.seg > button, .seg > label { flex: 1 1 0; min-width: 0; min-height: 44px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2px 6px; border: 0; border-radius: var(--radius-control); background: transparent; color: var(--seg-idle-fg); font-size: var(--font-label-size); line-height: 1.2; cursor: pointer; transition: background-color var(--motion-fast) ease, color var(--motion-fast) ease; }
.seg > button:hover:not([aria-pressed="true"]):not(:disabled), .seg > label:hover { background: color-mix(in srgb, var(--color-text) 4.5%, transparent); }
.seg > button[aria-pressed="true"], .seg > input:checked + label { background: var(--seg-selected-bg); color: var(--seg-selected-fg); font-weight: var(--weight-semibold); box-shadow: var(--shadow-control); }
.seg > input { position: absolute; opacity: 0; pointer-events: none; }
.seg > input:focus-visible + label { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.seg > button:disabled { opacity: .45; cursor: not-allowed; }
.seg--fit { display: inline-flex; }
.field-label { display: block; font-size: var(--font-label-size); font-weight: var(--weight-semibold); margin-bottom: 6px; }

/* ---------- docked toast: persistent in-flow message ---------- */
.toast { --tone: var(--color-toast-info); display: flex; align-items: flex-start; gap: 12px; padding: 10px 6px 10px 10px; border-radius: var(--radius-control); background: var(--glass-solid); border: 1px solid var(--color-border); box-shadow: var(--shadow-card); font-size: var(--font-label-size); line-height: 1.4; animation: toast-in var(--motion-fast) ease-out; }
.toast--success { --tone: var(--color-status-ok); }
.toast--warning { --tone: var(--color-status-warn); }
.toast--error { --tone: var(--color-status-error); }
.toast--pending { --tone: var(--color-status-warn); }
.toast--info { --tone: var(--color-text-muted); }
.toast__icon { display: grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--tone); color: #fff; margin-top: 1px; }
[data-theme="dark"] .toast__icon { color: #14171F; }
.toast__icon svg { width: 16px; height: 16px; }
.toast__text { flex: 1; min-width: 0; padding-top: 3px; }
.toast__title { font-weight: var(--weight-semibold); display: block; overflow-wrap: anywhere; }
.toast__detail { display: block; color: var(--color-text-muted); font-size: var(--font-caption-size); margin-top: 1px; }
.toast__action { margin-top: 6px; }
.toast__dismiss { flex: none; width: 44px; height: 44px; margin: -8px 0; display: grid; place-items: center; border: 0; background: transparent; border-radius: var(--radius-control); color: var(--color-text-muted); }
.toast__dismiss:hover { background: color-mix(in srgb, var(--color-text) 6%, transparent); }
.toast__dismiss svg { width: 16px; height: 16px; }
@keyframes toast-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* ---------- misc components ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--radius-chip); font-size: 12px; font-weight: var(--weight-semibold); background: color-mix(in srgb, var(--color-text) 8%, transparent); color: var(--color-text); white-space: nowrap; }
.badge--now { background: var(--color-accent); color: var(--color-on-accent); }
.badge--warn { background: color-mix(in srgb, var(--color-status-warn) 18%, transparent); color: var(--color-text); }
.empty-state { text-align: center; padding: var(--space-xl) var(--space-md); }
.empty-state .art { width: 120px; margin: 0 auto var(--space-md); border-radius: var(--radius-control); overflow: hidden; border: 1px solid var(--color-border); }
.empty-state h2 { font-size: 16px; font-weight: var(--weight-semibold); }
.empty-state p { margin: 4px auto var(--space-md); max-width: 46ch; color: var(--color-text-muted); font-size: var(--font-label-size); }
.privacy { display: flex; gap: 10px; align-items: flex-start; font-size: var(--font-caption-size); color: var(--color-text-muted); }
.privacy svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.thumb { position: relative; overflow: hidden; background: var(--color-secondary); }
.thumb svg, .thumb canvas { display: block; width: 100%; height: 100%; }

/* ---------- confirm dialog ---------- */
dialog.confirm { border: 1px solid var(--color-border); border-radius: var(--radius-sheet); padding: var(--space-lg); background: var(--glass-solid); color: var(--color-text); box-shadow: var(--shadow-pop); width: min(92vw, 420px); }
dialog.confirm::backdrop { background: var(--color-scrim); }
dialog.confirm h2 { font-size: var(--font-heading-size); margin-bottom: 8px; }
dialog.confirm p { color: var(--color-text-muted); margin-bottom: var(--space-lg); }
dialog.confirm .actions { display: flex; gap: var(--space-sm); justify-content: flex-end; flex-wrap: wrap; }

/* ---------- floating Cancel/Save bar ---------- */
.save-bar { position: fixed; z-index: 60; left: 8px; right: 8px; bottom: calc(var(--tab-bar-h) + 14px); display: flex; align-items: center; gap: var(--space-sm); padding: 8px 8px 8px var(--space-md); border-radius: var(--radius-pill); background: var(--color-toast-bg); color: var(--color-toast-fg); box-shadow: 0 22px 44px -16px rgba(10,12,18,.5), 0 4px 10px -2px rgba(10,12,18,.22); animation: toast-in var(--motion-fast) ease-out; }
.save-bar__msg { flex: 1; font-size: var(--font-caption-size); min-width: 0; }
.save-bar .btn { min-height: 44px; border-radius: var(--radius-pill); }
.save-bar .btn--ghost { background: transparent; border-color: rgba(255,255,255,.3); color: var(--color-toast-fg); }
.save-bar .btn--primary { background: #F4F1EC; color: #1D2028; }
@media (min-width: 960px) { .save-bar { left: calc(248px + var(--space-3xl)); right: auto; bottom: var(--space-lg); width: min(680px, calc(100vw - 248px - 128px)); } }

/* ---------- toast region (transient success) ---------- */
.toast-region { position: fixed; z-index: 70; left: 12px; right: 12px; top: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
body.chrome .toast-region { top: calc(var(--sk-h, 0px) + 12px); }
.toast-region .toast { pointer-events: auto; width: min(100%, 520px); background: var(--color-toast-bg); color: var(--color-toast-fg); border-color: transparent; box-shadow: 0 22px 44px -16px rgba(10,12,18,.5); }
.toast-region .toast .toast__detail { color: #C3C9D4; }
.toast-region .toast .toast__icon { color: #14171F; }
.toast-region .toast--success { --tone: var(--color-toast-success); }
.toast-region .toast--pending { --tone: var(--color-toast-pending); }
.toast-region .toast--info { --tone: var(--color-toast-info); }
.toast-region .toast__dismiss { color: #C3C9D4; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

</style>
<style>

.page-content { max-width: 1040px; }

.tab-bar button[aria-expanded="true"] .pill { background: color-mix(in srgb, var(--color-text) 9%, transparent); }

}

}

/* ============ segmented control: radiogroup, roving tabindex, arrow keys ============ */
function seg(name, opts, val, label, cls, where) {
  const w = where || 'p';
  return '<div class="seg ' + (cls || '') + '" role="radiogroup" aria-label="' + esc(label) + '">' + opts.map(o =>
    '<button type="button" role="radio" data-seg="' + name + '" data-v="' + o[0] + '" data-fk="seg-' + w + '-' + name + '-' + o[0] + '" aria-checked="' + (val === o[0]) + '" tabindex="' + (val === o[0] ? 0 : -1) + '">' + o[1] + '</button>').join('') + '</div>';
}
function segGet(name) {
  return { mode: S.P.mode, interval: S.P.interval, order: S.P.order, lang: LANG, theme: S.theme, panel: S.adj && S.adj.panel, fit: S.adj && S.adj.fit, show: S.adj && S.adj.show }[name];
}
function syncSegs() {
  document.querySelectorAll('[data-seg]').forEach(b => { const on = segGet(b.dataset.seg) === b.dataset.v; b.setAttribute('aria-checked', on); b.tabIndex = on ? 0 : -1; });
}
function setSeg(name, v) {
  if (name === 'lang') { LANG = v; render(); notifyParent(); return; }
  if (name === 'theme') { S.theme = v; applyTheme(); render(); return; }
  if (name === 'panel') { S.adj.panel = v; renderPage(); return; }
  if (name === 'fit' || name === 'show') { S.adj[name] = v; syncAdj(); paintAdj(false); return; }
  S.P[name] = v; render();
}
function applyTheme() { document.documentElement.setAttribute('data-theme', S.theme); }

/* ============ toasts / refusals ============ */
function flash(tone, title, detail) {
  const reg = document.getElementById('toasts');
  const n = document.createElement('div'); n.className = 'toast toast--' + tone;
  n.innerHTML = '<span class="toast__icon">' + icon('check') + '</span><span class="toast__text"><span class="toast__title">' + esc(title) + '</span>' + (detail ? '<span class="toast__detail">' + esc(detail) + '</span>' : '') + '</span>';
  reg.appendChild(n); setTimeout(() => n.remove(), 4500);
}
function refuse(kind) {
  S.refusals = S.refusals.filter(r => r !== kind).concat([kind]); render();
  const el = document.getElementById('refusals'); if (el) el.scrollIntoView({ block: 'center', behavior: 'instant' });
}
const REF_TONE = { big: 'error', quota: 'warning', fmt: 'error', heic: 'error' };
function refusalsHtml() {
  return S.refusals.map(k => '<div class="toast toast--' + REF_TONE[k] + '" role="' + (REF_TONE[k] === 'error' ? 'alert' : 'status') + '"><span class="toast__icon">' + icon('alert') + '</span><span class="toast__text"><span class="toast__title">' + esc(t('ref.' + k + '.t')) + '</span><span class="toast__detail">' + esc(t('ref.' + k + '.d')) + '</span></span>' +
    '<button type="button" class="toast__dismiss" data-act="dismiss" data-k="' + k + '" data-fk="dismiss-' + k + '" aria-label="' + esc(t('dismiss')) + '">' + icon('x') + '</button></div>').join('');
}

});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.more) { S.more = false; renderNav(); const m = document.querySelector('[data-fk="bar-more"]'); if (m) m.focus(); return; }
  const r = e.target.closest && e.target.closest('[role="radio"]');
  if (r && /^Arrow/.test(e.key)) {
    e.preventDefault(); const sibs = Array.from(r.parentElement.querySelectorAll('[role="radio"]')), i = sibs.indexOf(r);
    const nx = sibs[(i + (/Right|Down/.test(e.key) ? 1 : sibs.length - 1)) % sibs.length]; nx.focus(); setSeg(nx.dataset.seg, nx.dataset.v); return;
  }
  const s = e.target.closest && e.target.closest('[data-drag]');
  if (s && S.adj && !e.target.matches('input,button') && /^Arrow/.test(e.key)) {
    e.preventDefault(); const st = e.shiftKey ? 0.1 : 0.02, A = S.adj;
    if (e.key === 'ArrowLeft') A.px = clamp(A.px - st, 0, 1); if (e.key === 'ArrowRight') A.px = clamp(A.px + st, 0, 1);
    if (e.key === 'ArrowUp') A.py = clamp(A.py - st, 0, 1); if (e.key === 'ArrowDown') A.py = clamp(A.py + st, 0, 1);
    syncAdj(); paintAdj(true);
  }
});

/* ============ render ============ */
function renderPage() {
  if (!visiblePages().includes(S.page) && S.page !== 'account') S.page = 'home';
  const el = document.getElementById('page'); let h;
  if (S.page === 'home') h = pageHome(); else if (S.page === 'photos') h = pagePhotos(); else if (S.page === 'account') h = head(t('nav.account'), 'marie@example.fr') + '<section class="page-section"><div class="stub-line" style="margin:0;width:50%"></div><p class="small muted" style="margin-top:var(--space-md)">' + esc(t('stub.note')) + '</p></section>'; else h = pageStub(S.page);
  const fk = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.fk;
  el.innerHTML = h;
  if (S.adj) { syncAdj(); paintAdj(false); }
  if (fk) { const k = el.querySelector('[data-fk="' + fk + '"]'); if (k) k.focus({ preventScroll: true }); }
}
function render() {
  const fk = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.fk;
  document.documentElement.lang = LANG; applyTheme();
  renderNav(); renderPage(); renderSavebar();
  if (fk && document.activeElement === document.body) { const k = document.querySelector('[data-fk="' + fk + '"]'); if (k) k.focus({ preventScroll: true }); }
  document.title = 'SkyPane – ' + t(NAV[S.page] ? NAV[S.page].l : 'nav.account');
}

/* ============ walkthrough ============ */
function reset(o) {
  S.mode = o.mode; S.shown = o.shown || o.mode; S.V = { mode: o.mode, interval: '24h', order: 'random' }; S.P = Object.assign({}, S.V);
  S.photos = makePhotos(o.photos || 0); S.curId = S.photos.length ? Math.min(2, S.photos.length) : null; S.newId = null; S.more = false; S.adj = null; S.refusals = [];
  document.getElementById('toasts').innerHTML = ''; S.page = 'home';
}
const STEPS = [
  null,
  function () { reset({ mode: 'planes', photos: 0 }); go('home'); if (isTouchLayout()) { S.more = true; renderNav(); } },
  function () { reset({ mode: 'planes', photos: 0 }); go('photos'); },
  function () { reset({ mode: 'planes', photos: 0 }); go('photos'); switchToPhotos(); },
  function () { reset({ mode: 'photos', shown: 'photos', photos: 6 }); go('photos'); addPhoto(); focusOn('#photos-card'); },
  function () { reset({ mode: 'photos', shown: 'photos', photos: 7 }); go('photos'); openAdjust(5, { px: 0.3 }); },
  function () { reset({ mode: 'photos', shown: 'photos', photos: 7 }); go('photos'); refuse('heic'); focusOn('#photos-card'); },
  function () { reset({ mode: 'photos', shown: 'photos', photos: 7 }); go('photos'); S.P.mode = 'planes'; applySaved(true); },
];
function focusOn(sel) { requestAnimationFrame(() => { const el = document.querySelector(sel); if (el) el.scrollIntoView({ block: 'start', behavior: 'instant' }); }); }
function runStep(n) { S.step = n; STEPS[n](); }
function applyCmd(c) {
  if (c.cmd === 'step') runStep(c.n);
  else if (c.cmd === 'lang') { LANG = c.v; render(); }
  else if (c.cmd === 'theme') { S.theme = c.v; render(); }
  else if (c.cmd === 'opt') { S.opt[c.k] = c.v; render(); }
  else if (c.cmd === 'wake') { S.shown = S.mode; render(); }
}
function notifyParent() { if (EMBED && parent !== window) parent.postMessage({ sk: 'state', lang: LANG }, '*'); }
if (EMBED) addEventListener('message', e => { if (e.data && e.data.sk && e.data.cmd) applyCmd(e.data); });

/* ============ sketch chrome ============ */
const STEP_LABELS = ['', 'Planes mode menu', 'Photos page in planes mode', 'Switch to photos', 'Add a photo', 'Crop and preview', 'Refusal', 'Back to planes'];
const CH = { lang: LANG, theme: S.theme, step: +(q.get('step') || 0), pos: S.opt.pos, display: S.opt.display };
let frameEl = null;
function dispatch(c) {
  if (c.cmd === 'lang') CH.lang = c.v; if (c.cmd === 'theme') CH.theme = c.v; if (c.cmd === 'step') CH.step = c.n;
  if (c.cmd === 'opt') CH[c.k] = c.v;
  if (frameEl) frameEl.contentWindow.postMessage(Object.assign({ sk: 1 }, c), '*'); else applyCmd(c);
  chromePressed();
}
function chromePressed() {
  document.querySelectorAll('#sk-bar [data-sk]').forEach(b => {
    const [k, v] = b.dataset.sk.split('|'); let on = false;
    if (k === 'lang') on = CH.lang === v; if (k === 'theme') on = CH.theme === v; if (k === 'step') on = String(CH.step) === v;
    if (k === 'pos') on = CH.pos === v; if (k === 'display') on = String(CH.display ? 1 : 0) === v; if (k === 'vp') on = VP === v;
    b.setAttribute('aria-pressed', on);
  });
}
function navigateVp(v) {
  const u = new URLSearchParams(); if (v !== 'auto') u.set('vp', v); u.set('lang', CH.lang); u.set('theme', CH.theme); if (CH.step) u.set('step', CH.step); u.set('pos', CH.pos); if (CH.display) u.set('display', 1);
  location.search = u.toString();
}
function buildChrome() {
  if (q.get('chrome') === '0' || EMBED) { document.body.classList.add('nochrome'); return; }
  document.body.classList.add('chrome');
  const bar = document.createElement('div'); bar.id = 'sk-bar'; bar.className = 'sk-bar';
  const btn = (k, v, l) => '<button type="button" data-sk="' + k + '|' + v + '">' + l + '</button>';
  bar.innerHTML = '<b class="sk-title">Sketch 010 · photo-mode flow</b>' +
    '<span class="sk-group">' + btn('lang', 'en', 'EN') + btn('lang', 'fr', 'FR') + '</span><span class="sk-group">' + btn('theme', 'light', 'Light') + btn('theme', 'dark', 'Dark') + '</span>' +
    '<span class="sk-group sk-vp" aria-label="Viewport">' + btn('vp', 'auto', 'Auto') + btn('vp', 'phone', 'Phone 390') + btn('vp', 'tablet', 'Tablet 768') + btn('vp', 'desktop', 'Desktop 1280') + '</span>' +
    '<div class="sk-steps" role="group" aria-label="Walkthrough">' + STEP_LABELS.slice(1).map((l, i) => '<button type="button" data-sk="step|' + (i + 1) + '"><b>' + (i + 1) + '</b>' + l + '</button>').join('') + '</div>' +
    '<details><summary>Options</summary><div class="sk-opts"><span>Photos in menu</span><span class="sk-group">' + btn('pos', 'last', 'Last') + btn('pos', 'second', 'Second') + '</span>' +
    '<span>Style in photo mode</span><span class="sk-group">' + btn('display', '0', 'Hidden') + btn('display', '1', 'Visible') + '</span>' +
    '<span class="sk-group"><button type="button" data-sk="wake|1">Frame wakes now</button></span></div></details>';
  document.body.prepend(bar);
  bar.addEventListener('click', e => {
    const b = e.target.closest('[data-sk]'); if (!b) return; const [k, v] = b.dataset.sk.split('|');
    if (k === 'lang') dispatch({ cmd: 'lang', v: v }); if (k === 'theme') { document.documentElement.setAttribute('data-theme', v); dispatch({ cmd: 'theme', v: v }); }
    if (k === 'step') dispatch({ cmd: 'step', n: +v }); if (k === 'pos') dispatch({ cmd: 'opt', k: 'pos', v: v });
    if (k === 'display') dispatch({ cmd: 'opt', k: 'display', v: v === '1' }); if (k === 'wake') dispatch({ cmd: 'wake' });
    if (k === 'vp') navigateVp(v);
  });
  const fit = () => { document.body.style.paddingTop = bar.offsetHeight + 'px'; document.documentElement.style.setProperty('--sk-h', bar.offsetHeight + 'px'); };
  fit(); addEventListener('resize', fit); bar.querySelector('details').addEventListener('toggle', fit); setTimeout(fit, 60);
  chromePressed();
}

/* ============ boot ============ */
function boot() {
  document.documentElement.setAttribute('data-theme', S.theme);
  buildChrome();
  if (HOSTED) {
    document.getElementById('app').hidden = true; document.getElementById('tabbar').hidden = true;
    const host = document.createElement('div'); host.className = 'sk-host';
    frameEl = document.createElement('iframe'); frameEl.title = 'SkyPane companion'; frameEl.style.width = { phone: '390px', tablet: '768px', desktop: '1280px' }[VP];
    const u = new URLSearchParams(q); u.set('embed', '1'); u.delete('vp'); u.set('chrome', '0'); frameEl.src = location.pathname + '?' + u.toString();
    host.appendChild(frameEl); document.body.appendChild(host); return;
  }
  /* initial state */
  const mode = q.get('mode') === 'photos' ? 'photos' : 'planes', n = { none: 0, '7': 7, '19': 19, '20': 20 }[q.get('photos')] ;
  const step = +(q.get('step') || 0);
  if (step >= 1 && step <= 7) { runStep(step); }
  else {
    reset({ mode: mode, shown: q.get('shown') === 'photos' ? 'photos' : (q.get('shown') === 'planes' ? 'planes' : mode), photos: n === undefined ? (mode === 'photos' ? 7 : 0) : n });
    const pg = q.get('page'); go(['home', 'flights', 'detection', 'display', 'airlines', 'photos'].includes(pg) ? pg : 'home');
    if (q.get('open') && S.photos.length) openAdjust(+q.get('open'));
    if (q.get('refuse')) refuse(q.get('refuse'));
  }
  render();
}
boot();
window.SKAPP = { S: S, runStep: runStep, dispatch: dispatch };
})();
</script>
