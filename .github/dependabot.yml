# Dependabot: weekly update PRs for the two dependency surfaces this repo
# has — the pinned Python requirements under server/, and the SHA-pinned
# GitHub Actions in .github/workflows/ (Dependabot updates the SHA and the
# trailing "# vX" comment together). Security updates are raised
# independently of this schedule once enabled in the repository settings.
version: 2
updates:
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
