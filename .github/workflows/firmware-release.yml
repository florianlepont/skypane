# SkyPane — Firmware release pipeline.
#
# Pushing a tag matching fw-v* on a commit already on main builds a
# release image, signs it, verifies the signature against the
# committed public key, generates a manifest and release notes from
# git, and publishes a GitHub Release. Signing happens only here, never
# on a developer's build machine or on the VPS: the private key lives
# in the `firmware-signing` GitHub environment, which requires a human
# reviewer to approve before the key is ever released to a run, so a
# compromised laptop or a compromised server can never produce a signed
# image. Publishing a release only makes it *available* — nothing
# reaches the frame until the operator schedules it in the companion's
# Update page. This workflow's last step asks the reviewer-gated
# production deploy (ci.yml) to run, which is what actually copies the
# release onto the VPS.
name: Firmware release

on:
  push:
    tags:
      - 'fw-v*'

permissions:
  contents: read

jobs:
  release:
    name: Build, sign and publish a firmware release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: firmware-signing
    permissions:
      contents: write
      actions: write
    concurrency:
      group: firmware-release
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch every tag and main
        # actions/checkout leaves HEAD at the pushed tag; the guard step
        # below needs every fw-v* tag present (for git describe
        # --exact-match) and a local origin/main (for the ancestor check).
        run: |
          git fetch --tags --force origin
          git fetch origin main

      - name: Guard the tag shape and that it is on main
        # A tag that is malformed, or whose commit is not an ancestor of
        # main, fails here -- before any build, before Docker, and
        # before the firmware-signing environment gate is ever reached.
        run: |
          set -eu
          if ! printf '%s' "$GITHUB_REF_NAME" \
              | grep -Eq '^fw-v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$'; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match fw-vMAJOR.MINOR.PATCH"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA (tag $GITHUB_REF_NAME) is not an ancestor of origin/main"
            exit 1
          fi

      - name: Build the release firmware image
        # Same containerised build a developer runs locally; the tag
        # becomes PROJECT_VER exactly (firmware/build.sh's own release
        # mode already refuses a dirty tree or a HEAD not carrying this
        # tag before Docker starts).
        run: SKYPANE_RELEASE_TAG="$GITHUB_REF_NAME" ./firmware/build.sh

      - name: Check production configuration
        run: sh firmware/tests/check_production_config.sh built firmware/build-ee02

      - name: Check Log Line Contract
        run: sh firmware/tests/check_log_contract.sh

      - name: Sign the release image
        # The private key reaches this step only through env: -- never
        # interpolated into run: text, which would turn the key's bytes
        # into shell syntax. It is written to a 0600 temp file outside
        # the workspace (so it is never picked up by a later artifact
        # upload or checked-out tree) and the always-run step below
        # removes it whatever happens next.
        env:
          FW_SIGNING_KEY: ${{ secrets.FW_SIGNING_KEY }}
        run: |
          set -eu
          umask 077
          KEY_PATH="$RUNNER_TEMP/fw-signing-key.pem"
          printf '%s' "$FW_SIGNING_KEY" > "$KEY_PATH"
          if [ ! -s "$KEY_PATH" ]; then
            echo "::error::FW_SIGNING_KEY secret is empty"
            exit 1
          fi
          docker run --rm \
            -v "$PWD/firmware:/project" \
            -v "$KEY_PATH:/key.pem:ro" \
            -u "$(id -u):$(id -g)" \
            espressif/idf:v5.3.1 \
            espsecure.py sign_data --version 2 --keyfile /key.pem \
              --output /project/build-ee02/skypane-signed.bin \
              /project/build-ee02/skypane.bin

      - name: Remove the signing key
        if: always()
        run: |
          KEY_PATH="$RUNNER_TEMP/fw-signing-key.pem"
          if command -v shred >/dev/null 2>&1; then
            shred -u "$KEY_PATH" 2>/dev/null || true
          else
            rm -f "$KEY_PATH"
          fi

      - name: Verify the signature against the committed public key
        # The image the frame will actually download is checked here,
        # in CI, with the same public key the device itself trusts --
        # never trusting that signing "must have worked".
        run: |
          set -eu
          if [ ! -f firmware/signing/skypane-signing-pubkey.pem ]; then
            echo "::error::public key not committed; run the signing key procedure in firmware/SIGNING.md"
            exit 1
          fi
          docker run --rm \
            -v "$PWD/firmware:/project" \
            -u "$(id -u):$(id -g)" \
            espressif/idf:v5.3.1 \
            espsecure.py verify_signature --version 2 \
              --keyfile /project/signing/skypane-signing-pubkey.pem \
              /project/build-ee02/skypane-signed.bin

      - name: Generate the release manifest and notes
        # No hand-written release text: version, hash, size, date and
        # commit all come from the image and git; notes are firmware/
        # commit subjects since the previous release tag.
        run: |
          python3 scripts/fw_release_manifest.py \
            --tag "$GITHUB_REF_NAME" \
            --image firmware/build-ee02/skypane-signed.bin \
            --out release.json \
            --notes-md notes.md

      - name: Stage release assets
        # Fixed names the deploy job (plan 15) downloads by, and the
        # hardware-session USB flash (plan 16) uses directly.
        run: |
          set -eu
          cp firmware/build-ee02/skypane-signed.bin "skypane-${GITHUB_REF_NAME}.bin"
          cp firmware/build-ee02/bootloader/bootloader.bin "bootloader-${GITHUB_REF_NAME}.bin"
          cp firmware/build-ee02/partition_table/partition-table.bin "partition-table-${GITHUB_REF_NAME}.bin"
          cp firmware/build-ee02/ota_data_initial.bin "ota_data_initial-${GITHUB_REF_NAME}.bin"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "skypane-${GITHUB_REF_NAME}.bin" \
            release.json \
            "bootloader-${GITHUB_REF_NAME}.bin" \
            "partition-table-${GITHUB_REF_NAME}.bin" \
            "ota_data_initial-${GITHUB_REF_NAME}.bin" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag

      - name: Trigger the reviewer-gated production deploy
        # ci.yml gains a workflow_dispatch trigger in a later plan; until
        # then this step fails loudly, which is acceptable since no
        # release tag is pushed before the hardware session.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::notice::Release $GITHUB_REF_NAME published. Triggering ci.yml on main for the reviewer-gated production deploy; nothing reaches the frame until the operator schedules it in the companion."
          gh workflow run ci.yml --ref main
