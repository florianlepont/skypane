# SkyPane — Firmware release build.
#
# Pushing a tag matching fw-v* on a commit already on main builds both
# boards' release images and uploads the UNSIGNED images with a checksum
# list as a run artifact. Nothing else happens here: no workflow holds
# the firmware signing key, signs, publishes a release or starts another
# workflow. The owner signs on his own machine with
# `scripts/fw_publish_signed.py <tag>`, which downloads this artifact,
# checks provenance and checksums, signs with the local key, verifies
# against the committed public key and publishes the GitHub Release.
# The build is not reproducible, so the signer must use the exact bytes
# built here. Publishing a release only makes it available; nothing
# reaches the frame until the operator schedules it in the companion.
name: Firmware release

on:
  push:
    tags:
      - 'fw-v*'

permissions:
  contents: read

jobs:
  guard:
    name: Guard the tag shape and that it is on main
    # This job carries no secret and runs first, so a malformed tag or
    # an off-main commit fails loudly before any build starts. The check
    # lives in the workflow file the tag itself carries, which is why
    # the signing step (on the owner's machine) repeats it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch every tag and main
        # actions/checkout leaves HEAD at the pushed tag; the guard step
        # below needs every fw-v* tag present (for git describe
        # --exact-match) and a local origin/main (for the ancestor check).
        run: |
          git fetch --tags --force origin
          git fetch origin main

      - name: Guard the tag shape and that it is on main
        run: |
          set -eu
          if ! printf '%s' "$GITHUB_REF_NAME" \
              | grep -Eq '^fw-v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$'; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match fw-vMAJOR.MINOR.PATCH"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA (tag $GITHUB_REF_NAME) is not an ancestor of origin/main"
            exit 1
          fi

  build:
    name: Build the unsigned release images
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: firmware-release
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build the release firmware image
        # Same containerised build a developer runs locally; the tag
        # becomes PROJECT_VER exactly (firmware/build.sh's own release
        # mode already refuses a dirty tree or a HEAD not carrying this
        # tag before Docker starts).
        run: SKYPANE_RELEASE_TAG="$GITHUB_REF_NAME" ./firmware/build.sh

      - name: Check production configuration
        run: sh firmware/tests/check_production_config.sh built firmware/build-ee02

      - name: Check Log Line Contract
        run: sh firmware/tests/check_log_contract.sh

      - name: Build the second board release firmware image
        # Own build directory (firmware/build-second); the live frame's
        # build-ee02 above is not touched. The tag reaches the build
        # through env: only.
        env:
          SKYPANE_BOARD: second
          SKYPANE_RELEASE_TAG: ${{ github.ref_name }}
        run: ./firmware/build.sh

      - name: Check second board production configuration
        # Reads the generated configuration of firmware/build-second and
        # asserts the second board's hardware key and panel options, so a
        # live-frame image can never be signed and published under the
        # second board's type.
        run: sh firmware/tests/check_production_config.sh built firmware/build-second second

      - name: Collect the unsigned images and checksums
        run: |
          set -eu
          mkdir unsigned
          cp firmware/build-ee02/skypane.bin unsigned/ee02-skypane.bin
          cp firmware/build-second/skypane.bin unsigned/second-skypane.bin
          cp firmware/build-ee02/bootloader/bootloader.bin unsigned/bootloader.bin
          cp firmware/build-ee02/partition_table/partition-table.bin unsigned/partition-table.bin
          cp firmware/build-ee02/ota_data_initial.bin unsigned/ota_data_initial.bin
          cd unsigned
          sha256sum ee02-skypane.bin second-skypane.bin bootloader.bin \
            partition-table.bin ota_data_initial.bin > SHA256SUMS

      - name: Upload the unsigned images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fw-unsigned-${{ github.ref_name }}
          path: unsigned/
          retention-days: 14
          if-no-files-found: error

      - name: Point the operator to the signing script
        run: |
          echo "::notice::Unsigned images for $GITHUB_REF_NAME uploaded. Sign and publish on the owner's Mac with: scripts/fw_publish_signed.py $GITHUB_REF_NAME --key-file <path>"
