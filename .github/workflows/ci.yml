# SkyPane — CI pipeline.
#
# Runner: every job runs on the runner named by the repository variable
# CI_RUNS_ON (a JSON value such as ["self-hosted","skypane-ci"]); unset means
# GitHub-hosted ubuntu-latest. The hosted fallback is `gh variable delete
# CI_RUNS_ON`. No job has a path condition: a run that exists is always the
# whole run, because the gates in scripts/ci_gates.py need the whole suite.
# A commit that touches only Markdown, planning notes, LICENSE or the 3D model
# files under hardware/cad starts no run at all (workflow-level paths filter
# below).
#
# Every push and PR runs these jobs in parallel on Python 3.14 (matches
# production), then one aggregate job:
#   static        ruff, comment-history guard, mypy, function-size gate,
#                 shellcheck, offline systemd-unit scoring, vendored-asset
#                 attribution, and a check that every test file belongs to
#                 exactly one test group;
#   tests-core    every test file that does not drive a browser;
#   tests-browser every test file that drives Chromium.
# The two test jobs are matrices of shards; the shard counts are
# BROWSER_SHARDS and CORE_SHARDS below, and each shard runs whole test files
# chosen by scripts/ci_shards.py.
# Each shard writes its coverage data and a JUnit report as an artifact.
# `test` (check name "Lint, test, coverage, attribution") fails unless every
# job above succeeded, combines the coverage data, applies the
# pyproject.toml coverage floor to the combined result, and checks the
# JUnit totals (no failures, executed count at or above the floor, skipped
# count at or below the ceiling in scripts/ci_gates.py).
# Coverage is measured on pushes to main and manual runs only. A pull
# request runs every test, writes the JUnit report, and checks the shard
# count and the JUnit totals exactly as main does, but the shards run with
# SKYPANE_COVERAGE=off (no tracing, no .coverage file) and the coverage
# steps of `test` are skipped with a visible step-summary line. A drop below
# the floor therefore shows up on main after the merge.
# The production deploy is not part of this file: it is the separate
# deploy.yml, started by hand. A merge to main never deploys. Firmware
# builds live in their own file (firmware.yml): path-restricted triggers are
# workflow-level, not job-level.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Skips a push that touches only Markdown, planning notes, LICENSE or 3D
    # model files (safe: main requires no status checks), but re-includes docs
    # this job itself checks (VENDOR.md via check-attribution.sh,
    # deploy/README.md via test_docs.py). The 3D model files under
    # hardware/cad are the only non-Markdown files excluded, because no code
    # or test reads them. The exclusion is by file type, so any other file
    # added there (a script, a config) matches `**` and runs the whole suite.
    paths:
      - '**'
      - '!**/*.md'
      - '!.planning/**'
      - '!.claude/**'
      - '!LICENSE'
      - '!hardware/cad/**/*.stl'
      - '!hardware/cad/**/*.blend'
      - '!hardware/cad/**/*.glb'
      - '!hardware/cad/**/*.3mf'
      - 'server/assets/**/VENDOR.md'
      - 'deploy/README.md'
  pull_request:
    # Same filter as push above.
    paths:
      - '**'
      - '!**/*.md'
      - '!.planning/**'
      - '!.claude/**'
      - '!LICENSE'
      - '!hardware/cad/**/*.stl'
      - '!hardware/cad/**/*.blend'
      - '!hardware/cad/**/*.glb'
      - '!hardware/cad/**/*.3mf'
      - 'server/assets/**/VENDOR.md'
      - 'deploy/README.md'

# Least privilege: read-only GITHUB_TOKEN (repo default already is; kept
# explicit so it can't silently change).
permissions:
  contents: read

# How many shards each test group is split into. Must equal the length of the
# matching `shard` list in the matrix below: the static job checks that every
# test file lands in exactly one shard of these counts, and the `test` job
# fails unless exactly this many shard artifacts arrive.
env:
  BROWSER_SHARDS: "5"
  CORE_SHARDS: "2"

jobs:
  static:
    name: Static checks
    # A pull request from a fork never reaches a self-hosted runner. The
    # skipped job makes the `test` aggregate fail, which is intended.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    # One group per job so a PR push cancels every in-flight job of the
    # previous push but the jobs never cancel each other.
    concurrency:
      group: test-static-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Use the distro Python 3.14 (self-hosted)
        # The VM image ships distro python3.14, so setup-python's tool-cache
        # download (which may not exist for the VM's OS or architecture) is
        # not used there; the pip cache is simply absent on that runner.
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          version="$(python3.14 --version)"
          case "${version}" in
            "Python 3.14."*) ;;
            *) echo "::error::expected Python 3.14, got '${version}'"; exit 1 ;;
          esac
          bindir="${RUNNER_TEMP}/python-bin"
          mkdir -p "${bindir}"
          ln -sf "$(command -v python3.14)" "${bindir}/python"
          ln -sf "$(command -v python3.14)" "${bindir}/python3"
          echo "${bindir}" >> "$GITHUB_PATH"

      - name: Print resolved Python version
        run: python3 --version

      - name: Create virtualenv and install dependencies (hash-enforced)
        # server/requirements-dev.txt is a hash-locked superset of
        # server/requirements.txt; --require-hashes rejects any package
        # whose downloaded content doesn't match the lock.
        run: |
          python3 -m venv server/.venv
          server/.venv/bin/pip install --require-hashes -r server/requirements-dev.txt

      - name: Lint (blocking — rule set lives in pyproject.toml)
        run: server/.venv/bin/ruff check .

      - name: Comment history guard
        # Keeps plan/ticket history references out of comments, over the
        # whole tracked tree.
        run: server/.venv/bin/python scripts/check_comment_history.py check

      - name: Type check (blocking; module list lives in pyproject.toml)
        run: server/.venv/bin/mypy

      - name: Function size gate (non-test code in server/ and stub-server/)
        run: server/.venv/bin/python scripts/check_function_size.py check --max 80 server stub-server

      - name: Shellcheck deploy scripts
        # Reads each file's own shebang, so the POSIX-sh Mac scripts under
        # deploy/backup/mac/ are checked against the right dialect too.
        run: find deploy -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Score systemd units (offline, fail above 2.0)
        # Independent of deploy/tests/test_units.py's own offline-score
        # test (which skips when systemd-analyze --offline is
        # unavailable): this step always has systemd, so a regression
        # fails the job even where a local sandbox lacks it.
        run: |
          set -euo pipefail
          for u in deploy/*.service; do
            systemd-analyze security --offline=true --threshold=20 "$u"
          done

      - name: Check vendored-asset attribution completeness
        run: ./scripts/check-attribution.sh

      - name: Check every test file is in exactly one test shard
        # The test jobs select whole files by path; a file in no shard
        # would never run.
        run: server/.venv/bin/python scripts/ci_shards.py check --browser-shards "$BROWSER_SHARDS" --core-shards "$CORE_SHARDS"

  tests-core:
    name: Tests (non-browser) ${{ matrix.shard }}
    # A pull request from a fork never reaches a self-hosted runner. The
    # skipped job makes the `test` aggregate fail, which is intended.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # Shards take 15 to 20 minutes on the self-hosted runner (CI_RUNS_ON set)
    # against 7 to 10 on hosted ones, so the limit follows the runner.
    timeout-minutes: ${{ vars.CI_RUNS_ON && 45 || 20 }}
    strategy:
      # A failing shard must not hide the others' results.
      fail-fast: false
      matrix:
        shard: [0, 1]
    concurrency:
      group: test-core-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Use the distro Python 3.14 (self-hosted)
        # The VM image ships distro python3.14, so setup-python's tool-cache
        # download (which may not exist for the VM's OS or architecture) is
        # not used there; the pip cache is simply absent on that runner.
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          version="$(python3.14 --version)"
          case "${version}" in
            "Python 3.14."*) ;;
            *) echo "::error::expected Python 3.14, got '${version}'"; exit 1 ;;
          esac
          bindir="${RUNNER_TEMP}/python-bin"
          mkdir -p "${bindir}"
          ln -sf "$(command -v python3.14)" "${bindir}/python"
          ln -sf "$(command -v python3.14)" "${bindir}/python3"
          echo "${bindir}" >> "$GITHUB_PATH"

      - name: Print resolved Python version
        run: python3 --version

      - name: Create virtualenv and install dependencies (hash-enforced)
        # server/requirements-dev.txt is a hash-locked superset of
        # server/requirements.txt; --require-hashes rejects any package
        # whose downloaded content doesn't match the lock.
        run: |
          python3 -m venv server/.venv
          server/.venv/bin/pip install --require-hashes -r server/requirements-dev.txt

      - name: Run the non-browser test files
        # SKYPANE_REQUIRE_BROWSER stays on: a non-browser file that wrongly
        # needs a browser fails here instead of skipping. A partial run
        # writes coverage data only; the floor is applied to the combined
        # data by the `test` job. SKYPANE_COVERAGE=off (pull requests only)
        # runs every test without coverage tracing and writes no data.
        env:
          SKYPANE_REQUIRE_BROWSER: "1"
          SKYPANE_COVERAGE: ${{ github.event_name == 'pull_request' && 'off' || 'on' }}
          SKYPANE_TEST_GROUP: core
          SKYPANE_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          SKYPANE_JUNIT_XML: junit-core-${{ matrix.shard }}.xml
        run: ./scripts/run-all-tests.sh

      - name: Upload coverage data and JUnit report
        if: ${{ always() && github.event_name != 'pull_request' }}
        # .coverage is a dotfile: include-hidden-files is required or the
        # coverage data is silently left out of the artifact.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-data-core-${{ matrix.shard }}
          path: |
            .coverage
            junit-core-${{ matrix.shard }}.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Upload JUnit report (pull request, coverage not measured)
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-data-core-${{ matrix.shard }}
          path: junit-core-${{ matrix.shard }}.xml
          if-no-files-found: error
          retention-days: 3

  tests-browser:
    name: Tests (browser) ${{ matrix.shard }}
    # A pull request from a fork never reaches a self-hosted runner. The
    # skipped job makes the `test` aggregate fail, which is intended.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # Shards take 15 to 20 minutes on the self-hosted runner (CI_RUNS_ON set)
    # against 7 to 10 on hosted ones, so the limit follows the runner.
    timeout-minutes: ${{ vars.CI_RUNS_ON && 45 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    concurrency:
      group: test-browser-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Use the distro Python 3.14 (self-hosted)
        # The VM image ships distro python3.14, so setup-python's tool-cache
        # download (which may not exist for the VM's OS or architecture) is
        # not used there; the pip cache is simply absent on that runner.
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          version="$(python3.14 --version)"
          case "${version}" in
            "Python 3.14."*) ;;
            *) echo "::error::expected Python 3.14, got '${version}'"; exit 1 ;;
          esac
          bindir="${RUNNER_TEMP}/python-bin"
          mkdir -p "${bindir}"
          ln -sf "$(command -v python3.14)" "${bindir}/python"
          ln -sf "$(command -v python3.14)" "${bindir}/python3"
          echo "${bindir}" >> "$GITHUB_PATH"

      - name: Print resolved Python version
        run: python3 --version

      - name: Create virtualenv and install dependencies (hash-enforced)
        # server/requirements-dev.txt is a hash-locked superset of
        # server/requirements.txt; --require-hashes rejects any package
        # whose downloaded content doesn't match the lock.
        run: |
          python3 -m venv server/.venv
          server/.venv/bin/pip install --require-hashes -r server/requirements-dev.txt

      - name: Read installed Playwright version
        id: pw
        run: |
          version="$(server/.venv/bin/python -c "import importlib.metadata as m; print(m.version('playwright'))")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-headless-shell

      - name: Read the runner image version
        if: runner.environment == 'github-hosted'
        id: image
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache the operating-system packages Playwright installs
        # `playwright install --with-deps` installs a few font packages
        # through apt, and downloading them from the package mirror took
        # anywhere from seconds to over five minutes. The downloaded .deb
        # files are kept here, keyed by Playwright version and runner image,
        # and put back in apt's archive directory before the install, so apt
        # finds them instead of downloading. The same packages are still
        # installed; a package whose version changed is downloaded as before.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: playwright-os-packages-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}-${{ steps.image.outputs.version }}

      - name: Download the Chromium headless shell the browser tests drive
        # --only-shell installs just the headless shell binary the browser
        # tests launch (headless by default), not full Chromium; --with-deps
        # still installs the OS packages every run.
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          if compgen -G "${HOME}/apt-debs/*.deb" > /dev/null; then
            sudo cp "${HOME}"/apt-debs/*.deb /var/cache/apt/archives/
          fi
          list_debs() { find /var/cache/apt/archives -maxdepth 1 -name '*.deb' | sort; }
          list_debs > "${RUNNER_TEMP}/debs-before.txt"
          server/.venv/bin/python -m playwright install --with-deps --only-shell chromium
          mkdir -p "${HOME}/apt-debs"
          # Only the packages this install had to download are kept.
          list_debs | comm -13 "${RUNNER_TEMP}/debs-before.txt" - | while read -r deb; do
            cp "${deb}" "${HOME}/apt-debs/"
          done
          ls -l "${HOME}/apt-debs"

      - name: Install the Chromium headless shell (self-hosted)
        # The operating-system packages are part of the VM image.
        if: runner.environment == 'self-hosted'
        run: server/.venv/bin/python -m playwright install --only-shell chromium

      - name: Run the browser test files
        # SKYPANE_REQUIRE_BROWSER: a browser test that cannot launch
        # Chromium fails here instead of skipping (same effect as
        # CI=true, made explicit).
        env:
          SKYPANE_REQUIRE_BROWSER: "1"
          SKYPANE_COVERAGE: ${{ github.event_name == 'pull_request' && 'off' || 'on' }}
          SKYPANE_TEST_GROUP: browser
          SKYPANE_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          SKYPANE_JUNIT_XML: junit-browser-${{ matrix.shard }}.xml
        run: ./scripts/run-all-tests.sh

      - name: Upload coverage data and JUnit report
        if: ${{ always() && github.event_name != 'pull_request' }}
        # .coverage is a dotfile: include-hidden-files is required or the
        # coverage data is silently left out of the artifact.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-data-browser-${{ matrix.shard }}
          path: |
            .coverage
            junit-browser-${{ matrix.shard }}.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Upload JUnit report (pull request, coverage not measured)
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-data-browser-${{ matrix.shard }}
          path: junit-browser-${{ matrix.shard }}.xml
          if-no-files-found: error
          retention-days: 3

  test:
    name: Lint, test, coverage, attribution
    needs: [static, tests-core, tests-browser]
    # always(): a failed or skipped dependency must make this check fail,
    # not leave it skipped, because the deploy workflow requires this check
    # to be green.
    if: ${{ always() }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Require every job above to have succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] != "success"}
          for name, result in sorted(needs.items()):
              print(name, result["result"])
          if bad:
              print("not successful:", bad)
              sys.exit(1)
          EOF

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Use the distro Python 3.14 (self-hosted)
        # The VM image ships distro python3.14, so setup-python's tool-cache
        # download (which may not exist for the VM's OS or architecture) is
        # not used there; the pip cache is simply absent on that runner.
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          version="$(python3.14 --version)"
          case "${version}" in
            "Python 3.14."*) ;;
            *) echo "::error::expected Python 3.14, got '${version}'"; exit 1 ;;
          esac
          bindir="${RUNNER_TEMP}/python-bin"
          mkdir -p "${bindir}"
          ln -sf "$(command -v python3.14)" "${bindir}/python"
          ln -sf "$(command -v python3.14)" "${bindir}/python3"
          echo "${bindir}" >> "$GITHUB_PATH"

      - name: Print resolved Python version
        run: python3 --version

      - name: Create virtualenv and install dependencies (hash-enforced)
        # server/requirements-dev.txt is a hash-locked superset of
        # server/requirements.txt; --require-hashes rejects any package
        # whose downloaded content doesn't match the lock.
        run: |
          python3 -m venv server/.venv
          server/.venv/bin/pip install --require-hashes -r server/requirements-dev.txt

      - name: Download coverage data and JUnit reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-data-*
          path: test-data

      - name: Require one coverage file and one JUnit file per shard
        # A shard that was dropped from a matrix would otherwise just be
        # missing from the combined result. Not a pull request: a shard
        # without its coverage file fails here.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          expected=$((BROWSER_SHARDS + CORE_SHARDS))
          server/.venv/bin/python scripts/ci_gates.py artifacts --expected "${expected}" --with-coverage test-data

      - name: Require one JUnit file per shard (pull request, coverage not measured)
        # Same shard-count check as above; the shards ran without coverage
        # tracing, so a coverage file here would mean the run measured and
        # is refused. The summary line makes the missing coverage visible.
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          expected=$((BROWSER_SHARDS + CORE_SHARDS))
          server/.venv/bin/python scripts/ci_gates.py artifacts --expected "${expected}" --without-coverage test-data | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Combine coverage and apply the coverage floor
        # Not a pull request: pull requests run without coverage tracing and
        # are not checked against the floor; main and manual runs are.
        # No --fail-under here: [tool.coverage.report] fail_under in
        # pyproject.toml is what applies, and coverage report exits
        # non-zero below it.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in test-data/*/; do
            name="$(basename "${dir}")"
            cp "${dir}.coverage" ".coverage.${name}"
          done
          server/.venv/bin/coverage combine
          server/.venv/bin/coverage report --skip-covered | tee coverage-report.txt
          grep -E '^TOTAL' coverage-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Check test totals (no failures, executed floor, skipped ceiling)
        run: |
          set -euo pipefail
          server/.venv/bin/python scripts/ci_gates.py totals test-data/*/junit-*.xml | tee -a "$GITHUB_STEP_SUMMARY"
