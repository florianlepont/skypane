# SkyPane — CI pipeline.
#
# `test`: lint + full pytest suite (coverage gate) + attribution check,
# on Python 3.14 (matches production), every push and PR. `deploy` runs
# only after `test` succeeds, only on a push to main, and pauses for a
# human reviewer. Firmware builds live in their own file (firmware.yml):
# path-restricted triggers are workflow-level, not job-level.
name: CI

on:
  push:
    branches: [main]
    # Skips a docs-only push (safe: main requires no status checks), but
    # re-includes docs this job itself checks (VENDOR.md via
    # check-attribution.sh, deploy/README.md via test_docs.py) and never
    # excludes hardware/**/adsb-test/** since ruff lints their Python too.
    paths:
      - '**'
      - '!**/*.md'
      - '!.planning/**'
      - '!.claude/**'
      - '!LICENSE'
      - 'server/assets/**/VENDOR.md'
      - 'deploy/README.md'
  pull_request:
    # Same filter as push above.
    paths:
      - '**'
      - '!**/*.md'
      - '!.planning/**'
      - '!.claude/**'
      - '!LICENSE'
      - 'server/assets/**/VENDOR.md'
      - 'deploy/README.md'

# Least privilege: read-only GITHUB_TOKEN (repo default already is; kept
# explicit so it can't silently change).
permissions:
  contents: read

jobs:
  test:
    name: Lint, test, coverage, attribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Separate group from `deploy`: a deploy paused on reviewer approval
    # never blocks this job. Only a PR push cancels an in-flight run
    # here; a push to main never does.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Print resolved Python version
        run: python3 --version

      - name: Create virtualenv and install dependencies (hash-enforced)
        # server/requirements-dev.txt is a hash-locked superset of
        # server/requirements.txt; --require-hashes rejects any package
        # whose downloaded content doesn't match the lock.
        run: |
          python3 -m venv server/.venv
          server/.venv/bin/pip install --require-hashes -r server/requirements-dev.txt

      - name: Read installed Playwright version
        id: pw
        run: |
          version="$(server/.venv/bin/python -c "import importlib.metadata as m; print(m.version('playwright'))")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-headless-shell

      - name: Download the Chromium headless shell the browser tests drive
        # --only-shell installs just the headless shell binary the browser
        # tests launch (headless by default), not full Chromium; --with-deps
        # still installs OS packages every run (outside the cache above).
        run: server/.venv/bin/python -m playwright install --with-deps --only-shell chromium

      - name: Lint (blocking — rule set lives in pyproject.toml)
        run: server/.venv/bin/ruff check .

      - name: Comment history guard
        # Keeps history references out of comments; the pending list only
        # shrinks as files are purged.
        run: server/.venv/bin/python scripts/check_comment_history.py check

      - name: Shellcheck deploy scripts
        # shellcheck is preinstalled on the ubuntu-24.04 runner image
        # (the standard toolset). Reads each file's own shebang, so the
        # POSIX-sh Mac scripts under deploy/backup/mac/ are checked
        # against the right dialect too, no --shell override needed.
        run: find deploy -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Score systemd units (offline, fail above 2.0)
        # Independent of deploy/tests/test_units.py's own offline-score
        # test (which skips when systemd-analyze --offline is
        # unavailable): this step always has systemd, so a regression
        # fails the job even where a local sandbox lacks it.
        run: |
          set -euo pipefail
          for u in deploy/*.service; do
            systemd-analyze security --offline=true --threshold=20 "$u"
          done

      - name: Run full test suite with coverage threshold
        # SKYPANE_REQUIRE_BROWSER: a browser test that cannot launch
        # Chromium fails here instead of skipping (same effect as
        # CI=true, made explicit).
        env:
          SKYPANE_REQUIRE_BROWSER: "1"
        run: ./scripts/run-all-tests.sh

      - name: Check vendored-asset attribution completeness
        run: ./scripts/check-attribution.sh

  deploy:
    name: Deploy to production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Separate group from `test`. cancel-in-progress: false means a
    # running deploy is never killed mid-rsync; a newer queued deploy
    # only supersedes an older *pending* one. The step below is what
    # stops an approved-but-stale run from shipping old code.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    # Pauses for a required reviewer only once a "production" environment
    # with a reviewer exists in this repo's Settings — otherwise this
    # gate is inert.
    environment:
      name: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse to deploy if main has moved on to different shipped code
        # A reviewer can approve after a later push moves main past this
        # commit. Deploys only if this commit is main's tip, or main only
        # changed non-shipped paths; otherwise FAILS (never a silent
        # green skip) so the newer commit's own run is what ships it.
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if ! [[ "${latest}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not read the tip of main (got '${latest}'); refusing to deploy."
            exit 1
          fi
          if [ "${latest}" = "${GITHUB_SHA}" ]; then
            exit 0
          fi
          git fetch --quiet --depth=1 origin "${latest}"
          # Markdown-only changes never run CI (paths filter above), so
          # excluding them here stops them from blocking this deploy.
          if git diff --quiet "${GITHUB_SHA}" "${latest}" -- \
              server stub-server companion adsb-test/runway3.json deploy \
              ':(exclude,glob)**/*.md'; then
            echo "::notice::main moved to ${latest}, but shipped files are identical to ${GITHUB_SHA}; deploying."
          else
            echo "::error::Not deploying ${GITHUB_SHA}: main is now ${latest}, which changes shipped files. That commit's own run deploys it once its tests pass."
            exit 1
          fi

      - name: Load deployment SSH key into agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Trust the production host key
        # Not scanned at deploy time (trust-on-first-use would silently
        # accept an impostor); the key comes from its own secret instead.
        # Passed via env:, not interpolated into run: -- a `${{ }}` in
        # run: becomes literal script text, letting a secret value inject shell commands.
        env:
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        # Runs deploy.sh: ships the committed tree, then activate.sh
        # stages the release, swaps `current` atomically, probes services
        # and rolls back on failure. Target passed via env:, same
        # injection-prevention reason as the host key above.
        env:
          DEPLOY_SSH_TARGET: ${{ secrets.DEPLOY_SSH_TARGET }}
        run: ./deploy/deploy.sh "$DEPLOY_SSH_TARGET"
