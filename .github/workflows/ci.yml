# SkyPane — CI pipeline.
#
# Single workflow file, two jobs: `test` runs blocking lint + the full
# pytest suite (coverage gate included) + attribution check on every push
# and pull request, on the same Python version production runs (3.14),
# installing only the hash-locked `server/requirements-dev.txt` with
# `--require-hashes` so a compromised or substituted package on PyPI is
# rejected rather than silently installed. `deploy` only runs after `test`
# succeeds, only on a push to the default branch (never a pull request),
# and pauses for a human reviewer before touching the production VPS.
# Kept as one file rather than a two-file split, because a job cannot
# `needs:` a job defined in a *different* workflow file — only
# `workflow_run` crosses that boundary, and it carries its own
# well-documented pitfalls. The firmware build lives in its own file
# (firmware.yml) instead, because path-restricted triggers are a
# workflow-level feature, not a job-level one, and that build is
# independent of this pipeline.
#
# Hardening:
#   - `test` and `deploy` each carry their own job-level `concurrency`
#     group instead of sharing one at workflow level: a `deploy` sitting
#     on the production reviewer's approval can no longer block the next
#     push's `test` job from starting. `test`'s group cancels a superseded
#     PR push (never a push to `main`); `deploy`'s group
#     (`production-deploy`) never cancels a running job
#     (`cancel-in-progress: false`) — an in-flight rsync is never killed
#     half-done — but a newer queued deploy still replaces an older
#     *pending* one. To stop a reviewer approving a queued deploy whose
#     commit `main` has already moved past, the deploy job's first step
#     compares its own `github.sha` against the current tip of `main` via
#     `git ls-remote` and skips the SSH/rsync steps (with a `::notice::`)
#     when they differ.
#   - `paths-ignore` on both triggers: a docs-only change (`**/*.md`,
#     `.planning/**`, `.claude/**`, `LICENSE`) no longer runs this job at
#     all. This is safe specifically because `main` has NO branch
#     protection and NO required status checks configured in this
#     repository — a skipped run blocks nothing. Deliberately does NOT
#     ignore `hardware/**` or `adsb-test/**`: `ruff check .` lints the
#     Python in both, so excluding them would silence a real lint gate.
#   - `timeout-minutes` on every job: no job can ever consume GitHub's
#     6-hour default, whether from a genuinely hung step or a runner-side
#     stall.
#   - `cache: pip` on setup-python: server/requirements*.txt-keyed pip
#     cache, so a repeat run doesn't re-download the same wheels. The
#     Playwright headless shell gets its own cache
#     (`~/.cache/ms-playwright`), keyed on the exact installed Playwright
#     version, since the browser binary is not something pip's own cache
#     covers.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.planning/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.planning/**'
      - '.claude/**'
      - 'LICENSE'

# Least privilege for the workflow's GITHUB_TOKEN: read the repository,
# nothing else. (The repo default is already read-only; declaring it here
# keeps it read-only even if that repository setting is ever changed.)
permissions:
  contents: read

jobs:
  test:
    name: Lint, test, coverage, attribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Own group, separate from `deploy`'s: a deploy paused on reviewer
    # approval can never block this job. Only PR pushes cancel an
    # in-flight run here — a push to `main` never does, matching `deploy`
    # (see header comment above).
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Print resolved Python version
        run: python3 --version

      - name: Create virtualenv and install dependencies (hash-enforced)
        # server/requirements-dev.txt is a hash-locked superset of
        # server/requirements.txt (plan 32-12) — installing it alone with
        # --require-hashes pulls in every runtime and dev package, pinned
        # by hash, and rejects anything whose downloaded content doesn't
        # match the lock.
        run: |
          python3 -m venv server/.venv
          server/.venv/bin/pip install --require-hashes -r server/requirements-dev.txt

      - name: Read installed Playwright version
        id: pw
        run: |
          version="$(server/.venv/bin/python -c "import importlib.metadata as m; print(m.version('playwright'))")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-headless-shell

      - name: Download the Chromium headless shell companion/test_browser_ux.py drives
        # --only-shell installs just the headless shell binary the browser
        # harnesses actually launch (p.chromium.launch(), headless by
        # default) instead of the full Chromium download; --with-deps
        # still installs the OS packages every run since those aren't
        # covered by the cache above, but the browser download itself is
        # skipped whenever the cache step restored a hit.
        run: server/.venv/bin/python -m playwright install --with-deps --only-shell chromium

      - name: Lint (blocking — rule set lives in pyproject.toml)
        run: server/.venv/bin/ruff check .

      - name: Run full test suite with coverage threshold
        run: ./scripts/run-all-tests.sh

      - name: Check vendored-asset attribution completeness
        run: ./scripts/check-attribution.sh

  deploy:
    name: Deploy to production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Own group, separate from `test`'s (see header comment above).
    # cancel-in-progress: false means a running deploy is never killed
    # mid-rsync; a newer queued deploy still supersedes an older *pending*
    # one. The "Skip if stale" step below is what stops a reviewer
    # approving an already-superseded queued run from shipping old code.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    # The production environment gate below is what makes GitHub pause
    # this job for a required reviewer — but only once the "production"
    # environment actually exists, with a reviewer attached, in this
    # repository's Settings. Without it, this gate is inert and the
    # approval step silently degrades to no gate at all.
    environment:
      name: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip if this commit is no longer the tip of main
        # A reviewer can sit on the approval gate long enough for a later
        # push to move `main` past this run's commit. Rather than cancel
        # this (possibly already-running) job — which could kill an
        # in-flight rsync — the remaining steps individually no-op instead.
        id: fresh
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "${latest}" != "${{ github.sha }}" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy: ${{ github.sha }} is no longer the tip of main (now ${latest})."
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load deployment SSH key into agent
        if: steps.fresh.outputs.stale != 'true'
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Trust the production host key
        # Deliberately not scanned at deploy time: trusting whatever key
        # answers is trust-on-first-use on every single run and accepts
        # an impostor host silently. The expected key comes from its own
        # dedicated secret instead, written straight into known_hosts.
        if: steps.fresh.outputs.stale != 'true'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_HOST_KEY }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        # The only deploy action. deploy/deploy.sh owns every bit of the
        # rsync/pip/systemd-restart logic; nothing is reimplemented here.
        if: steps.fresh.outputs.stale != 'true'
        run: ./deploy/deploy.sh "${{ secrets.DEPLOY_SSH_TARGET }}"
