# SkyPane — CI pipeline.
#
# Every push and PR runs these jobs in parallel on Python 3.14 (matches
# production), then one aggregate job:
#   static        ruff, comment-history guard, mypy, function-size gate,
#                 shellcheck, offline systemd-unit scoring, vendored-asset
#                 attribution, and a check that every test file belongs to
#                 exactly one test group;
#   tests-core    every test file that does not drive a browser;
#   tests-browser every test file that drives Chromium.
# Each test job writes its coverage data and a JUnit report as an artifact.
# `test` (check name "Lint, test, coverage, attribution") fails unless every
# job above succeeded, combines the coverage data, applies the
# pyproject.toml coverage floor to the combined result, and checks the
# JUnit totals (no failures, executed count at or above the floor, skipped
# count at or below the ceiling in scripts/ci_gates.py).
# `deploy` runs only after `test` succeeds, on a push to main or a manual
# dispatch, and pauses for a human reviewer. A tagged firmware release
# publishes a GitHub Release, then dispatches this workflow on main itself
# (see firmware-release.yml) so the reviewed deploy also imports it; the
# import is idempotent, so an ordinary code-only deploy re-syncs whatever
# is already published with no extra effect. Firmware builds live in their
# own file (firmware.yml): path-restricted triggers are workflow-level, not
# job-level.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Skips a docs-only push (safe: main requires no status checks), but
    # re-includes docs this job itself checks (VENDOR.md via
    # check-attribution.sh, deploy/README.md via test_docs.py) and never
    # excludes hardware/**/adsb-test/** since ruff lints their Python too.
    paths:
      - '**'
      - '!**/*.md'
      - '!.planning/**'
      - '!.claude/**'
      - '!LICENSE'
      - 'server/assets/**/VENDOR.md'
      - 'deploy/README.md'
  pull_request:
    # Same filter as push above.
    paths:
      - '**'
      - '!**/*.md'
      - '!.planning/**'
      - '!.claude/**'
      - '!LICENSE'
      - 'server/assets/**/VENDOR.md'
      - 'deploy/README.md'

# Least privilege: read-only GITHUB_TOKEN (repo default already is; kept
# explicit so it can't silently change).
permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One group per job so a PR push cancels every in-flight job of the
    # previous push but the jobs never cancel each other.
    concurrency:
      group: test-static-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      BROWSER_SHARDS: "1"
      CORE_SHARDS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Print resolved Python version
        run: python3 --version

      - name: Create virtualenv and install dependencies (hash-enforced)
        # server/requirements-dev.txt is a hash-locked superset of
        # server/requirements.txt; --require-hashes rejects any package
        # whose downloaded content doesn't match the lock.
        run: |
          python3 -m venv server/.venv
          server/.venv/bin/pip install --require-hashes -r server/requirements-dev.txt

      - name: Lint (blocking — rule set lives in pyproject.toml)
        run: server/.venv/bin/ruff check .

      - name: Comment history guard
        # Keeps plan/ticket history references out of comments, over the
        # whole tracked tree.
        run: server/.venv/bin/python scripts/check_comment_history.py check

      - name: Type check (blocking; module list lives in pyproject.toml)
        run: server/.venv/bin/mypy

      - name: Function size gate (non-test code in server/ and stub-server/)
        run: server/.venv/bin/python scripts/check_function_size.py check --max 80 server stub-server

      - name: Shellcheck deploy scripts
        # Reads each file's own shebang, so the POSIX-sh Mac scripts under
        # deploy/backup/mac/ are checked against the right dialect too.
        run: find deploy -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Score systemd units (offline, fail above 2.0)
        # Independent of deploy/tests/test_units.py's own offline-score
        # test (which skips when systemd-analyze --offline is
        # unavailable): this step always has systemd, so a regression
        # fails the job even where a local sandbox lacks it.
        run: |
          set -euo pipefail
          for u in deploy/*.service; do
            systemd-analyze security --offline=true --threshold=20 "$u"
          done

      - name: Check vendored-asset attribution completeness
        run: ./scripts/check-attribution.sh

      - name: Check every test file is in exactly one test shard
        # The test jobs select whole files by path; a file in no shard
        # would never run.
        run: server/.venv/bin/python scripts/ci_shards.py check --browser-shards "$BROWSER_SHARDS" --core-shards "$CORE_SHARDS"

  tests-core:
    name: Tests (non-browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: test-core-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Print resolved Python version
        run: python3 --version

      - name: Create virtualenv and install dependencies (hash-enforced)
        # server/requirements-dev.txt is a hash-locked superset of
        # server/requirements.txt; --require-hashes rejects any package
        # whose downloaded content doesn't match the lock.
        run: |
          python3 -m venv server/.venv
          server/.venv/bin/pip install --require-hashes -r server/requirements-dev.txt

      - name: Run the non-browser test files
        # SKYPANE_REQUIRE_BROWSER stays on: a non-browser file that wrongly
        # needs a browser fails here instead of skipping. A partial run
        # writes coverage data only; the floor is applied to the combined
        # data by the `test` job.
        env:
          SKYPANE_REQUIRE_BROWSER: "1"
          SKYPANE_TEST_GROUP: core
          SKYPANE_TEST_SHARD: "0/1"
          SKYPANE_JUNIT_XML: junit-core.xml
        run: ./scripts/run-all-tests.sh

      - name: Upload coverage data and JUnit report
        if: ${{ always() }}
        # .coverage is a dotfile: include-hidden-files is required or the
        # coverage data is silently left out of the artifact.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-data-core
          path: |
            .coverage
            junit-core.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  tests-browser:
    name: Tests (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: test-browser-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Print resolved Python version
        run: python3 --version

      - name: Create virtualenv and install dependencies (hash-enforced)
        # server/requirements-dev.txt is a hash-locked superset of
        # server/requirements.txt; --require-hashes rejects any package
        # whose downloaded content doesn't match the lock.
        run: |
          python3 -m venv server/.venv
          server/.venv/bin/pip install --require-hashes -r server/requirements-dev.txt

      - name: Read installed Playwright version
        id: pw
        run: |
          version="$(server/.venv/bin/python -c "import importlib.metadata as m; print(m.version('playwright'))")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-headless-shell

      - name: Download the Chromium headless shell the browser tests drive
        # --only-shell installs just the headless shell binary the browser
        # tests launch (headless by default), not full Chromium; --with-deps
        # still installs OS packages every run (outside the cache above).
        run: server/.venv/bin/python -m playwright install --with-deps --only-shell chromium

      - name: Run the browser test files
        # SKYPANE_REQUIRE_BROWSER: a browser test that cannot launch
        # Chromium fails here instead of skipping (same effect as
        # CI=true, made explicit).
        env:
          SKYPANE_REQUIRE_BROWSER: "1"
          SKYPANE_TEST_GROUP: browser
          SKYPANE_TEST_SHARD: "0/1"
          SKYPANE_JUNIT_XML: junit-browser.xml
        run: ./scripts/run-all-tests.sh

      - name: Upload coverage data and JUnit report
        if: ${{ always() }}
        # .coverage is a dotfile: include-hidden-files is required or the
        # coverage data is silently left out of the artifact.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-data-browser
          path: |
            .coverage
            junit-browser.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  test:
    name: Lint, test, coverage, attribution
    needs: [static, tests-core, tests-browser]
    # always(): a failed or skipped dependency must make this check fail,
    # not leave it skipped, because `deploy` is gated on this job.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Require every job above to have succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] != "success"}
          for name, result in sorted(needs.items()):
              print(name, result["result"])
          if bad:
              print("not successful:", bad)
              sys.exit(1)
          EOF

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Print resolved Python version
        run: python3 --version

      - name: Create virtualenv and install dependencies (hash-enforced)
        # server/requirements-dev.txt is a hash-locked superset of
        # server/requirements.txt; --require-hashes rejects any package
        # whose downloaded content doesn't match the lock.
        run: |
          python3 -m venv server/.venv
          server/.venv/bin/pip install --require-hashes -r server/requirements-dev.txt

      - name: Download coverage data and JUnit reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-data-*
          path: test-data

      - name: Combine coverage and apply the coverage floor
        # No --fail-under here: [tool.coverage.report] fail_under in
        # pyproject.toml is what applies, and coverage report exits
        # non-zero below it.
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in test-data/*/; do
            name="$(basename "${dir}")"
            cp "${dir}.coverage" ".coverage.${name}"
          done
          server/.venv/bin/coverage combine
          server/.venv/bin/coverage report --skip-covered | tee coverage-report.txt
          grep -E '^TOTAL' coverage-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Check test totals (no failures, executed floor, skipped ceiling)
        run: |
          set -euo pipefail
          server/.venv/bin/python scripts/ci_gates.py totals test-data/*/junit-*.xml | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to production
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Separate group from `test`. cancel-in-progress: false means a
    # running deploy is never killed mid-rsync; a newer queued deploy
    # only supersedes an older *pending* one. The step below is what
    # stops an approved-but-stale run from shipping old code.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    # Pauses for a required reviewer only once a "production" environment
    # with a reviewer exists in this repo's Settings — otherwise this
    # gate is inert.
    environment:
      name: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse to deploy if main has moved on to different shipped code
        # A reviewer can approve after a later push moves main past this
        # commit. Deploys only if this commit is main's tip, or main only
        # changed non-shipped paths; otherwise FAILS (never a silent
        # green skip) so the newer commit's own run is what ships it.
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if ! [[ "${latest}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not read the tip of main (got '${latest}'); refusing to deploy."
            exit 1
          fi
          if [ "${latest}" = "${GITHUB_SHA}" ]; then
            exit 0
          fi
          git fetch --quiet --depth=1 origin "${latest}"
          # Markdown-only changes never run CI (paths filter above), so
          # excluding them here stops them from blocking this deploy.
          if git diff --quiet "${GITHUB_SHA}" "${latest}" -- \
              server stub-server companion adsb-test/runway3.json deploy \
              firmware/signing/skypane-signing-pubkey.pem \
              ':(exclude,glob)**/*.md'; then
            echo "::notice::main moved to ${latest}, but shipped files are identical to ${GITHUB_SHA}; deploying."
          else
            echo "::error::Not deploying ${GITHUB_SHA}: main is now ${latest}, which changes shipped files. That commit's own run deploys it once its tests pass."
            exit 1
          fi

      - name: Load deployment SSH key into agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Trust the production host key
        # Not scanned at deploy time (trust-on-first-use would silently
        # accept an impostor); the key comes from its own secret instead.
        # Passed via env:, not interpolated into run: -- a `${{ }}` in
        # run: becomes literal script text, letting a secret value inject shell commands.
        env:
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Download firmware releases
        # Every fw-v* GitHub Release's image and manifest, so deploy.sh
        # can ship them alongside the code and activate.sh can import
        # them into the VPS state directory -- idempotent, so this runs
        # on every deploy, not only one dispatched by a firmware
        # release. Zero releases (no fw-v* tag published yet) is fine:
        # the loop below simply does nothing. github.token is enough --
        # reading releases needs no more than this job's own
        # contents: read. A release missing either asset (for example a
        # release created by hand, with no release.json) is skipped with
        # a warning rather than aborting this whole step under set -e --
        # firmware bookkeeping for one malformed release must not block
        # every ordinary code deploy that follows it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p firmware-releases
          tags="$(gh release list --limit 200 --json tagName --jq '.[].tagName' \
              | grep -E '^fw-v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$' || true)"
          for tag in $tags; do
            assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            if ! printf '%s\n' "$assets" | grep -qxF "skypane-${tag}.bin" \
                || ! printf '%s\n' "$assets" | grep -qxF "release.json"; then
              echo "::warning::release ${tag} is missing skypane-${tag}.bin or release.json - skipping its firmware import"
              continue
            fi
            mkdir -p "firmware-releases/${tag}"
            gh release download "$tag" \
                --pattern "skypane-${tag}.bin" --pattern release.json \
                --dir "firmware-releases/${tag}"
          done

      - name: Deploy
        # Runs deploy.sh: ships the committed tree and every downloaded
        # firmware release, then activate.sh stages the release, imports
        # the firmware, swaps `current` atomically, probes services and
        # rolls back on failure. Both passed via env:, same
        # injection-prevention reason as the host key above.
        env:
          DEPLOY_SSH_TARGET: ${{ secrets.DEPLOY_SSH_TARGET }}
          SKYPANE_FIRMWARE_DIR: firmware-releases
        run: ./deploy/deploy.sh "$DEPLOY_SSH_TARGET"
