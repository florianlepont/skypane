# SkyPane — Firmware build workflow.
#
# Two independent jobs so a compile failure and a host-test failure
# always show separately. `host-tests` runs the hardware-free C suite
# with the system `cc`, no ESP-IDF/Docker, so it finishes without
# waiting on `build`. `build` runs firmware/build.sh directly (the exact
# command a developer runs locally, not a marketplace action) plus the
# production-config and Log Line Contract checks.
name: Firmware Build

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'

# Least privilege: read-only GITHUB_TOKEN (repo default already is; kept
# explicit so it can't silently change).
permissions:
  contents: read

jobs:
  host-tests:
    name: Firmware host tests (hardware-free)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Print host compiler version
        run: cc --version

      - name: Run firmware host tests
        run: ./firmware/tests/run_host_tests.sh

  build:
    name: Build EE02 firmware image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check production configuration
        run: sh firmware/tests/check_production_config.sh static

      - name: Check Log Line Contract
        run: sh firmware/tests/check_log_contract.sh

      - name: Create compile-only credentials header
        # firmware/main/secrets.h is gitignored and never committed. This
        # copies the tracked placeholder template so the build has the
        # four symbols it needs, incapable of connecting anywhere.
        run: cp firmware/main/secrets.example.h firmware/main/secrets.h

      - name: Build firmware image
        # Same containerised invocation used locally; the container
        # image, toolchain setup and sdkconfig flags stay owned by the
        # script, not duplicated here.
        run: ./firmware/build.sh

      - name: Verify built image artifact exists
        run: test -f firmware/build-ee02/skypane.bin

      - name: Check built image is a production build
        run: sh firmware/tests/check_production_config.sh built firmware/build-ee02
