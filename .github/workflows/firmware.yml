# SkyPane — Firmware build workflow.
#
# Two independent jobs, so a compile failure and a host-test failure
# always show as separate results. `host-tests` runs
# firmware/tests/run_host_tests.sh — every hardware-free C test compiled
# and run with the system `cc`, no ESP-IDF and no Docker — in a plain
# ubuntu-latest job with no `needs:`, so it starts and finishes without
# waiting on the container-based build below. `build` covers everything
# that does need the toolchain: it invokes firmware/build.sh directly
# (an ESP-IDF marketplace action was considered and rejected — the
# script already pins the toolchain image and the sdkconfig-defaults
# invocation, so running it as-is means CI builds with the exact same
# command the developer runs locally) plus the static and built-image
# production-config and Log Line Contract checks.
name: Firmware Build

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'

# Least privilege for the workflow's GITHUB_TOKEN: read the repository,
# nothing else. (The repo default is already read-only; declaring it here
# keeps it read-only even if that repository setting is ever changed.)
permissions:
  contents: read

jobs:
  host-tests:
    name: Firmware host tests (hardware-free)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Print host compiler version
        run: cc --version

      - name: Run firmware host tests
        run: ./firmware/tests/run_host_tests.sh

  build:
    name: Build EE02 firmware image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check production configuration
        run: sh firmware/tests/check_production_config.sh static

      - name: Check Log Line Contract
        run: sh firmware/tests/check_log_contract.sh

      - name: Create compile-only credentials header
        # firmware/main/secrets.h is gitignored and never committed
        # (firmware/.gitignore). This copies the tracked placeholder
        # template so the build has the four symbols it needs — enough
        # to prove the code compiles, incapable of connecting anywhere.
        # The real header is never committed and never touched by CI.
        run: cp firmware/main/secrets.example.h firmware/main/secrets.h

      - name: Build firmware image
        # Same containerised invocation used locally — no container
        # image reference, toolchain setup, or sdkconfig flags belong
        # here; all of that stays owned by the script.
        run: ./firmware/build.sh

      - name: Verify built image artifact exists
        run: test -f firmware/build-ee02/skypane.bin

      - name: Check built image is a production build
        run: sh firmware/tests/check_production_config.sh built firmware/build-ee02
