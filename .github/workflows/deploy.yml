# SkyPane -- production deploy.
#
# Started by hand only (workflow_dispatch); a merge to main never deploys.
# It runs on a GitHub-hosted runner so it works while any personal machine
# is off. The job is bound to the `production` environment so the deploy
# secrets can live there and a required reviewer can gate the run. There is
# deliberately no job-level condition: a refusal must fail the run loudly,
# never end as a green skip.
#
# The confirmation is an anti-accident control, not access control; access
# control is the environment's required reviewer and its secrets. See
# deploy/README.md, "Production deploy (started by hand)".
name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: First 7 characters of the tip of main
        required: true
        type: string
      ci_sha:
        description: >-
          Full SHA of the commit whose CI run counts; leave empty to use the
          tip. Needed when the tip is a commit that has no CI run
          (documentation or 3D model files only)
        required: false
        default: ''
        type: string

# Read access to the repository and to the CI check runs of a commit.
permissions:
  contents: read
  checks: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Environment secrets are only released to this job after the
    # environment's protection rules (required reviewers) pass.
    environment: production
    # cancel-in-progress: false means a running deploy is never killed
    # mid-rsync; a newer queued deploy only supersedes an older pending one.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Refuse to run from any ref other than main
        # Runs before checkout and before the deployment key is loaded.
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Refusing to deploy from ${GITHUB_REF}; start this workflow on main."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the tip of main, the confirmation and a green CI run
        # Both inputs reach the script only through env:, and are matched
        # against fixed hex patterns before any further use.
        env:
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
          CI_SHA: ${{ inputs.ci_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "${CONFIRM_SHA}" =~ ^[0-9a-f]{7}$ ]]; then
            echo "::error::confirm_sha must be exactly 7 lowercase hex characters."
            exit 1
          fi
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if ! [[ "${latest}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not read the tip of main (got '${latest}'); refusing to deploy."
            exit 1
          fi
          if [ "${latest}" != "${GITHUB_SHA}" ]; then
            echo "::error::Not deploying ${GITHUB_SHA}: main is now ${latest}."
            exit 1
          fi
          if [ "${GITHUB_SHA:0:7}" != "${CONFIRM_SHA}" ]; then
            echo "::error::confirm_sha ${CONFIRM_SHA} does not match the tip of main (${GITHUB_SHA:0:7})."
            exit 1
          fi
          ci_commit="${CI_SHA:-${GITHUB_SHA}}"
          if [ -n "${CI_SHA}" ]; then
            if ! [[ "${CI_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::ci_sha must be a full 40-character lowercase hex SHA."
              exit 1
            fi
            git fetch --quiet --depth=1 origin "${CI_SHA}"
            # Commits that never run CI (Markdown, 3D model files) may sit
            # between the CI commit and the tip; any shipped path may not.
            if ! git diff --quiet "${CI_SHA}" "${GITHUB_SHA}" -- \
                server stub-server companion adsb-test/runway3.json deploy \
                firmware/signing/skypane-signing-pubkey.pem \
                ':(exclude,glob)**/*.md'; then
              echo "::error::Shipped files differ between ci_sha ${CI_SHA} and the tip ${GITHUB_SHA}."
              exit 1
            fi
          fi
          conclusions="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${ci_commit}/check-runs" --paginate \
              --jq '.check_runs[] | select(.name == "Lint, test, coverage, attribution") | .conclusion')"
          if [ -z "${conclusions}" ]; then
            echo "::error::No CI check run found for ${ci_commit}."
            exit 1
          fi
          if printf '%s\n' "${conclusions}" | grep -qvx 'success'; then
            echo "::error::The CI check for ${ci_commit} is not successful."
            exit 1
          fi

      - name: Load deployment SSH key into agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Trust the production host key
        # Not scanned at deploy time (trust-on-first-use would silently
        # accept an impostor); the key comes from its own secret instead.
        # Passed via env:, not interpolated into run: -- a `${{ }}` in
        # run: becomes literal script text, letting a secret value inject shell commands.
        env:
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Download firmware releases
        # Every fw-v* GitHub Release's image and manifest, so deploy.sh
        # can ship them alongside the code and activate.sh can import
        # them into the VPS state directory -- idempotent, so this runs
        # on every deploy, not only one dispatched by a firmware
        # release. Zero releases (no fw-v* tag published yet) is fine:
        # the loop below simply does nothing. github.token is enough --
        # reading releases needs no more than this job's own
        # contents: read. A release missing either asset (for example a
        # release created by hand, with no release.json) is skipped with
        # a warning rather than aborting this whole step under set -e --
        # firmware bookkeeping for one malformed release must not block
        # every ordinary code deploy that follows it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p firmware-releases
          tags="$(gh release list --limit 200 --json tagName --jq '.[].tagName' \
              | grep -E '^fw-v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$' || true)"
          for tag in $tags; do
            assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            # scripts/fw_release_assets.py allow-lists the names: the
            # legacy pair plus every typed pair with a valid key. Exit 1
            # means no complete pair, so the tag is skipped.
            wanted_rc=0
            wanted="$(printf '%s\n' "$assets" | python3 scripts/fw_release_assets.py "$tag")" || wanted_rc=$?
            if [ "$wanted_rc" -ne 0 ]; then
              echo "::warning::release ${tag} is missing skypane-${tag}.bin or release.json - skipping its firmware import"
              continue
            fi
            mkdir -p "firmware-releases/${tag}"
            while IFS= read -r name; do
              gh release download "$tag" \
                  --pattern "$name" \
                  --dir "firmware-releases/${tag}"
            done <<< "$wanted"
          done

      - name: Deploy
        # Runs deploy.sh: ships the committed tree and every downloaded
        # firmware release, then activate.sh stages the release, imports
        # the firmware, swaps `current` atomically, probes services and
        # rolls back on failure. Both passed via env:, same
        # injection-prevention reason as the host key above.
        env:
          DEPLOY_SSH_TARGET: ${{ secrets.DEPLOY_SSH_TARGET }}
          SKYPANE_FIRMWARE_DIR: firmware-releases
        run: ./deploy/deploy.sh "$DEPLOY_SSH_TARGET"
